[project]
name = "ocr-gateway"
version = "0.3.2"
description = "Single-instance OCR gateway aggregating Baidu and Tencent OCR free quotas"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "cryptography>=43",
    "itsdangerous>=2.2",
    "cachetools>=5.4",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "tzdata>=2024.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
local = [
    "rapidocr>=3.10,<4",
    "onnxruntime>=1.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "contract: real-vendor contract tests, skipped unless local credentials are configured",
    "slow: heavy benchmarks; run explicitly with -m slow",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["cachetools.*", "itsdangerous.*", "respx.*"]
ignore_missing_imports = true
