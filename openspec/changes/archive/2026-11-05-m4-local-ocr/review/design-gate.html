resh-subagent(6 镜)\r\nmemo: ok\r\n---\r\n\r\n# Spec Review Report · m4-local-ocr\r\n\r\n\u003e ⚠️ **同模型 fresh-context**：隔离的是上下文，不是模型盲点。\r\n\u003e\r\n\u003e 派发镜：对抗镜 ×3（隐藏假设 / 失败模式与并发 / 乐观估计与边界）+ 领域镜 ×3（backend / frontend-react / devex）= 6 个 fresh-context 只读子代理（`Explore`），全部成功、无回退、无截断。广审双镜（strategy / plan-eng）与接地镜由主 session 完成——三者带生成历史，存在自查偏置，结论按「主 session 自审」降级对待。\r\n\u003e\r\n\u003e 评审对象：`228b79d` 的四件套 + `decision-memo.md`（`check_decision_memo.py` 退出 0；`openspec validate m4-local-ocr --strict` 通过）。\r\n\u003e\r\n\u003e 合并后 37 条：高 12 · 中 11 · 低 14。所有 finding 的引文均来自本会话亲验或子代理 `file:line:quote`；外部事实（wheel 体积、RapidOCR 懒加载细节）标「未经接地」。\r\n\r\n---\r\n\r\n## 拍板三问\r\n\r\n**Q-scope 范围划界认不认？**\r\n自答：锚 `proposal.md` `## Non-Goals`（不做模型下载/本地独立配额/多并发调优/GPU/多实例广播/批量 PDF）与 `design.md` `## Goals / Non-Goals`（不改云账号候选/排序/冷却；不做跨实例协调）。评审认为边界总体成立，但 **Non-Goals「不做本地独立配额」的假设 A2「本地只在云全挂时承接」与显式 `provider=local` 冲突**——显式 local 何时都可调用，见 R-15。请一并确认这一划界。\r\n[x] 认 [ ] 不认\r\n\r\n**Q-deps 依赖/顺序认不认？**\r\n自答：锚 `design.md` `## 切片与依赖`（T1 引擎与进程池 → T2 公共路由/T4 管理端 → T3 记账 → T5 镜像文档；T3 依赖 T2 的事件来源）。依赖链本身成立；但 T1 需补「可 kill 的进程池 / generation」、T3 需补「`models.py` 同步」，否则任务顺序对而实现会返工（R-03/R-07/R-10）。\r\n[x] 认 [ ] 不认\r\n\r\n**Q-risk 风险赌注与对策认不认？**\r\n自答：锚 `design.md` `## Risks / Trade-offs` 6 条 + `decision-memo.md` `## 接受的边角` 6 条。评审认为还缺 3 项风险：运行中任务不可取消（R-03）、兄弟请求被池重建取消（R-12）、`python:3.12-slim` 系统库未显式验证（R-36）。接受这些风险的话，需把「可 kill 池」的成本计入 T1。\r\n[x] 认 [ ] 不认\r\n\r\n---\r\n\r\n## 决策登记区\r\n\r\n\u003e `[需拍板]` 在主 session 无法单方面定；`[自动决策]` 已按通则自行裁决并落入 amendment，可覆盖。\r\n\r\n## 拍板结果（人 2026-11-04）\r\n\r\n人已批准进入设计 HARD-GATE，并按推荐拍板：\r\n\r\n- **Q1 → B**：`multiprocessing.get_context(\"spawn\").Pool`（可 `terminate()`）；已落入 design 组件职责与 tasks 1.2。\r\n- **Q2 → A**：`reserve_eff` clamp；已落入 design 预算不变量、R-SCH-07 与 tasks 2.2。\r\n- **Q3 → A**：overview 增加 `local` 行（`accounts=0`）；已落入 R-ADM-09 delta、design 可观测性、tasks 3.4。\r\n- **Q4 → A**：保持 D3，修正理由并写明仅受 Key RPM/并发；已落入 proposal Non-Goals、R-QTA-01、tasks 5.2。\r\n- 拍板三问：范围 **认** / 依赖 **认** / 风险 **认**。\r\n- 窄复核（增量）：Q1/Q3/Q4 的二次修订只触及上述段落与 R-ADM-09 delta；`openspec validate --strict` 通过，R-ADM-09 的 7 条既有 scenario 全部保留并新增「本地厂商行」。\r\n\r\n### [需拍板]\r\n\r\n**Q1 进程池的「超时即回收」机制（对应 R-03，高）**\r\n\r\n现状设计用 `ProcessPoolExecutor` + `shutdown(wait=False, cancel_futures=True)` 重建池。该 API 只能取消**尚未开始**的任务，**不能终止正在推理的进程**；卡死任务会作为孤儿进程继续占用 200–300MB 与 CPU，每次超时累积一个。\r\n\r\n- 选项 A：自管 `Process + Queue`（每个 worker 一个进程，可 `terminate()/kill()`）——控制力最强，代码量最大。\r\n- 选项 B：改用 `multiprocessing.get_context(\"spawn\").Pool`（自带 `terminate()`/`kill()`，超时后整池回收）——代码量最小，语义最直接；代价是放弃 `ProcessPoolExecutor` 的 future API，需自行包一层。**推荐**。\r\n- 选项 C：保留 `ProcessPoolExecutor`，在 spec 写明「运行中任务不可取消」并接受孤儿进程——与 `R-LOC-04「避免一个卡死任务永久占住唯一 worker」` 直接冲突，不推荐。\r\n\r\n推荐 B。系统镜：多一个自管类，但回收语义可测试；用户镜：超时可恢复；开发循环镜：不引入新依赖，fake pool 可注入。主次判定：**正确性优先于 API 便利**。\r\n\r\n**Q2 预算预留策略（对应 R-01，高）**\r\n\r\n`request_deadline_ms` 允许 1000–20000ms，而 reserve 固定 5000ms；`deadline \u003c reserve` 时云阶段截止落在过去，auto 连健康云账号都不试。\r\n\r\n- 选项 A：`reserve_eff = min(LOCAL_OCR_RESERVE_MS, max(0, total - LOCAL_OCR_MIN_BUDGET_MS))`，且仅在 `total ≥ reserve_eff + min_budget` 时启用本地兜底。**推荐**。\r\n- 选项 B：启用 local 时校验 `request_deadline_ms ≥ reserve + min_budget`，把 ≤6s 的设置拒掉；需同步改 R-ADM-08 的 1000ms 下限断言。\r\n- 选项 C：按比例预留（如 total 的 25%，上限 5s）——行为更难解释，不推荐。\r\n\r\n推荐 A：不改既有设置范围，预算过小时退化为「本地不兜底」，与本地禁用等价；status 暴露 `effective_reserve_ms`。代价：管理员把小预算 + 开本地时，auto 仍只走云，需要在状态/日志里说明。\r\n\r\n**Q3 总览是否给 `local` 加一行（对应 R-13，中）**\r\n\r\n`today.requests` 已包含 `provider=local` 事件，但 provider 行硬编码 `(\"baidu\",\"tencent\")`；D10 又明确「overview 的 provider 列表不加 local」。结果是 R-ADM-09 的「今日总数与厂商行对账」被打破（现有代码注释 `admin.py:720` 正说明这是刻意维持的契约）。\r\n\r\n- 选项 A：加 `local` 行（`accounts=0`、`available_accounts=0`），同步 MODIFY R-ADM-09 与 D10。**推荐**。\r\n- 选项 B：`today.requests` 剔除 local 事件——本地用量从总览消失，不推荐。\r\n- 选项 C：维持 D10，接受对账差——需要在 R-ADM-09 写明例外，且面板会出现「总数 \u003e 行和」。\r\n\r\n推荐 A。系统镜：一行数据、无新查询；用户镜：本地用量可见且对账成立；开发循环镜：改两处硬编码 + 一个测试。主次判定：**对账正确性优先于「local 无账号不进行」的洁癖**。\r\n\r\n**Q4 显式 `provider=local` 是否受用户日限额（对应 R-15，中）**\r\n\r\nD3 定 `quota_used=0`，memo 的接受理由写「概率低（仅云全挂时触发）」——但显式 `provider=local` 在任何时候都可用，该理由不成立。当前实际约束只剩 Key RPM + 全局并发。\r\n\r\n- 选项 A：保持 D3，修正接受理由，明确「显式 local 是仅受 RPM/并发约束的免额度通道」，README/安全说明写明，记 todo。**推荐**（M4 范围外）。\r\n- 选项 B：本地事件计入日限额（`quota_used=1`）——破坏「配额=厂商额度」语义，面板多处口径要改。\r\n- 选项 C：新增本地专用日计数与限额——新字段/迁移/面板，超出 M4。\r\n\r\n推荐 A。代价：存在被单 Key 持续占用 CPU 的滥用面（全局并发 8、本地 1 worker 会排队并超时，影响可控）。若人不接受，需另开 change，不要在本 change 塞入。\r\n\r\n### [自动决策]\r\n\r\n| ID | 对应 | 决策 | 理由 |\r\n| --- | --- | --- | --- |\r\n| D1 | R-02 | 缓存读取前做 provider 可用性门禁；`local_ocr_enabled` 变化视为缓存参数变化（清空缓存并在响应标记 `cache_cleared`） | 403 契约必须优先于缓存命中；清缓存成本低且与既有配置变更语义一致 |\r\n| D2 | R-04 | 成功响应的 `quota.used` 与 `usage_event.quota_used` 都由 `result.provider` 派生（local→0） | 消除 `public.py` 两处硬编码 1；R-API-05 已要求 local=0 |\r\n| D3 | R-05 | lifespan 在 `local_ocr_enabled \u0026\u0026 installed` 时调用 `set_enabled(true)` | R-ADM-08「重启后新值仍生效」与 R-LOC-05「启用后建池预热」的必然推论 |\r\n| D4 | R-06 | MODIFY R-SCH-03：总 deadline 不变，auto 云阶段用 `deadline − reserve_eff` 子 deadline，本地阶段用总 deadline | 消除两条权威需求的冲突；保留既有「同一绝对 deadline」的意图 |\r\n| D5 | R-07 | task 3.1 同时修改 `models.py` 的 `ck_usage_provider`，并加 `create_all` 插入 local 的测试 | 测试建库走 `Base.metadata.create_all`，ORM 不同步会让 local 事件在单测里直接 IntegrityError |\r\n| D6 | R-08 | 账号域保留 `ProviderCode = baidu\\|tencent`；新增 `EventProvider = ProviderCode \\| auto \\| local` 供日志/用量/标签/`ProviderRow.code`（Q3 后 overview 也返回 local 行）；账号/凭证映射仍用 `ProviderCode` | 防止账号创建 UI 被 local 污染；memo C6「改 types.ts:1」按此修正 |\r\n| D7 | R-09 | 依赖缺失 → `unavailable`（不建池，显式 local 仍 403）；模型加载失败 → `error`；同步状态图/JSON/spec | 两份 spec 已写 unavailable，只有 design 状态机漏了 |\r\n| D8 | R-10 | `set_enabled` 幂等且仅在状态变化时执行；enable/disable/rebuild 分配自增 generation，回调先比对 generation；disable 清 ready event | 防止迟到 warmup 覆盖新状态、重复建池 |\r\n| D9 | R-11 | warmup 用含文字的小图并断言返回非空；warmup 加超时（≤ ready 等待上限），超时置 `error` | 1×1 白图在检测阶段即返回，不能证明 rec/cls 已加载；warmup 卡住会让 starting 永久停留 |\r\n| D10 | R-12 | 用 generation 区分「本轮超时」与「被重建取消」；后者映射 503/504 并写 usage_event；只允许超时 owner 单飞重建 | 否则兄弟请求收到 `CancelledError` → 500 且无事件 |\r\n| D11 | R-14 | tasks 3.3 增 usage-page 下拉与 `provider=local` URL 断言；admin-api delta 增 MODIFIED R-ADM-06（local 标签「本地 RapidOCR」） | task 引用了 R-ADM-06，但 change 的 delta 里没有该需求 |\r\n| D12 | R-16 | Success Metric 改为「成功=200 且 provider=local；504 单独计失败并给阈值」；p95 用固定 N 次基准脚本（或 status 增 histogram） | `last_latency_ms` 是单样本，算不出 p95；「200 或 504」把失败计入成功 |\r\n| D13 | R-17 | tasks 增独立验收步骤：装 extra 后 `pytest -m slow`、镜像内断网启动并轮询 status 到 ready；把「镜像冒烟脚本」列为交付物 | 默认 `addopts = -m 'not slow'`，P0 的真实引擎/离线就绪在默认流程里永不执行 |\r\n| D14 | R-18 | warmup 失败加最小重试间隔（30s）+ 指数退避；请求路径不同步等待重试；status 暴露 `next_retry_in_ms` | 确定性加载失败会被每个云故障请求反复触发 |\r\n| D15 | R-19 | 显式 local 先取 local gate（= max_workers）再取全局信号量；auto 兜底阶段在全局槽内取 local gate | 排队本地请求不再占满全局并发槽 |\r\n| D16 | R-20 | design 增 copy 表：403（开关关闭 vs 依赖缺失两种 cause/fix）、502、504 的 problem/cause/fix 原文；写明 `/v1/providers.enabled` 的合并语义 | DX-02 判定 UNVERIFIABLE（只有错误码没有文案） |\r\n| D17 | R-21/R-22 | 回滚命令改 `alembic downgrade -1`（或 `7c1f0d2a9b31`）+ `--entrypoint` 覆盖；tasks 5.1/5.2 列全部版本源与文档落点 | 0002 的 revision 不是 `0002`；entrypoint 启动即 `upgrade head` |\r\n| D18 | R-25 | design 增 auto 兜底 + 超时重建的 ASCII 序列图 | TG-10（跨 3+ 组件）与 TG-26（并发）双重命中，design-diagrams 要求序列图 |\r\n| D19 | R-26～R-37 | 低项批量修订：worker initializer 清理敏感 env、`mp_context` 写法、last_error 脱敏、shutdown 上限、local 规范化表述、status effective timeout、`LOCAL_OCR_*` 权威表、面板三态/轮询/部分提交、README `--extra local`、迁移行数评估、slim 系统库验证、ready 阈值统一 | 均为低成本修正，不改变架构 |\r\n\r\n### [已裁掉]\r\n\r\n| ID | 原始发现 | 裁掉理由 |\r\n| --- | --- | --- |\r\n| X1 | 「兜底失败要写两条 usage_event（云+本地）」 | 不成立：`request_id` 唯一（`models.py:115`），设计原意是 local 分支成功/失败各记一条，不是同一请求两条 |\r\n| X2 | 「auto 兜底的 local 结果不应进入 auto 缓存」 | 部分不成立：R-CAC-01 允许缓存实际服务成功的结果；开关切换清缓存后，云恢复前返回缓存 local 属正常缓存语义。只保留「清理」要求，不另设回退标记 |\r\n| X3 | 「`ProcessPoolExecutor(spawn, ...)` 是硬错误」 | 降级为低：design 是图形简写，不构成 API 契约；已在 R-27 要求改为 `mp_context` |\r\n| X4 | 「local 要保留原始字节才能满足 10MB，与 EXIF 旋转冲突」 | 不成立：设计意图是「旋转/重编码后按 JPEG 字节计上限」，不是保留原字节；已在 R-30 纠正表述 |\r\n| X5 | 「BE-11 要求 SLA/RTO/RPO」 | N/A：单实例自托管工具，proposal 未承诺 SLA；不新增 |\r\n| X6 | 「BE-09 要求 zero-downtime」 | N/A：单实例部署，维护窗口可接受；不新增 |\r\n\r\n---\r\n\r\n## 合并发现与裁决\r\n\r\n\u003e 每条给出：命中镜 / 证据（亲验或子代理引文）/ 裁决。/ 严重度：高=阻断，中=实现期返工，低=记录即可。\r\n\r\n### 高\r\n\r\n#### R-01 预算预留与 `request_deadline_ms` 下限冲突\r\n- **命中**：ADV-A / ADV-B / ADV-C / ENG\r\n- **证据**：`design.md:69`「`auto` 且本地可用 → 云阶段截止 `deadline - reserve`」；`design.md:72`「本地单次超时 = `min(LOCAL_OCR_TIMEOUT_MS, deadline - now)`；剩余 \u003c `LOCAL_OCR_MIN_BUDGET_MS`（默认 1000）时不再尝试本地」；`backend/app/runtime_settings.py:81-87`「`request_deadline_ms` … minimum=1000 / maximum=20000」；`backend/app/config.py:71`「request_deadline_ms: int = 20000」；`decision-memo.md:20`「auto+本地启用时云阶段为本地预留 5s」\r\n- **裁决**：成立。预算 1–5s 时云阶段 deadline 已过，auto 连健康云账号都不尝试；预算 1–4s 时本地也因剩余 \u003c1s 放弃 → 直接 504。需引入 `reserve_eff` 并写入 R-SCH-07；见 Q2。\r\n\r\n#### R-02 缓存命中先于 local 可用性门禁；开关切换不清缓存\r\n- **命中**：ADV-A / ADV-B / ADV-C / BE\r\n- **证据**：`backend/app/api/public.py:218-219`「cache_key = … / cached = state.cache.get(cache_key)」位于 `Scheduler` 与 `provider` 校验之前；`backend/app/api/public.py:312`「state.cache.set(cache_key, payload)」；`backend/app/core/cache.py:35`「return f\"{digest}:{language}:{provider}\"」；`backend/app/api/admin.py:1094`「cache_cleared = state.cache.reconfigure(...)」；`specs/ocr-api/spec.md:6`「显式 `local` 在本地 OCR 未启用或依赖不可用时 MUST 返回 403」；`openspec/specs/result-cache/spec.md:9`「命中时 MUST 返回 cached=true、quota.used=0，且不发起厂商调用」\r\n- **裁决**：成立。关闭开关后，显式 local 仍可能命中旧缓存返回 200；auto 缓存键下也可能返回 `provider=local`。修：门禁前置 + 开关变化清缓存。新增 `result-cache` delta。\r\n\r\n#### R-03 超时不能终止运行中的 worker；重建池不回收旧进程\r\n- **命中**：ADV-A / ADV-B / ADV-C / BE\r\n- **证据**：`design.md:112`「单次超时：取消 future、`shutdown(wait=False, cancel_futures=True)` 重建池并回到 `starting`……避免一个卡死任务永久占住唯一 worker」；`specs/local-ocr/spec.md:42`「超时 MUST 返回 504 `TIMEOUT`，MUST 取消排队任务并重建进程池」\r\n- **裁决**：成立（Python 语义：`cancel_futures` 只取消 pending，`shutdown(wait=False)` 不终止运行中进程）。设计目标与机制矛盾。见 Q1。\r\n\r\n#### R-04 本地成功仍会写 `quota_used=1` / 响应 `quota.used=1`\r\n- **命中**：ADV-B / ENG\r\n- **证据**：`backend/app/api/public.py:323`「quota_used=1,」；同文件成功响应 `_response_payload(..., False, 1)`（约 334-335 行）；`specs/ocr-api/spec.md` R-API-05「`quota.used` … 对本地识别成功 MUST 为 0」；`specs/quota-accounting/spec.md` R-QTA-01「本地识别成功 MUST 记 `quota_used=0`」\r\n- **裁决**：成立。事件侧 task 3.2 已覆盖，但响应侧与既有硬编码未进任务；两处都必须由 `result.provider` 派生。\r\n\r\n#### R-05 持久化的 `local_ocr_enabled` 重启后不恢复\r\n- **命中**：ADV-A / ADV-B / ADV-C / BE\r\n- **证据**：`backend/app/main.py:65`「runtime = await load_runtime_settings(session, resolved)」；`backend/app/main.py:83`「state = AppState(」——lifespan 无 `set_enabled`；`design.md:97`「stopped --\u003e starting: set_enabled(true)」是唯一启动路径；`tasks.md:9` 只要求「装配与关闭」；`specs/admin-api/spec.md:13`「其余设置保持不变，重启后新值仍生效」\r\n- **裁决**：成立。重启后 `enabled=true` 但 `state=stopped`，显式 local 既不满足 403 条件也不可用。\r\n\r\n#### R-06 R-SCH-03 与 R-SCH-07 的 deadline 语义冲突\r\n- **命中**：ADV-A / STR\r\n- **证据**：`openspec/specs/account-pool-scheduling/spec.md:32`「`public.py` 的外层等待与 `Scheduler` MUST 使用同一个绝对 deadline」；`specs/account-pool-scheduling/spec.md:22-24` R-SCH-07「云阶段截止 MUST 为总 deadline 减去本地预留预算」；change 只 MODIFY R-SCH-05，未改 R-SCH-03\r\n- **裁决**：成立。两条权威需求可互相违反；需 MODIFY R-SCH-03 明确「总 deadline 不变 + 云阶段子 deadline」的例外。\r\n\r\n#### R-07 `models.py` 的 `ck_usage_provider` 未列入 task 3.1\r\n- **命中**：ADV-B / BE\r\n- **证据**：`backend/app/models.py:137`「provider IN ('baidu', 'tencent', 'auto'), name=\"ck_usage_provider\"」；`backend/tests/conftest.py:45`「await connection.run_sync(Base.metadata.create_all)」；`tasks.md:23` 只写「新增 Alembic `0003` 迁移」\r\n- **裁决**：成立。测试建库走 `create_all`，ORM 不同步会让 local 事件在单测直接 IntegrityError。\r\n\r\n#### R-08 `ProviderCode` 复用于账号/事件/总览导致类型与语义冲突\r\n- **命中**：ADV-A / BE / FE / DX\r\n- **证据**：`frontend/src/types.ts:1`「export type ProviderCode = \"baidu\" | \"tencent\";」；同文件 `ProviderRow.code: ProviderCode`；`frontend/src/pages/accounts-page.tsx:49`「const CREDENTIAL_FIELDS: Record\u003cProviderCode, …\u003e = {」；同文件 `provider: z.enum([\"baidu\", \"tencent\"])`；`decision-memo.md:41`「frontend/src/types.ts:1」列为需改\r\n- **裁决**：成立。直接扩 union 会逼账号 UI 为 local 配凭证，且与 D10「总览不加 local」冲突。拆类型。Q3 拍板让 overview 也返回 local 行后，`ProviderRow.code` 必须使用展示联合（含 local）；账号/凭证映射仍只接受 baidu/tencent。\r\n\r\n#### R-09 `unavailable` 状态在 design 状态机缺失，与两份 spec 冲突\r\n- **命中**：ADV-A / ADV-B / BE / DX\r\n- **证据**：`design.md:99`「starting --\u003e error: 依赖缺失/模型加载失败」；`specs/local-ocr/spec.md:53`「状态按 `stopped`/`starting`/`ready`/`error`/`unavailable` 报告」；`specs/admin-api/spec.md:63`「返回 `installed=false`、`state=\"unavailable\"`」\r\n- **裁决**：成立。按 spec 统一：依赖缺失=unavailable（不建池）；模型加载失败=error。\r\n\r\n#### R-10 状态机缺少 generation / 幂等；迟到 warmup 覆盖、重复建池\r\n- **命中**：ADV-B\r\n- **证据**：`design.md:109`「`set_enabled(true)` 只负责建池并提交 warmup」；`design.md:112`「重建池并回到 starting」；`design.md:151`「开关在请求中变更…在跑任务跑完」；`tasks.md:32`「`_apply_settings` 在 commit 后调用 `LocalEngine.set_enabled`」\r\n- **裁决**：成立。若每次保存都无条件 `set_enabled(true)`，ready 状态可能再建一个池；disable 后迟到的 warmup 也可把状态改回 ready。需 generation + 幂等 + disable 清 event。\r\n\r\n#### R-11 warmup 用 1×1 白图可能未加载 rec/cls；warmup 无超时\r\n- **命中**：ADV-A / BE\r\n- **证据**：`design.md:7`「`RapidOCR()` 构造不加载模型，首次调用才加载」；`design.md:110`「warmup 用 1×1 白图跑一次完整 pipeline，成功才算 `ready`（覆盖模型加载）」；`design.md:111`「`starting` 期间的本地请求等待就绪事件，最多等 min(10s, 剩余预算)」\r\n- **裁决**：成立（中高）。1×1 白图在检测阶段通常无候选框，rec/cls 不会执行，「覆盖模型加载」的结论未经验证；warmup 卡住时状态永久 `starting`。修：含文字小图 + warmup 超时。\r\n\r\n#### R-12 池重建取消兄弟请求的排队 future → `CancelledError` → 500\r\n- **命中**：ADV-B / BE\r\n- **证据**：`design.md:112`「取消 future、shutdown(...cancel_futures=True) 重建池」；`design.md:148`「取消排队任务」；`backend/app/api/public.py:264`「except SchedulerError as exc:」；`public.py:281`「except InputError as exc:」——未捕获 `CancelledError`\r\n- **裁决**：成立（中高）。云全挂时多个 auto 同时兜底是主场景；被牵连取消的请求会 500 且不写 usage_event。需 generation 区分并映射 503/504。\r\n\r\n### 中\r\n\r\n#### R-13 总览的今日总数与厂商行不再对账（R-ADM-09）\r\n- **命中**：ADV-A\r\n- **证据**：`backend/app/api/admin.py:720`「auto failures are counted separately so today's totals reconcile with the two provider rows (D-A3 / R-ADM-09)」；`admin.py:782`「for code in (\"baidu\", \"tencent\")」；`design.md:26`（D10）「管理端 overview 的 provider 列表不加 local」；`openspec/specs/admin-api/spec.md:225` R-ADM-09\r\n- **裁决**：成立。local 事件进入 `today.requests` 但不进 provider 行 → 对账差。见 Q3（推荐加 local 行）。\r\n\r\n#### R-14 用量页筛选/标签与 R-ADM-06 的 delta 缺失\r\n- **命中**：FE / BE / DX\r\n- **证据**：`tasks.md:27` 只点名「日志筛选下拉」；`frontend/src/pages/usage-page.tsx:196-199` 只有 baidu/tencent/auto 三个选项；`frontend/src/pages/logs-page.tsx:161-164` 同样；`openspec/specs/admin-api/spec.md:106` R-ADM-06 未在 change delta 中修改\r\n- **裁决**：成立。用量页无法按 local 筛选；task 引用的 R-ADM-06 没有对应需求增量。\r\n\r\n#### R-15 显式 `provider=local` 不受日限额，memo 的「概率低」理由不成立\r\n- **命中**：ADV-A\r\n- **证据**：`decision-memo.md:50`「本地请求不受用户日限额（quota_used=0）— 概率低（仅云全挂时触发）」；`proposal.md:12`「显式 `provider=local` 在已启用时直接走本地，不经过云账号/配额」；`openspec/specs/quota-accounting/spec.md:46`「daily_limit SHALL 限制该 Key 当日消耗的配额单位（quota_used 合计）」\r\n- **裁决**：成立。显式 local 随时可用，memo 的触发条件不成立。见 Q4（推荐保持 D3 + 修正理由 + README 写明）。\r\n\r\n#### R-16 Success Metrics 不可证伪\r\n- **命中**：ADV-C / BE\r\n- **证据**：`proposal.md:22`「本地已启用且 worker 就绪时，≤2000px 的截图 100% 返回 200 或明确 504」；`proposal.md:23`「度量：状态接口 `last_latency_ms`、单元/基准测试与镜像冒烟」；`design.md:167`「\"last_latency_ms\": 812」；`design.md:187`「热调用 p95（≤2000px 截图）≤3s」\r\n- **裁决**：成立。504 被计入成功；`last_latency_ms` 是单样本，无法算 p95；2000px 未定义长边/面积。\r\n\r\n#### R-17 slow/真实引擎/镜像验收无落点\r\n- **命中**：ADV-C\r\n- **证据**：`backend/pyproject.toml:42`「addopts = \"-m 'not slow'\"」；`tasks.md:7`「标记 `slow`、未安装 extra 时 skip」；`tasks.md:41` 只验 import；`proposal.md:24`「度量：镜像冒烟脚本读 `/api/admin/local-ocr/status`」（无任务交付该脚本）\r\n- **裁决**：成立。默认测试环境不装 extra，真实引擎测试被 skip；离线就绪与 Success Metric #3 不会被任何任务执行。\r\n\r\n#### R-18 warmup 失败无退避 → 每个请求重复 spawn/import/加载\r\n- **命中**：ADV-B\r\n- **证据**：`design.md:104`「error --\u003e starting: 下次请求或重新启用重试」；`specs/account-pool-scheduling/spec.md:23`「云端无候选或全部候选以可重试错误失败时尝试本地识别」\r\n- **裁决**：成立。确定性加载失败时，每个云故障请求都会重建池并重复失败，占用 5s reserve。需最小重试间隔 + 退避。\r\n\r\n#### R-19 本地排队请求占用全局信号量\r\n- **命中**：BE\r\n- **证据**：`design.md:119`「多请求在 executor 队列等待并各自受 deadline 约束」；`design.md:120`「全局 `MAX_CONCURRENT_REQUESTS` 信号量仍在最外层，本地请求也计入」；`backend/app/api/public.py:253`「await asyncio.wait_for(state.semaphore.acquire(), timeout=remaining)」\r\n- **裁决**：成立。8 个长本地请求可占满全局槽，云端请求等到预算耗尽后 503，而本地只有 1 个 worker。加 local gate。\r\n\r\n#### R-20 403/502/504 文案三件套缺失，403 无法区分两种 cause\r\n- **命中**：DX（DX-02 UNVERIFIABLE）\r\n- **证据**：`specs/ocr-api/spec.md:6`、`design.md:145`、`design.md:168` 只有错误码；`specs/ocr-api/spec.md:87`「`enabled` 反映本地 OCR 是否启用且安装可用」；`backend/app/runtime_settings.py:58`「The user-visible texts below are the ones from the design's copy table (single source)」——本 change 无对应文案\r\n- **裁决**：成立。同一 403 覆盖「开关关闭」与「依赖缺失」，fix 完全不同；需 copy 表。\r\n\r\n#### R-21 `alembic downgrade 0002` 命令与 entrypoint 冲突\r\n- **命中**：ADV-C / BE\r\n- **证据**：`design.md:236`「用 0.3.0 镜像执行 `alembic downgrade 0002`」；`tasks.md:45` 同；`backend/alembic/versions/0002_settings.py:16`「revision: str = \"7c1f0d2a9b31\"」；`docker/entrypoint.sh:17`「alembic -c /app/alembic.ini upgrade head」；`docker-compose.yml:29`「stop_grace_period: 25s」\r\n- **裁决**：成立。`0002` 不是 revision id；且容器启动即 `upgrade head`，无法直接 `run` 降级。改 `-1`/`7c1f0d2a9b31` + `--entrypoint` 覆盖。\r\n\r\n#### R-22 文档/版本落点不完整\r\n- **命中**：ADV-C / BE / DX\r\n- **证据**：`README.md:260`「公共 API 的 `provider` 只接受 `auto`/`baidu`/`tencent`；`local` 等取值返回 400」；`README.md:193`「版本锚 … `ocr-gateway:0.2.1`」；`README.md:196-198` 回滚仍写 0.1.0/0001；`docs/tech-selection.md:22/212/346/453/589/600` 仍写按需下载/`/local-ocr/download`/`data/models/rapidocr`/`local_ocr_max_concurrency` 为设置键；`backend/app/__init__.py:1`、`backend/pyproject.toml:3`、`frontend/package.json:4`、`backend/uv.lock:914` 均为 0.2.1\r\n- **裁决**：成立。tasks 5.2 只点名 §9/§16 与「不做本地 OCR」，照文档走会得到错误行为/版本。\r\n\r\n#### R-25 缺少请求序列图（TG-10 / TG-26 必画）\r\n- **命中**：STR / ENG\r\n- **证据**：`references/design-diagrams.md` 触发条件表「跨 3+ 组件协作 → 序列图」「并发 / 共享可变状态 → 序列图（竞态交互时序）」；`design.md` 只有架构 ASCII、决策流程图、状态机图，无序列图\r\n- **裁决**：成立。补 auto 兜底 + 超时重建的 ASCII 序列图。\r\n\r\n### 低（一行带过，均在 amendment 中处理）\r\n\r\n- **R-23** 镜像体积/RSS 数字未实测：`decision-memo.md:44` 的 opencv 34.8MB 与子代理外部查询（56.5MB）冲突，本机无外网无法核验 → 标「未经接地」，改为估算 + 测量命令，实施后回填。`design.md:191-192`、`proposal.md:76` 同步。\r\n- **R-24** ADR-0002 的「双验证」过强：`design.md:216/227`；ADR 已自述 URL 可达性需 `uv sync` 才能暴露（`adr/0002:57-59`），design 改为「结构/内容校验；可达性在可达 PyPI 环境补验」。\r\n- **R-26** spawn 只避免继承堆内存，不阻止 env 继承：`design.md:121/197`；worker initializer 清理 `MASTER_KEY`/`ADMIN_PASSWORD`。\r\n- **R-27** `ProcessPoolExecutor(spawn, ...)` 非有效 API：`design.md:45`；改为 `mp_context=multiprocessing.get_context(\"spawn\")`（若 Q1 选 B 则同步为 Pool context）。\r\n- **R-28** `last_error` 可能泄露模型绝对路径：`specs/admin-api/spec.md:55`、`design.md:113/168`；只保留错误码 + 脱敏短消息。\r\n- **R-29** shutdown 无时限：`design.md:114`；上限 ≤20s（compose grace 25s）。\r\n- **R-30** local 规范化表述含糊：`specs/ocr-api/spec.md:37`、`tasks.md:14`；写明「Pillow 校验 + EXIF 旋转 + 重编码 JPEG；上限作用于重编码后的 JPEG 字节；最长边 10000；不做 base64 膨胀」。\r\n- **R-31** 30s 本地超时在当前 20s 上限下不可达：`design.md:72/164`、`config.py:71`；status 增 `effective_timeout_ms`。\r\n- **R-32** `LOCAL_OCR_*` 权威清单不一致：`decision-memo.md:25`（3 个）vs `tasks.md:9`（5 个）；design 增「键/类型/默认/来源/范围/理由」表。\r\n- **R-33** 面板状态卡三态/单一数据源/轮询/部分提交未定义：`specs/admin-panel/spec.md:6/30/34`、`frontend/src/pages/settings-page.tsx:81/98/142`、baseline R-PANEL-09；按 D19 批量补场景。\r\n- **R-34** 本地 onboarding 无 TTHW / `uv sync` 不含 extra：`README.md:65`、`README.md:22`；补 `--extra local` 与步骤数/耗时假设。\r\n- **R-35** SQLite batch 重建的行数/磁盘余量未评估：`design.md:229`、`models.py:141`；迁移计划补行数评估与维护窗口。\r\n- **R-36** `python:3.12-slim` 系统库（如 libgomp1）未显式验证：`Dockerfile:67` 之后无 apt-get；`specs/deployment/spec.md:10` 只要求 import；task 5.1 的 import 检查可捕获，但应写成显式验证并允许按需安装。\r\n- **R-37** ready 阈值数字口径不一：`proposal.md:24`「30s 内 ready」vs `design.md:186/190`「冷启动 ≤5s / ready 等待 min(10s, 剩余)」；统一为「验收 ≤10s，目标 ≤5s」。\r\n\r\n---\r\n\r\n## 分镜列示\r\n\r\n### 广审 · strategy（主 session）\r\n\r\n- 范围/完整性：Non-Goals、假设 A1–A4、优先级 P0–P2、五切片均在；`openspec validate --strict` 通过。新增发现：R-06（R-SCH-03 未改）、R-25（缺序列图）、R-37（ready 阈值口径）。\r\n- 外部一致性：R-02（result-cache 未进 capabilities）、R-06、R-13（R-ADM-09）、R-14（R-ADM-06）。\r\n- 清晰度：R-09（unavailable）、R-30（local 规范化）、R-31（30s 上限）、R-32（配置清单）。\r\n- 范围/YAGNI：未发现扩大范围的实现；`app/core/local_engine.py` + `app/workers/local_ocr.py` 两个新模块属于单一能力，不判范围蔓延。\r\n- ADR 三镜：`decision-memo.md`「三镜代价」有主次判定，D1–D16 有候选与否决理由 → 通过。\r\n- 正文即最终态：design 无修订播报/旧方案残留 → 通过。\r\n\r\n### 广审 · plan-eng（主 session）\r\n\r\n- 可行性：R-03（不可取消）、R-12（兄弟取消）、R-19（信号量）、R-36（slim 系统库）。\r\n- 错误处理：R-04、R-11、R-18、R-20、R-28；失败模式表缺「池重建取消」「warmup 卡住」「缓存命中绕过门禁」三行。\r\n- NFR：R-16、R-23、R-31、R-37。\r\n- 可追踪性：R-05（无任务）、R-07（models.py）、R-14（R-ADM-06 无 delta）、R-17（无 slow 验收）；其余 R-ID 双向覆盖成立。\r\n- 图表/组件/安全：R-25；组件职责表齐全；R-26/R-28 安全表述。\r\n\r\n### 对抗镜 A · 隐藏假设（子代理，12 条 → 合并 R-01/02/03/05/06/08/09/11/13/15/26/36）\r\n\r\n攻击面：C1–C9 证据锚、RapidOCR 懒加载、spawn 语义、既有契约不变、openapi/specs 对读。全部 12 条均带锚；R-11 的「1×1 不触发 rec」与 R-36 的「slim 系统库」依赖外部/运行期事实，已在正文标为中高/低。\r\n\r\n### 对抗镜 B · 失败模式与并发（子代理，12 条 → 合并 R-01/02/03/04/05/07/09/10/12/18/27/31）\r\n\r\n攻击面：状态机竞态、预算算术、缓存/semaphore/usage_event、403/502/504、迁移。全部带锚；R-04/R-10/R-12 为本轮最高价值的组合发现。\r\n\r\n### 对抗镜 C · 乐观估计与边界（子代理，12 条 → 合并 R-01/02/03/05/16/17/21/22/23/24/30/31）\r\n\r\n攻击面：数字自洽、边界值、外部事实、验收口径、文档一致性。R-23 的外部体积数字本机无法核验，已标「未经接地」；R-30 的「保留原始字节」前提被主 session 纠正（X4）。\r\n\r\n### 领域镜 · backend（子代理，15 条 → 合并 R-02/03/04/05/07/08/09/11/12/16/19/21/22/28/29/35）\r\n\r\nBE-01 迁移（R-07/R-35）、BE-02 API（R-02/R-08/R-09/R-22）、BE-03 Auth（R-28）、BE-04 错误（R-03/R-11/R-12）、BE-05 一致性（R-05）、BE-06 性能（R-19）、BE-07 可观测（R-16）、BE-09 退出（R-29）、BE-11 回滚（R-21）。BE-08（退避）由 R-18 覆盖；BE-10（分发）通过；BE-11 SLA/RTO/RPO 判 N/A（X5）。\r\n\r\n### 领域镜 · frontend-react（子代理，9 条 → 合并 R-08/R-14/R-33）\r\n\r\nFE-01/02/07/09/10/13 与 REACT-01/02；REACT-03 判 N/A（Vite + React SPA，无 RSC，`frontend/package.json:48`、`frontend/src/App.tsx:28`）。视觉类 FE-04/05/06/08/12 判 N/A（管理面板既有视觉方向，无新落地页/第三方脚本/多语言）。\r\n\r\n### 领域镜 · devex（子代理，10 条 → 合并 R-08/R-09/R-20/R-22/R-31/R-32/R-34）\r\n\r\nDX-01 UNVERIFIABLE（无 TTHW 估算）、DX-02 UNVERIFIABLE（无错误文案）、DX-03 FAIL（配置清单/30s 默认）、DX-04 FAIL（unavailable 语义/版本与回滚文档/模型下载残留/混版本说明）、DX-05 N/A（不新增 SKILL）。全部带锚。\r\n\r\n### 接地镜（主 session）\r\n\r\n亲验 28 处代码事实，**0 条假引文**：\r\n\r\n| 事实 | 结果 |\r\n| --- | --- |\r\n| `public.py:28` VALID_PROVIDERS 只有 auto/baidu/tencent | ✅ |\r\n| `public.py:218-219` 缓存读取在 scheduler/门禁前 | ✅ |\r\n| `public.py:323` 成功事件硬编码 `quota_used=1` | ✅ |\r\n| `public.py:253` 全局 semaphore 在最外层 | ✅ |\r\n| `runtime_settings.py:81-87` deadline 1000–20000 | ✅ |\r\n| `main.py:65/83` lifespan 无 local 装配 | ✅ |\r\n| `models.py:137` 三值 check；`account_id` 已 nullable | ✅（迁移表无需加列） |\r\n| `conftest.py:45` create_all 建库 | ✅ |\r\n| `alembic 0002 revision = 7c1f0d2a9b31` | ✅ |\r\n| `entrypoint.sh:17` 启动即 upgrade head | ✅ |\r\n| `docker-compose.yml:29` grace 25s；`image: 0.2.1` | ✅ |\r\n| `pyproject.toml:42` addopts 排除 slow | ✅ |\r\n| `admin.py:720/782` overview 对账注释 + 硬编码两厂 | ✅ |\r\n| `admin.py:1094` 只 reconfigure 缓存参数 | ✅ |\r\n| `registry.py:153` candidates；`base.py:111` PROVIDER_NAMES | ✅ |\r\n| `deps.py:202` 日限额按 `sum(quota_used)` | ✅ |\r\n| `types.ts:1/28`、`accounts-page.tsx:49/76` | ✅ |\r\n| `usage-page.tsx:196-199`、`logs-page.tsx:161-164` | ✅ |\r\n| `settings-page.tsx:81/98/142` | ✅ |\r\n| `README.md:17/22/65/193/196-198/260` | ✅ |\r\n| `tech-selection.md:22/212/346/453/589/600` | ✅ |\r\n| `ADR-0002:38/57-59` | ✅ |\r\n| `.github/workflows` 不存在（无 CI） | ✅ |\r\n\r\n**未经接地（外部/运行期事实）**：opencv wheel 体积（子代理给 56.5MB，memo 给 34.8MB，本机无外网/锁文件无该包）、rapidocr 首次调用是否加载全部三模型、Linux/2 核 4G 的冷/热延迟、PP-OCRv6 许可证文本。均已在正文标注，不作为裁决依据。\r\n\r\n---\r\n\r\n## T/S 残差\r\n\r\n- `openspec validate m4-local-ocr --strict` → **valid**（exit 0）；`check_decision_memo.py` → ok（exit 0）。\r\n- 模版槽：proposal 的 Why/Success Metrics/Non-Goals/Compliance/假设/优先级齐；design 的 Goals/Non-Goals/决策/数据模型/NFR/安全/切片/Risks/Migration/Open Questions 齐；specs 的 ADDED/MODIFIED + 稳定 ID + Scenario 齐；tasks 的 R-ID 追溯基本齐。\r\n- 缺口（已在正文列为 finding）：**序列图**（BASE-19/T，R-25）；**错误文案槽**（DX-02，R-20）；**配置键权威表**（R-32）。\r\n- 位置偏差（不阻塞）：Open Questions 在 `design.md` 而非 `proposal.md`——内容存在，模板建议位置不同。\r\n- `TG-25`（版本化多文件契约套件）未命中，BASE-29 scope-check 表 N/A；`TG-24` 外部计费 N/A（本地不产生厂商费用，云厂商计费不变）。\r\n\r\n---\r\n\r\n## 诚实边界\r\n\r\n- 6 个派发镜均为**同模型 fresh-context**：隔离的是上下文，不是模型盲点；对抗镜的「refuted=true」默认没有跨模型第二意见兜底。\r\n- 广审双镜与接地镜由主 session 亲做，带生成历史，存在自查偏置；本报告把「主 session 独有发现」与「子代理发现」分列，便于人复核。\r\n- 子代理 findings 一律先视为「待接地」；主 session 抽查了合并池中 ≥1/3（实际亲验 28 处，覆盖全部高项与大部分中项），未逐条复核所有低项引文。\r\n- 无机械引用核验脚本（lite 无此门），抽查是指令层纪律，**不声称机械保证**。\r\n- 外部事实（wheel 体积、RapidOCR 行为、Linux 性能、许可证）本机无法核验，已标「未经接地」；不在裁决中当作已证实。\r\n- `decision-memo.md` 是机械哈希件（`decision_hash` = 正文 sha256），本轮**未改写**；memo 中被评审修正的表述（C6 `types.ts:1`、C9 体积、D10 overview、接受边角「概率低」）以本报告的 R-08/R-23/R-13/R-15 与四件套的 `[spec-review-amendment]` 为准。\r\n"},{"label":"proposal","path":"openspec/changes/m4-local-ocr/proposal.md","text":"# Proposal: m4-local-ocr\n\n## Why\n\n当前网关的可用性完全依赖百度/腾讯云：两家同时故障、额度耗尽或全部账号进入冷却时，`provider=auto` 只能返回 503。M4 用随镜像分发的本地 RapidOCR 引擎提供降级路径，让「云全挂」从不可用变为「可识别但质量低于云」。\n\n## What Changes\n\n- 新增本地 OCR 能力：RapidOCR（onnxruntime CPU）运行在独立进程池 worker 中，模型随 wheel 内置，不联网下载；可选依赖 extra `local`。\n- 新增运行时设置 `local_ocr_enabled`（默认 `false`，热更新）：关闭时 worker 不启动、显式 `provider=local` 返回 403。\n- `provider=auto` 在云端无可用账号或全部尝试失败时自动兜底本地；云阶段为本地预留 5s 预算；显式云厂商仍不回退。\n- 显式 `provider=local` 在已启用时直接走本地，不经过云账号/配额。\n- 记账口径：本地成功 `quota_used=0`、`account_id=NULL`、`provider='local'`；Key 的 RPM 仍生效。\n- 新增 Alembic 迁移放宽 `usage_event.provider` 检查约束以接受 `local`（downgrade 把 local 行映射回 `auto`）。\n- 管理端：`GET /api/admin/local-ocr/status` 返回 worker 状态/模型/最近耗时；设置页新增本地 OCR 卡片。\n- `/v1/providers` 增加 `local` 条目；用量与日志的厂商标签增加「本地 RapidOCR」。\n- 发布镜像内置 local extra（构建仍支持索引参数化）；版本升至 `0.3.0`，`0.2.1` 保留为回滚锚点。\n- 锁文件更新遵循新增的 ADR-0002（镜像解析后把源 URL 规范化回 PyPI）。\n\n## Success Metrics\n\n- **云全挂兜底成功率** — 基准 0%（当前返回 503）→ 目标：本地已启用且 worker 就绪时，最长边 ≤2000px 的截图 ≥95% 返回 200 且 `provider=\"local\"`；504/5xx 单独计失败并留样（`[spec-review-amendment R-16]`）→ 度量：集成测试（停用/移除全部云账号）+ 手工验收。\n- **本地识别延迟** — 基准 无（未实现）→ 目标：热调用 p95 ≤3s（本机 900×220 实测 0.49s）→ 度量：固定 N 次（≥30）基准脚本计算 p95 + 镜像冒烟；不使用 `last_latency_ms` 单样本。\n- **镜像启动不回归** — 目标：0.3.0 镜像在无外网环境启动，开启开关后 worker ≤10s 进入 `ready`（目标 ≤5s）→ 度量：镜像冒烟脚本读 `/api/admin/local-ocr/status`。\n\n## Non-Goals\n\n- **不做模型下载/自定义模型目录/多语言模型** — 可证伪假设：rapidocr 3.10 内置 PP-OCRv6 small 对中文截图与中英混排足够好（本机实测 score 0.975）；若真实业务截图准确率明显不足，再另开 change 引入语言模型下载。\n- **不做本地独立配额/限流** — 可证伪假设：自动兜底只在云全挂时触发，显式 `provider=local` 仅受 Key RPM 与全局并发约束（默认本地并发 1）；若观测到本地 CPU 被持续打满，再引入本地限额（`[spec-review-amendment R-15]`）。\n- **不做本地账号管理/多并发调优/GPU** — 可证伪假设：兜底场景不需要与云同等吞吐；并发保留 env 旋钮即可。\n- **不做多实例开关广播** — 可证伪假设：v1 强制单 worker（R-DEP-06），不存在多进程读到不同开关的情况。\n- **不做批量接口/PDF/结构化识别** — 既有 Non-Goals，不在 M4 扩大。\n\n## Compliance\n\n- **ADR-0001**：镜像构建不读锁文件里的下载地址，仍用 `uv export` + `pip install --index-url`；**ADR-0002**：离线更新锁文件后必须把源 URL 规范化回 PyPI。\n- **R-DEP-06** 单实例约束、**R-DEP-08** 非 root：本地 worker 与进程池不改运行身份。\n- **凭证约定**：任何文档/注释不写本机私有凭证文档的具体路径或文件名。\n- **模型许可证**：PaddleOCR 模型为 Apache-2.0，镜像与 README 保留归属说明。\n- **安全**：本地 worker 不访问网络；输入图片沿用既有 Pillow 校验与像素上限。\n\n## 需求优先级\n\n- **P0（M4 验收必需）**：引擎与 worker 可用（R-LOC-01/02/04）、`auto` 兜底与预算预留（R-SCH-07）、`provider=local` 与 403（R-API-01）、本地记账与 `usage_event` 迁移（R-QTA-01）、开关热更新（R-ADM-08）。\n- **P1（可观测与面板）**：状态接口（R-ADM-11）、`/v1/providers` local 条目（R-API-06）、设置页卡片（R-PANEL-08）、用量/日志标签（R-ADM-06）。\n- **P2（交付面）**：镜像内置 extra 与版本锚（R-DEP-11/R-DEP-10）、README/环境变量/许可证说明。P2 未完成不阻塞兜底能力本身，但阻塞发布。\n\n## 假设\n\n- **A1** 内置 PP-OCRv6 small 对业务截图够用（可证伪：抽样准确率显著低于云厂商）→ 触发另开 change 引入语言/更大模型。\n- **A2** 兜底流量不会持续打满 CPU（本地只在云全挂时承接，默认并发 1）→ 触发时再引入本地限额。\n- **A3** 目标部署机（2 核 4G 下限）热调用可满足 5s 预留（本机实测 0.49s）→ verify 在服务器补测。\n- **A4** 可达镜像提供 rapidocr/onnxruntime 的 cp312 manylinux wheel（已用 `uv lock` 解析验证）。\n\n## Capabilities\n\n### New Capabilities\n\n- `local-ocr`: 本地识别引擎、worker 进程池生命周期、模型来源与就绪状态、输出归一化与失败语义。\n\n### Modified Capabilities\n\n- `ocr-api`: `provider` 枚举与 local 语义、local 成功/失败响应与 `quota.used`、`/v1/providers` 条目。\n- `account-pool-scheduling`: `auto` 兜底本地的触发条件与云阶段预算预留。\n- `quota-accounting`: 本地事件的记账口径（quota_used=0、account_id 为空）。\n- `result-cache`: provider 可用性门禁先于缓存命中；本地开关切换时清缓存（`[spec-review-amendment R-02]`）。\n- `admin-api`: 运行时设置新增 `local_ocr_enabled`；新增 local OCR 状态端点。\n- `admin-panel`: 设置页本地 OCR 开关与状态展示。\n- `deployment`: 运行镜像内置 local extra；新版本 tag 与回滚锚点。\n\n## Impact\n\n- **代码**：`backend/app/workers/local_ocr.py`（新）、`core/local_engine.py`（新）、`core/scheduler.py`、`core/cache.py`（门禁/清理）、`api/public.py`、`api/admin.py`、`utils/images.py`、`runtime_settings.py`、`config.py`、`main.py`、`state.py`、`models.py`、`providers/base.py`；前端 `settings-page.tsx`、`usage-page.tsx`、`logs-page.tsx`、`types.ts`、`lib/providers.ts`。\n- **API**：`/v1/ocr/image`（provider 语义）、`/v1/providers`、`/api/admin/settings`、`/api/admin/local-ocr/status`。\n- **DB**：新增迁移 `0003`（放宽 `ck_usage_provider`）。\n- **依赖**：`rapidocr\u003e=3.10,\u003c4`、`onnxruntime\u003e=1.20`（optional extra `local`）；`uv.lock` 重新解析。\n- **部署**：镜像增加约 110MB 下载/约 350MB 安装体积；新增 `LOCAL_OCR_*` 环境变量；`.env.example`、README 更新。\n"},{"label":"design","path":"openspec/changes/m4-local-ocr/design.md","text":"# Design: m4-local-ocr\n\n## Context\n\n当前路由只有云账号：`Scheduler` 从 `AccountRegistry` 取候选（`backend/app/core/registry.py:153-186`），没有账号即 `NoCandidate`；公共 API 的 `VALID_PROVIDERS` 只有 `auto/baidu/tencent`（`backend/app/api/public.py:28`）。运行时设置是 5 个标量键（`backend/app/runtime_settings.py:19-46`），热更新在 commit 后替换 `state.runtime`（`backend/app/api/admin.py:1075-1093`）。镜像用 `uv export --frozen` 安装依赖（`Dockerfile` 依赖层），因此新增 optional extra 必须同步锁文件。\n\n本地引擎的外部事实（均实测）：rapidocr 3.10.0 wheel 内置 PP-OCRv6 small det/rec 与 PP-OCRv4 cls 模型，不联网；`RapidOCR()` 构造不加载模型，首次调用才加载；本机冷启动约 2.4s、热调用 0.49s（900×220）。动机见 `proposal.md`，决策全文见 `decision-memo.md`。\n\n## Goals / Non-Goals\n\n**Goals:**\n- 本地引擎在独立进程内运行，事件循环不被 ONNX 推理阻塞；启停与就绪状态可查询、可观测。\n- 兜底只在 `auto` 且本地真正可用时生效，且不挤占云端本可成功的预算。\n- 记账与错误码语义在改动后仍与既有公共契约自洽（local 无账号、无厂商额度）。\n\n**Non-Goals:**\n- 不做模型下载、语言模型切换、GPU、批量本地识别（见 proposal Non-Goals）。\n- 不改变云账号的候选/排序/冷却逻辑；`provider=baidu|tencent` 行为完全不变。\n- 不引入多进程 worker 的负载均衡或跨实例协调（v1 单实例）。\n\n## Decisions\n\n本 change 的决策全文与砍掉的候选见 [`decision-memo.md`](./decision-memo.md)（D1–D16）；离线更新锁文件的操作决策见 [`ADR-0002`](../../adr/0002-offline-lock-update.md)。本文件只记录由这些决策推导出的技术形状与约束。\n\n## 架构与组件\n\n```\n┌────────────────────────── 同一进程（uvicorn 单 worker） ──────────────────────────┐\n│                                                                                  │\n│  POST /v1/ocr/image                                                              │\n│        │                                                                         │\n│        ▼                                                                         │\n│  public.py ── normalize_image(provider) ── cache ── semaphore                     │\n│        │                                                                         │\n│        ▼                                                                         │\n│  Scheduler.recognize(provider, deadline)                                         │\n│    ├─ provider=baidu|tencent ──▶ AccountRegistry 候选 ──▶ ProviderAdapter(HTTP)   │\n│    ├─ provider=local ─────────▶ LocalEngine.recognize                            │\n│    └─ provider=auto ──▶ 云尝试（截止 = deadline - reserve）                       │\n│                          └─ 无候选/全失败 ──▶ LocalEngine.recognize              │\n│                                                                                  │\n│  LocalEngine（父进程，asyncio 单线程状态机）                                      │\n│        │  run_in_executor + wait_for(timeout)                                    │\n│        ▼                                                                         │\n│  spawn 进程池（可 terminate/kill；max_workers=local_ocr_max_concurrency）         │\n│        └─ worker 进程：import rapidocr（懒加载模型），只收 bytes/语言             │\n│                                                                                  │\n│  admin.py ── /api/admin/settings（local_ocr_enabled）                            │\n│           └─ /api/admin/local-ocr/status ──▶ LocalEngine.status()                │\n└──────────────────────────────────────────────────────────────────────────────────┘\n```\n\n组件职责：\n- `app/core/local_engine.py`（新）：父进程侧状态机、进程池（`multiprocessing.get_context(\"spawn\").Pool`，可 `terminate()`；不使用无法 kill 运行中任务的 `ProcessPoolExecutor`）、超时、计数与状态快照（`[spec-review-amendment Q1-B]`）。\n- `app/workers/local_ocr.py`（新）：worker 进程侧，模块级引擎缓存与 `run_ocr`/`warmup`；**不得**导入 `app.state`/`app.main`/配置，避免把凭证带进子进程；必须能被 spawn 单独导入。\n- `app/core/scheduler.py`：增加 local 分支与 `auto` 兜底（云阶段截止 = 总 deadline − reserve）。\n- `app/api/public.py`：`provider` 枚举、403/502/504 映射、`/v1/providers` 条目。\n- `app/runtime_settings.py` / `config.py`：新设置键与环境默认。\n- `app/utils/images.py`：local 分支仍走 Pillow 校验 + EXIF 旋转 + 重编码 JPEG；字节上限作用于**重编码后的 JPEG 字节**（`MAX_UPLOAD_BYTES`），最长边 10000，不做 base64 膨胀检查（`[spec-review-amendment R-30]`）。\n\n## 请求路由与预算\n\n`deadline` 仍是请求开始时的绝对 `time.monotonic()` 预算（R-SCH-03）。\n\n| provider | 云阶段截止 | 兜底 | 说明 |\n| --- | --- | --- | --- |\n| `baidu` / `tencent` | `deadline` | 否 | 既有行为不变 |\n| `local` | 不适用 | 不适用 | 直接本地；未启用/依赖缺失 → 403 |\n| `auto` 且本地可用 | `deadline - reserve_eff` | 是 | 云 `NoCandidate`/`UpstreamFailed`/`DeadlineExceeded` 时转本地 |\n| `auto` 且本地不可用 | `deadline` | 否 | 不为不可用的 local 预留预算 |\n\n「本地可用」判定（`[spec-review-amendment R-09]`）= `installed \u0026\u0026 enabled`；`starting` 按就绪事件等待，\n`unavailable`（依赖缺失，不建池）与 `error`（模型加载失败，按退避重试）不预留、不兜底。\n显式 `provider=local` 在 `unavailable`/未启用时 403；`error` 时进入重试并返回 502。\n\n预算不变量（`[spec-review-amendment R-01]`）：进入本地阶段前先算\n`reserve_eff = min(LOCAL_OCR_RESERVE_MS, max(0, total_budget - LOCAL_OCR_MIN_BUDGET_MS))`；\n只有 `total_budget \u003e= reserve_eff + LOCAL_OCR_MIN_BUDGET_MS` 才启用兜底并扣减云阶段预算。\n`total_budget \u003c= LOCAL_OCR_MIN_BUDGET_MS` 时 `reserve_eff = 0`，auto 退化为一律不兜底（等价于本地未启用），\n避免 `request_deadline_ms` 取 1000–5000 时云阶段截止落在过去。\n\n本地阶段只算一次 `local_deadline = min(now + LOCAL_OCR_TIMEOUT_MS, deadline)`；ready 等待与识别共用该\ndeadline，每次 `await` 后重算剩余，确保整个本地阶段不超过总预算。`LOCAL_OCR_TIMEOUT_MS=30000` 是\n上限，实际生效值 = `min(30000, deadline - now)`；剩余预算 \u003c `LOCAL_OCR_MIN_BUDGET_MS`（默认 1000）时\n不再尝试本地，直接返回云阶段的原始错误（若显式 local 则 504）。\n\n```\nprovider=auto?\n   │否 ──▶ 云路径（不兜底）\n   ▼是\n本地 installed \u0026\u0026 enabled?\n   │否 ──▶ 云路径（deadline 全额）\n   ▼是\n云尝试（deadline - reserve_eff）\n   │成功 ──▶ 返回云结果\n   ▼失败/无候选\n剩余 ≥ min_budget? ──否──▶ 返回云错误\n   │是\n本地识别（timeout = min(30s, local_deadline - now)）\n   │成功 ──▶ 返回 local 结果（quota_used=0）\n   ▼失败\n502 / 504\n```\n\n## 请求时序（auto 兜底 + 超时重建）\n\n`[spec-review-amendment R-25]` 跨 public / Scheduler / LocalEngine / worker 四个组件，且有并发与池重建，按\n`design-diagrams.md` 补序列图：\n\n```\nclient     public.py            Scheduler          LocalEngine         worker(process)\n  │            │                    │                  │                    │\n  │─ POST ────▶│ parse+normalize    │                  │                    │\n  │            │ provider gate ─────┼──(显式 local 未启用→403，早于缓存)      │\n  │            │ cache.get ─────────┼──(命中→200 cached=true)                │\n  │            │ semaphore.acquire  │                  │                    │\n  │            │───────────────────▶│ cloud(deadline-reserve_eff)            │\n  │            │                    │── NoCandidate/Upstream/Timeout ──┐     │\n  │            │                    │                                  ▼     │\n  │            │                    │            reserve 够? ─否→ 返回云错误  │\n  │            │                    │                  │ ready? ──wait(≤local_deadline)\n  │            │                    │                  │─ run_ocr ─────────▶│\n  │            │                    │                  │◀─ text/lines ──────│\n  │            │◀── ScheduleResult(provider=local) ────│                    │\n  │            │ cache.set + usage_event(quota_used=0) │                    │\n  │◀─ 200 ─────│                    │                  │                    │\n  │            │                    │      local_deadline 到 ──▶ terminate 池│\n  │            │                    │                  │ generation++ → starting\n  │            │◀── 504 TIMEOUT ────┴──────────────────│                    │\n```\n\n竞态约束（`[spec-review-amendment R-10/R-12]`）：每次 enable/disable/rebuild 递增 generation；warmup 与\n识别回调先比对 generation，旧池的迟到回调丢弃；超时 owner 单飞重建，被重建取消的兄弟请求映射\n503/504 并写 usage_event，不得冒泡为 500。\n\n## 本地 worker 生命周期\n\n```mermaid\nstateDiagram-v2\n    [*] --\u003e stopped\n    [*] --\u003e unavailable: installed=false（依赖缺失，不建池）\n    stopped --\u003e starting: set_enabled(true) / lifespan 恢复 enabled=true\n    starting --\u003e ready: warmup 完成（含文字小图返回非空）\n    starting --\u003e error: warmup 超时/模型加载失败\n    starting --\u003e stopped: set_enabled(false)\n    ready --\u003e stopping: set_enabled(false)\n    ready --\u003e error: worker 崩溃 / 单次超时且池重建失败\n    stopping --\u003e stopped: shutdown 完成\n    error --\u003e starting: 退避窗口（≥30s）后的下次请求或重新启用\n    error --\u003e stopped: set_enabled(false)\n    unavailable --\u003e stopped: set_enabled(false)\n```\n\n规则（`[spec-review-amendment R-03/R-09/R-10/R-11/R-18]`）：\n- **启动恢复**：lifespan 装配后，若 `runtime.local_ocr_enabled \u0026\u0026 installed` 调用 `set_enabled(true)`，状态从 `starting` 开始；`installed=false` 时为 `unavailable`，不建池。\n- `set_enabled` **幂等**：仅在状态变化时执行；`ready`/`starting` 重复收到 `true` 不建第二个池；`disable` 立即清就绪事件并递增 generation。\n- `set_enabled(true)` 只负责建池并提交 warmup（不阻塞 HTTP 响应），状态立刻为 `starting`。\n- warmup 用**含文字的小图**跑完整 pipeline 并断言文本非空（1×1 白图在检测阶段即返回，不能证明 rec/cls 已加载）；warmup 本身有超时（≤ ready 等待上限），超时置 `error`。\n- `starting` 期间的本地请求等待就绪事件，最多等 `min(10s, local_deadline - now)`；超时按不可用处理。\n- 单次超时：`terminate()/kill()` 旧池进程并 `join`（不能只取消 future），generation++，重建池并回到 `starting`，本次返回 504；避免一个卡死任务永久占住 worker。\n- `error` 后的重试有最小间隔（默认 30s）+ 指数退避；请求路径不重复 spawn 失败池；`status` 暴露 `next_retry_in_ms`。\n- `BrokenProcessPool`：状态置 `error`，下次请求（过退避窗口后）重建；错误写入 `last_error`（脱敏）。\n- 关闭应用时 `await shutdown()`，上限 20s（\u003c compose `stop_grace_period: 25s`）；超时后 kill 残留 worker。不清空 `usage_event`。\n\n## 并发与共享状态\n\n- 状态只存在于事件循环线程：`LocalEngine` 的字段（state、计数器、last_*）无需锁；进程池回调通过 `run_in_executor` 回到事件循环。\n- worker 进程之间不共享内存；并发由 `max_workers` 控制，默认 1，多请求在 executor 队列等待并各自受 deadline 约束。\n- 全局 `MAX_CONCURRENT_REQUESTS` 信号量仍在最外层，本地请求也计入（不会因兜底绕过并发上限）。\n- **本地专用 gate**（`[spec-review-amendment R-19]`）：显式 local 先取 `local_semaphore`（= `local_ocr_max_concurrency`）再取全局信号量，排队本地请求不占全局槽；auto 兜底阶段在全局槽内取 local gate（兜底是低频路径）。\n- 进程池用 `mp_context=multiprocessing.get_context(\"spawn\")`（`[spec-review-amendment R-27]`，不是位置参数）；spawn 避免继承父进程**堆内存**，但子进程仍会继承 `os.environ`——worker initializer 清除 `MASTER_KEY`/`ADMIN_PASSWORD` 等敏感变量，且 worker 代码不读取任何 env 凭证（`[spec-review-amendment R-26]`）。\n\n## 数据模型与生命周期\n\n新增运行时设置键（`settings` 表，key/value，无需 DDL）。`LOCAL_OCR_*` 权威清单（`[spec-review-amendment R-32]`）：\n\n| 键 | 类型 | 默认 | 来源 | 范围 / 说明 |\n| --- | --- | --- | --- | --- |\n| `LOCAL_OCR_ENABLED` / `local_ocr_enabled` | bool | `false` | env 仅作启动默认；DB 运行时值覆盖（热更新） | 开关；关闭时停池，显式 local 403 |\n| `LOCAL_OCR_MAX_CONCURRENCY` | int | `1` | env | 建池时生效；变更需重启容器 |\n| `LOCAL_OCR_TIMEOUT_MS` | int | `30000` | env | 单次上限；实际值 = `min(该值, 剩余预算)` |\n| `LOCAL_OCR_RESERVE_MS` | int | `5000` | env | auto 云阶段预留；按 R-01 不变量收敛为 `reserve_eff` |\n| `LOCAL_OCR_MIN_BUDGET_MS` | int | `1000` | env | 剩余低于此值不尝试本地 |\n\n`usage_event.provider` 取值新增 `local`，仅有 check 约束变化（Alembic `0003`，batch 重建）：\n\n| 对象 | v_old | v_new |\n| --- | --- | --- |\n| `ck_usage_provider` | `provider IN ('baidu','tencent','auto')` | `provider IN ('baidu','tencent','auto','local')` |\n| `usage_events` 列 | 不变：`id, request_id, user_id, api_key_id, account_id, provider, capability, success, error_code, latency_ms, quota_used, cached, image_hash, created_at` | 同左（无增删列/类型/默认值变化） |\n| `ck_accounts_provider` | `provider IN ('baidu','tencent')` | 不变（local 不建账号） |\n\ndowngrade：先 `UPDATE usage_events SET provider='auto' WHERE provider='local'`，再恢复旧约束；否则旧约束建立时必然失败。\n\n迁移落地约束（`[spec-review-amendment R-07/R-21/R-35]`）：\n- `backend/app/models.py` 的 `UsageEvent.__table_args__` MUST 同步改为四值——测试用 `Base.metadata.create_all` 建库，只改 Alembic 会让 local 事件在单测直接 IntegrityError。\n- `account_id` 已是 `nullable=True`，本迁移**不加列**；`ck_accounts_provider` 不动。\n- 迁移在启动时执行；上线前评估 `usage_events` 行数（超过 100 万行时在维护窗口执行），保留 `sqlite3 .backup` 与磁盘余量。\n- 回滚命令用 `alembic downgrade -1`（或 revision `7c1f0d2a9b31`）；容器 entrypoint 启动即 `upgrade head`，演练时须用 `--entrypoint alembic` 覆盖。\n\n## 失败模式与可观测性\n\n| 场景 | 检测 | 系统行为 | 用户可见 | 恢复 |\n| --- | --- | --- | --- | --- |\n| 依赖未安装 | `find_spec` 失败 | `installed=false`、`state=unavailable`，开关视为不可用 | 显式 local → 403；auto 不兜底 | 重装镜像 |\n| 模型加载失败 | warmup 异常 | `state=error`，`last_error`（脱敏） | 显式 local → 502；auto 回云错误 | 退避窗口后重试 |\n| warmup 卡住 | warmup 超时（≤ ready 等待上限） | `state=error`，`next_retry_in_ms` | 显式 local → 502；auto 回云错误 | 退避后重试 |\n| worker 崩溃 | `BrokenProcessPool` | 重建池，`error→starting` | 本次 502 | 下次请求自动恢复 |\n| 单次超时 | `asyncio.wait_for` | terminate/kill 旧池并重建，generation++ | 504 `TIMEOUT` | 下次请求自动恢复 |\n| 池重建取消兄弟请求 | generation 不匹配 | 映射 503/504 并写 `usage_event` | 503/504 | 下次请求 |\n| 队列排满 | executor 排队 + deadline | 等到 deadline 即超时 | 504 | 降低并发/扩大 worker |\n| 缓存命中但 local 已禁用 | provider gate 先于 `cache.get` | 开关变化清缓存 | 显式 local → 403；auto 不返回 local | 重新开启 |\n| 云端失败且预算不足 | 剩余 \u003c 1s | 不尝试本地，返回云错误 | 503/502/504（云错误） | 下次请求 |\n| 开关在请求中变更 | 状态机 + generation | 新请求按新状态；旧池回调丢弃 | 可能一次 403/502 | 重试 |\n\n可观测性：\n- 结构化日志事件：`local_ocr.enabled` / `local_ocr.disabled` / `local_ocr.warmup`（含 model 与耗时）/ `local_ocr.fallback`（含 from_reason）/ `local_ocr.timeout` / `local_ocr.failed`。日志不含图片字节与识别原文。\n- `usage_event`：`provider='local'`、`account_id=NULL`、`quota_used=0`、`latency_ms` 为整请求耗时；兜底成功与失败都记录。\n- 管理端总览的厂商行增加 `local`（`accounts=0`、`available_accounts=0`），今日请求总数与各厂商行请求数之和对账；`auto` 失败仍单独计数（`[spec-review-amendment R-13]`）。\n- `GET /api/admin/local-ocr/status`：\n\n```json\n{\n  \"enabled\": true,\n  \"installed\": true,\n  \"state\": \"ready\",\n  \"concurrency\": 1,\n  \"timeout_ms\": 30000,\n  \"effective_timeout_ms\": 15000,\n  \"reserve_ms\": 5000,\n  \"effective_reserve_ms\": 5000,\n  \"model\": {\"engine\": \"onnxruntime\", \"family\": \"PP-OCRv6\", \"variant\": \"small\", \"bundled\": true},\n  \"last_latency_ms\": 812,\n  \"last_error\": null,\n  \"next_retry_in_ms\": null,\n  \"requests_total\": 12,\n  \"fallback_total\": 3\n}\n```\n\n`[spec-review-amendment R-09/R-28/R-31]`：`effective_*` 是本请求预算下的实际值；`last_error` 只保留\n错误码 + 脱敏短消息（去绝对路径、去堆栈、截断），不返回模型文件路径、凭证或识别原文。\n\n- `GET /v1/providers` 增加：\n\n```json\n{\"code\": \"local\", \"name\": \"本地 RapidOCR\", \"enabled\": true}\n```\n\n- 设置更新示例：`PUT /api/admin/settings {\"local_ocr_enabled\": true}` → `{\"settings\": {...}, \"cache_cleared\": true}`（开关变化视为缓存参数变化，清空现有缓存）；非法类型返回 400 且 `error.fields[].field=\"local_ocr_enabled\"`。\n\n错误文案（`[spec-review-amendment R-20]`；problem / cause / fix 三段，与既有 `FIELD_RULES` 文案风格一致）：\n\n| 错误 | message |\n| --- | --- |\n| 显式 local、开关关闭 | 本地 OCR 未启用。请在设置页开启「本地 OCR」开关后重试。 |\n| 显式 local、依赖缺失 | 本地 OCR 依赖未安装。当前镜像未包含 `local` extra，请使用内置该依赖的 0.3.0 镜像。 |\n| 本地识别失败 | 本地 OCR 运行失败。服务已记录该错误；请稍后重试，或显式指定云厂商。 |\n| 本地识别超时 | 本地 OCR 超时。请缩小图片或稍后重试。 |\n| 显式 local、模型加载中 | 本地 OCR 正在预热。请稍后重试。 |\n\n`/v1/providers` 的 local `enabled` = `installed \u0026\u0026 enabled`（合并语义）；它不区分两种 false 的原因，客户端需要区分时应调用管理员状态接口。\n\n## 非功能需求（数字化）\n\n| 指标 | 目标 | 依据 |\n| --- | --- | --- |\n| 冷启动（建池→ready） | 目标 ≤5s；验收 ≤10s | 本机实测 2.4s；Linux/2 核 4G 待镜像冒烟补测 |\n| 热调用 p95（最长边 ≤2000px 的截图） | ≤3s | 实测 900×220 为 0.49s；p95 用固定 N 次基准脚本计算，不用 `last_latency_ms` 单样本 |\n| 本地单次超时上限 | 30s，且不超过剩余总预算；status 报 `effective_timeout_ms` | D4 |\n| 本地预算预留 | 5s（auto 且本地可用时）；`reserve_eff` 按 R-01 不变量收敛 | D4 |\n| ready 等待上限 | min(10s, `local_deadline - now`) | 冷启动 2.4s 的 4× 余量 |\n| 镜像增量 | 下载约 110–130MB / 安装后约 350MB（**估算**，实施后按锁文件 wheel size 与 `du -sh` 回填） | 锁文件 wheel size 求和；外部数字未经本机核验 |\n| worker 常驻内存 | 200–300MB（估算，实施后按容器 RSS 回填） | 模型 32MB + onnxruntime/opencv 运行时 |\n\n## 安全与数据保护\n\n- 图片在进入进程池前已完成 Pillow 校验、EXIF 旋转与像素上限检查；worker 只收 JPEG/PNG 字节。\n- worker 不读环境凭证、不连数据库、不发网络请求；`spawn` 避免继承父进程**堆内存**，子进程仍会继承 `os.environ`，因此 worker initializer 清除 `MASTER_KEY`/`ADMIN_PASSWORD` 等敏感变量（`[spec-review-amendment R-26]`）。\n- 识别原文与图片字节不落日志、不入状态接口；`usage_event` 只存 `image_hash` 前 16 位。\n- 状态接口与设置接口沿用管理员会话 + CSRF；公共 `/v1/providers` 不泄露路径/版本细节。\n\n## 切片与依赖\n\n| 切片 | 交付行为 | 依赖 |\n| --- | --- | --- |\n| T1 引擎与进程池 | extra 可安装；worker 可 warmup/识别；父进程状态机与内部自检 | — |\n| T2 公共路由与兜底 | `provider=local`、`auto` 兜底、预算预留、403/502/504 | T1 |\n| T3 记账与迁移 | `usage_event` 接受 local；local 成功 quota_used=0 | T2（事件来源） |\n| T4 管理端 | 设置项 + 状态接口 + 面板卡片 | T1 |\n| T5 镜像与文档 | 镜像内置 extra、版本 0.3.0、README/.env.example | T1–T4 |\n\n真实的 `Blocked-by` 以 `tickets.md` 为准，本表只表达语义依赖。\n\n## Compliance\n\n- **ADR-0001**：构建仍走 `uv export` + `uv pip install --index-url`，不读锁文件 URL；本 change 给 export 增加 `--extra local`。\n- **ADR-0002**：锁文件用镜像重解析后把源 URL 规范化回 `pypi.org`/`files.pythonhosted.org`；`uv lock --check --offline` + `uv export` 做结构/内容校验，URL 可达性需在可达 PyPI 的环境用 `uv sync --frozen` 或 HEAD 抽查补验（`[spec-review-amendment R-24]`）；不把镜像写进锁。\n- **D-6（架构边界）**：只改 `usage_event.provider` 的取值域，不改变任何跨模块数据模型的结构；`settings` 仍是 key/value。\n- **R-DEP-06/08**：不改单 worker 与非 root 约束；进程池子进程沿用容器用户。\n- **凭证约定**：文档/注释不出现本机私有凭证文档的具体路径或文件名。\n- **许可证**：PaddleOCR 模型 Apache-2.0；README 增加归属说明。\n\n## Risks / Trade-offs\n\n- **OpenCV 5 行为回归** → 已实测识别正确；若线上复现，pin `opencv-python-headless\u003c5` 并重跑锁更新流程。\n- **进程池在 Windows（spawn）与 Linux 行为差异** → worker 模块保持无副作用、只收原始类型；单测用 fake engine，真实引擎测试标 `slow`。\n- **超时后重建池导致连续两次冷启动** → 只在超时/崩溃时重建；正常路径不重建。\n- **锁 URL 规范化产出 404** → 只做 host 替换且核对路径后缀；`uv lock --check --offline` + `uv export` 做结构校验；URL 可达性在可达 PyPI 环境用 `uv sync --frozen` 或 HEAD 抽查补验（ADR-0002 已记录该残留风险）。\n- **镜像体积增长** → 记录在 README；默认开关关闭，未启用时不占 CPU/内存。\n- **`usage_events` batch 重建期间短暂锁表** → 迁移只在启动时执行，单实例；先备份 DB（R-DEP-05）。\n\n## Migration Plan\n\n1. 构建并发布 `0.3.0` 镜像（`latest` 同步；`0.2.1` 不动）。\n2. 部署前 `sqlite3 .backup`，并评估 `usage_events` 行数（超 100 万行在维护窗口执行）；启动时自动执行 `0003`（放宽 check 约束）。\n3. 管理端开启 `local_ocr_enabled`；观察 `local-ocr/status` 到 `ready`，再用 `provider=local` 验一张图。\n4. **回滚顺序**：先关闭本地开关（避免新 local 事件）→ 停新容器 → 用 0.3.0 镜像执行 `alembic -c /app/alembic.ini downgrade -1`（或 `7c1f0d2a9b31`；local 行映射为 `auto`）→ 启动 `0.2.1`。回滚时须覆盖 entrypoint（`--entrypoint alembic`），否则容器启动即 `upgrade head`。不可先启旧镜像再降级：旧镜像的 Alembic 脚本目录不认识 `0003`。\n\n## Open Questions\n\n- 目标部署机（Linux 容器、2 核 4G 下限）的本地识别 p95 未实测；本机 Windows 数据为参考。verify 阶段在服务器上补测，不改变设计与票拆。\n- `python:3.12-slim` 上 onnxruntime/opencv 的系统库依赖（如 `libgomp1`）未在镜像内实测；以 task 5.1 的 `import rapidocr, onnxruntime` 与断网启动为准，缺库时在构建期安装。\n- 镜像体积（约 110–130MB 下载 / 约 350MB 安装）与 worker 常驻内存（200–300MB）为估算；实施后按 `docker image`/`du -sh`/容器 RSS 回填。\n- 是否把 `opencv-python-headless` pin 到 `\u003c5`：当前实测通过，暂不 pin；若出现回归再按锁更新流程收紧。\n"},{"label":"spec:account-pool-scheduling","path":"openspec/changes/m4-local-ocr/specs/account-pool-scheduling/spec.md","text":"# account-pool-scheduling Specification\n\n## MODIFIED Requirements\n\n### Requirement: R-SCH-03 故障切换与总预算\n对可重试失败，调度器 SHALL 标记账号并继续下一个候选，直到成功或请求总预算耗尽；输入错误 MUST NOT 切换；无候选可用返回 503，候选全部失败且最后一次失败为 `PROVIDER_ERROR` 返回 502，预算耗尽返回 504。请求总预算默认取 `REQUEST_DEADLINE_MS`，MUST 可被管理端运行时设置覆盖并即时生效，且 `public.py` 的外层等待与 `Scheduler` MUST 使用同一个绝对 deadline。当 `provider=auto` 且本地 OCR 可用时，云阶段 MAY 使用 `deadline − reserve_eff` 作为子 deadline；本地阶段 MUST 使用原始总 deadline，整个请求 MUST NOT 超过总 deadline。`[spec-review-amendment R-50/R-06]` `[m4-local-ocr]`\n\n#### Scenario: 主账号 5xx 切换备用\n- **WHEN** 首选账号返回 5xx\n- **THEN** 同一请求由同厂商备用账号成功返回\n\n#### Scenario: 输入错误不回退\n- **WHEN** 首选账号返回图片格式错误\n- **THEN** 直接返回 400，不调用备用账号\n\n#### Scenario: 厂商持续 5xx\n- **WHEN** 候选账号都返回 5xx 且总预算未耗尽\n- **THEN** 返回 502 `PROVIDER_ERROR`，不返回 503\n\n#### Scenario: 运行时预算生效\n- **WHEN** 管理员把请求总预算改为 10000ms 并保存\n- **THEN** 后续请求按新的 10000ms 总预算执行，不再被旧的外层 deadline 截断\n\n#### Scenario: 本地兜底不突破总预算\n- **WHEN** `provider=auto`、本地可用、云阶段用尽 `deadline − reserve_eff`\n- **THEN** 本地阶段仍受原始总 deadline 约束，整个请求不超过总预算；预算不足时返回云阶段原错误\n\n### Requirement: R-SCH-05 显式厂商不回退\n当请求指定 `provider` 时，调度器 MUST 只使用该厂商账号，禁止跨厂商切换；只有 `auto` 可在全部厂商账号间切换。`provider=local` MUST 只使用本地引擎，MUST NOT 回退到任何云厂商。`[m4-local-ocr]`\n\n#### Scenario: 显式百度无可用\n- **WHEN** `provider=baidu` 且所有百度账号不可用\n- **THEN** 返回 503 `PROVIDER_UNAVAILABLE`，不调用腾讯\n\n#### Scenario: auto 跨厂商\n- **WHEN** `provider=auto` 且百度账号全部不可用而腾讯可用\n- **THEN** 请求成功并返回 `provider=\"tencent\"`\n\n#### Scenario: 显式本地不回云\n- **WHEN** `provider=local` 且本地引擎失败\n- **THEN** 返回本地错误（502/504），不调用任何云厂商\n\n## ADDED Requirements\n\n### Requirement: R-SCH-07 auto 兜底本地与预算预留\n当 `provider=auto`、本地 OCR 已启用且依赖可用时，调度器 SHALL 在云端无候选或全部候选以可重试错误失败时尝试本地识别；云阶段截止 MUST 为总 deadline 减去本地预留预算；本地尝试 MUST 使用剩余预算，剩余不足最小预算时 MUST 放弃兜底并返回云阶段原错误；`InputError`、显式云厂商或本地不可用时 MUST NOT 触发本地兜底。`reserve_eff` MUST 按 `min(LOCAL_OCR_RESERVE_MS, max(0, total_budget − LOCAL_OCR_MIN_BUDGET_MS))` 收敛；`total_budget ≤ LOCAL_OCR_MIN_BUDGET_MS` 时 MUST NOT 预留（等价于不兜底）。`[spec-review-amendment R-01]` `[m4-local-ocr]`\n\n#### Scenario: 云全挂自动兜底\n- **WHEN** `provider=auto`、本地已启用且就绪，所有云账号不可用或均失败\n- **THEN** 请求由本地引擎完成并返回 200、`provider=\"local\"`\n\n#### Scenario: 输入错误不兜底\n- **WHEN** 首选云账号返回图片格式错误（`InputError`）\n- **THEN** 直接返回 400，不尝试本地引擎\n\n#### Scenario: 本地不可用不预留\n- **WHEN** `provider=auto` 但本地未启用或依赖缺失\n- **THEN** 云阶段使用完整总预算，不扣减本地预留\n\n#### Scenario: 小预算不预留\n- **WHEN** `request_deadline_ms` 为 1000–5000ms 且本地启用\n- **THEN** `reserve_eff=0`，云阶段使用完整预算，不因预留导致云阶段截止落在过去\n\n#### Scenario: 云端失败但预算不足\n- **WHEN** 云阶段失败后剩余预算低于本地最小预算\n- **THEN** 不启动本地识别，返回云阶段原错误（503/502/504）\n"},{"label":"spec:admin-api","path":"openspec/changes/m4-local-ocr/specs/admin-api/spec.md","text":"# admin-api Specification\n\n## MODIFIED Requirements\n\n### Requirement: R-ADM-08 运行时设置读写\n管理员 SHALL 能读取与部分更新运行时设置：缓存开关、缓存 TTL、缓存容量、请求总预算、账号默认超时、本地 OCR 开关；更新 MUST 校验类型与范围，显式 `null` MUST 返回 400，校验错误 MUST 含字段名；提交成功后 MUST 对后续请求生效；缓存参数变化 MUST 清空现有缓存并在响应中标记；**本地 OCR 开关变化 MUST 同样清空缓存并在响应中标记 `cache_cleared`**；重启后 MUST 按持久化值恢复本地 worker（`enabled=true` 且依赖已安装时从 `starting` 开始建池）；只读项 MUST 包含鉴权状态、版本、上传限制、并发上限、会话时长与面板产物状态。`[spec-review-amendment R-05/R-15/R-02]` `[m4-local-ocr]`\n\n#### Scenario: 读取设置\n- **WHEN** 调用 `GET /api/admin/settings`\n- **THEN** 返回可编辑项与只读项，值为当前生效值\n\n#### Scenario: 部分更新\n- **WHEN** 只提交 `cache_ttl_seconds`\n- **THEN** 其余设置保持不变，重启后新值仍生效\n\n#### Scenario: 非法值\n- **WHEN** 提交超出范围的缓存 TTL 或非整数\n- **THEN** 返回 400 `BAD_REQUEST`，`error.fields` 含字段名，设置与运行时均不变\n\n#### Scenario: 显式 null\n- **WHEN** 提交 `{\"cache_ttl_seconds\": null}`\n- **THEN** 返回 400 `BAD_REQUEST`，不把 null 当作未提供\n\n#### Scenario: 容量与预算上限\n- **WHEN** 提交 `cache_max_entries=2001` 或 `request_deadline_ms=20001`\n- **THEN** 返回 400 `BAD_REQUEST`\n\n#### Scenario: 未知键\n- **WHEN** 提交未被定义的设置键\n- **THEN** 返回 400 `BAD_REQUEST`，不静默忽略\n\n#### Scenario: 缓存参数变更\n- **WHEN** 修改缓存开关、TTL 或容量并保存\n- **THEN** 响应标记缓存已清空，缓存条目归零\n\n#### Scenario: 请求预算生效\n- **WHEN** 把请求总预算改为更小值并保存\n- **THEN** 后续 OCR 请求使用新的总预算\n\n#### Scenario: 账号默认超时生效\n- **WHEN** 修改账号默认超时后创建未显式指定超时的账号\n- **THEN** 新账号使用新的默认超时\n\n#### Scenario: 本地开关生效\n- **WHEN** 提交 `{\"local_ocr_enabled\": true}` 并保存\n- **THEN** 响应成功且 `cache_cleared=true`，后续 `provider=local` 可用，状态接口从 `starting` 变为 `ready`\n\n#### Scenario: 本地开关类型错误\n- **WHEN** 提交 `{\"local_ocr_enabled\": \"yes\"}`\n- **THEN** 返回 400 `BAD_REQUEST`，`error.fields[].field=\"local_ocr_enabled\"`，开关不变\n\n#### Scenario: 重启后恢复本地 worker\n- **WHEN** 设置为 `local_ocr_enabled=true` 且依赖已安装，进程重启后读取设置\n- **THEN** `readonly` 仍显示原值，本地 worker 自动从 `starting` 进入 `ready`，无需再次保存\n\n### Requirement: R-ADM-06 用量与日志查询\n管理员 SHALL 能按时间与维度查询用量汇总、按本地日查询时间序列、分页查询请求日志；汇总、序列与日志 MUST 共用时间窗口并拒绝超过 90 天的跨度；汇总与序列 MUST 支持成员/厂商/账号过滤，汇总行 MUST 带显示名称并按 key 升序（`null` 最后），日志 MUST 带成员与账号名称、支持时间与错误码过滤并返回匹配总数；`provider='auto'` MUST 有显示名「自动路由」，`provider='local'` MUST 有显示名「本地 RapidOCR」；日志 MUST NOT 返回 OCR 原文与凭证。`[spec-review-amendment R-06/R-11/R-12/R-52/R-14]` `[m4-local-ocr]`\n\n#### Scenario: 按厂商汇总\n- **WHEN** 调用 `/usage/summary?group_by=provider`\n- **THEN** 返回每个厂商的成功、失败、缓存命中计数与平均延迟\n\n#### Scenario: 平均延迟口径\n- **WHEN** 汇总或序列范围内同时存在成功与失败事件\n- **THEN** 平均延迟为该范围内全部事件 `latency_ms` 的整数均值（含失败事件），无事件时为 `null`\n\n#### Scenario: 汇总显示名称\n- **WHEN** 汇总按成员或账号分组\n- **THEN** 每行包含可显示的名称；对应实体已删除时为 `null`\n\n#### Scenario: 已删除实体分组\n- **WHEN** 汇总范围内同时存在有效成员与已删除成员\n- **THEN** 已删除成员合并为 `key=null` 的单行，排序在有效 key 之后，label 为 `null`\n\n#### Scenario: 自动路由失败\n- **WHEN** `provider=auto` 的请求因无候选失败\n- **THEN** 汇总中 `auto` 行 label 为「自动路由」，总览 `today.auto_failures` 加一\n\n#### Scenario: 本地厂商标签\n- **WHEN** 汇总或日志中出现 `provider='local'`\n- **THEN** label 为「本地 RapidOCR」；用量与日志的厂商筛选均可传 `provider=local`\n\n#### Scenario: 汇总跨度上限\n- **WHEN** 汇总请求的时间跨度超过 90 天\n- **THEN** 返回 400 `BAD_REQUEST`\n\n#### Scenario: 默认窗口\n- **WHEN** 未传 `from/to` 请求序列\n- **THEN** 返回 7 个本地日桶（含今日）\n\n#### Scenario: 日序列\n- **WHEN** 调用 `/usage/series?from=2026-10-29\u0026to=2026-11-04`\n- **THEN** 返回按 `Asia/Shanghai` 日分桶的序列，缺失日期补零，且包含 `2026-11-04` 当日\n\n#### Scenario: 仅日期结束值含当日\n- **WHEN** `to` 只给 `YYYY-MM-DD` 形式\n- **THEN** 该参数被解释为该本地日的结束，筛选结果包含当日事件\n\n#### Scenario: 日期边界\n- **WHEN** 事件时间恰好是 `to` 次日的本地 00:00:00\n- **THEN** 该事件不计入本次筛选（半开区间）\n\n#### Scenario: 时间范围倒置\n- **WHEN** `from` 晚于 `to`\n- **THEN** 返回 400 `BAD_REQUEST`\n\n#### Scenario: 序列跨度上限\n- **WHEN** 序列请求的时间跨度超过 90 天\n- **THEN** 返回 400 `BAD_REQUEST`\n\n#### Scenario: 日志分页\n- **WHEN** 调用 `/logs?limit=50\u0026offset=50`\n- **THEN** 返回第二页、不超过 50 条，并返回匹配总数\n\n#### Scenario: 日志过滤\n- **WHEN** 调用 `/logs?success=false\u0026provider=tencent\u0026error_code=TIMEOUT`\n- **THEN** 只返回同时满足三个条件的记录\n\n#### Scenario: 日志显示名称\n- **WHEN** 日志行对应的成员或账号存在\n- **THEN** 返回 `user_name` 与 `account_name`；实体已删除时为 `null`\n\n#### Scenario: 非法时间\n- **WHEN** 传入无法解析的 `from` 或 `to`\n- **THEN** 返回 400 `BAD_REQUEST`\n\n### Requirement: R-ADM-09 总览聚合\n管理员 SHALL 能获取总览数据：今日请求、成功、失败、缓存命中、配额用量、成功率、缓存命中率、平均延迟，近 7 个本地日的序列，各厂商账号数与可用账号数，账号配额用量，最近 10 条错误与缓存状态；今日 MUST 按 `Asia/Shanghai` 自然日计算；无请求时比率 MUST 为空值而不是 0；`available_accounts` MUST 表示瞬时可调度数；`provider='auto'` 的失败 MUST 单独计数；`provider='local'` MUST 在厂商行中返回一行（`accounts=0`、`available_accounts=0`），使今日总数与厂商行之和可对账。`[spec-review-amendment R-09/R-21/R-52/R-13]` `[m4-local-ocr]`\n\n#### Scenario: 有数据的总览\n- **WHEN** 今日存在成功与失败请求\n- **THEN** 各计数、成功率、缓存命中率与平均延迟为非空值\n\n#### Scenario: 无请求的总览\n- **WHEN** 今日没有请求\n- **THEN** 计数为 0，成功率、缓存命中率与平均延迟为 `null`\n\n#### Scenario: 可用账号数\n- **WHEN** 某厂商账号被禁用、冷却或配额耗尽\n- **THEN** 该厂商的可用账号数不包含这些账号\n\n#### Scenario: 可用账号数的瞬时口径\n- **WHEN** 账号并发已满或令牌桶暂时为空\n- **THEN** 该账号也暂不计入 `available_accounts`；GET 不改变账号状态\n\n#### Scenario: 近 7 日序列\n- **WHEN** 请求总览\n- **THEN** 响应包含 7 个本地日桶的序列\n\n#### Scenario: 自动路由失败计数\n- **WHEN** 今日存在 `provider=auto` 的失败事件\n- **THEN** `today.auto_failures` 计入这些事件，厂商行不重复计入\n\n#### Scenario: 本地厂商行\n- **WHEN** 今日存在 `provider='local'` 的事件\n- **THEN** 厂商行包含 `local`（`accounts=0`、`available_accounts=0`），今日请求总数与各厂商行请求数之和一致\n\n#### Scenario: 最近错误\n- **WHEN** 存在超过 10 条失败记录\n- **THEN** 只返回最近 10 条，包含账号名称，且不含 OCR 原文与凭证\n\n## ADDED Requirements\n\n### Requirement: R-ADM-11 本地 OCR 状态查询\n管理员 SHALL 能查询本地 OCR 状态：启用状态、依赖是否安装、运行状态（`stopped`/`starting`/`ready`/`error`/`unavailable`）、并发、超时与有效超时、预留预算与有效预留、下次重试等待、模型信息、最近耗时、最近错误、累计请求与兜底次数。接口 MUST 需要管理员会话，MUST NOT 返回模型文件绝对路径、凭证或识别原文；`last_error` MUST 为脱敏短消息（去路径/堆栈/截断）。`[spec-review-amendment R-28/R-31]` `[m4-local-ocr]`\n\n#### Scenario: 状态可查\n- **WHEN** 管理员请求 `GET /api/admin/local-ocr/status`\n- **THEN** 返回上述字段；`state` 与当前 worker 生命周期一致\n\n#### Scenario: 依赖缺失\n- **WHEN** 运行环境未安装 rapidocr 或 onnxruntime\n- **THEN** 返回 `installed=false`、`state=\"unavailable\"`，不抛 500；`/v1/providers` 的 local `enabled` 为 false\n\n#### Scenario: 预热失败\n- **WHEN** warmup 因模型加载失败进入 `error`\n- **THEN** 返回 `state=\"error\"`、脱敏的 `last_error` 与 `next_retry_in_ms`，不含模型文件绝对路径\n\n#### Scenario: 未授权\n- **WHEN** 未携带管理员会话请求状态接口\n- **THEN** 返回 401 `UNAUTHORIZED`\n"},{"label":"spec:admin-panel","path":"openspec/changes/m4-local-ocr/specs/admin-panel/spec.md","text":"# admin-panel Specification\n\n## MODIFIED Requirements\n\n### Requirement: R-PANEL-08 设置界面\n设置页 SHALL 分可编辑区与只读区：可编辑缓存开关、缓存 TTL、缓存容量、请求总预算、账号默认超时、本地 OCR 开关；只读展示鉴权状态、版本、上传限制、并发上限与会话时长；页面 MUST 展示配额模板与「以官网为准」免责声明。本地 OCR 区 MUST 展示运行状态、模型信息、最近耗时与最近错误；依赖缺失时 MUST 禁用开关并说明原因。开关草稿 MUST 以设置表单为唯一来源，状态卡只读展示；状态卡 MUST 具备加载/空/错误三态，使用独立查询与同高骨架，MUST NOT 阻塞可编辑区；`starting` 期间 MUST 轮询（≤1s）至 `ready`/`error`，`ready`/`stopped` 停止或降频；保存 MUST 只提交 dirty 字段，disabled 字段 MUST 从 payload 剔除；窄屏 MUST 单列可用，`last_error` MUST 截断并可展开。`[spec-review-amendment R-33]` `[m4-local-ocr]`\n\n#### Scenario: 保存合法设置\n- **WHEN** 管理员把缓存 TTL 改为合法值并保存\n- **THEN** 保存成功，刷新页面后显示新值\n\n#### Scenario: 非法值\n- **WHEN** 管理员提交超出范围的值\n- **THEN** 字段显示错误，保存被阻止，原设置不变\n\n#### Scenario: 缓存参数变更提示\n- **WHEN** 管理员修改缓存开关、TTL 或容量并保存\n- **THEN** 成功提示说明现有缓存已清空\n\n#### Scenario: 清空缓存\n- **WHEN** 管理员点击清空缓存并确认\n- **THEN** 页面提示已清除的条数，缓存条目归零\n\n#### Scenario: 只读区\n- **WHEN** 管理员查看设置页\n- **THEN** 鉴权状态显示为强制开启，版本、上传限制、并发与会话时长可见\n\n#### Scenario: 本地 OCR 开关与状态\n- **WHEN** 管理员开启本地 OCR 并保存\n- **THEN** 卡片显示状态从 `starting` 变为 `ready`，并展示模型、最近耗时与错误为空\n\n#### Scenario: 状态卡三态\n- **WHEN** 状态接口请求中/返回空/请求失败\n- **THEN** 分别显示同高骨架、空态说明与错误说明+重试按钮；可编辑设置在三种情况下仍可操作\n\n#### Scenario: 状态查询不阻塞设置\n- **WHEN** 状态接口慢于设置接口返回\n- **THEN** 设置表单先渲染并可编辑，状态卡在局部骨架中等待，不出现整页 loading\n\n#### Scenario: 只提交改动字段\n- **WHEN** 管理员只修改本地 OCR 开关后保存\n- **THEN** 请求体只包含该字段（或 dirty 字段），不因其他字段未变而产生覆盖\n\n#### Scenario: 本地依赖缺失\n- **WHEN** 本地依赖未安装\n- **THEN** 开关禁用并显示不可用原因，保存请求不提交该字段\n\n#### Scenario: 窄屏展示\n- **WHEN** 视口宽度小于断点\n- **THEN** 本地 OCR 卡片单列展示，`last_error` 截断且可展开，不破坏其他设置区\n"},{"label":"spec:deployment","path":"openspec/changes/m4-local-ocr/specs/deployment/spec.md","text":"# deployment Specification\n\n## ADDED Requirements\n\n### Requirement: R-DEP-11 运行镜像内置本地 OCR 依赖\n运行镜像 SHALL 通过锁文件安装 optional extra `local`（rapidocr + onnxruntime 及其传递依赖），构建 MUST 继续支持通过参数指定 Python 索引；模型 MUST 随依赖包进入镜像，容器 MUST NOT 依赖运行期下载模型；本地 OCR 开关默认关闭。构建 MUST 验证镜像内可导入 rapidocr 与 onnxruntime；若基础镜像缺系统库（如 `libgomp1`），构建期 MUST 安装。版本升级 MUST 覆盖全部版本源：`backend/pyproject.toml`、`backend/app/__init__.py`、`frontend/package.json`、`backend/uv.lock` 的 project version、README 版本锚、compose tag。`[spec-review-amendment R-22/R-36]` `[m4-local-ocr]`\n\n#### Scenario: 构建包含本地依赖\n- **WHEN** 用参数指定的可达索引构建 0.3.0 镜像\n- **THEN** 镜像内可导入 rapidocr 与 onnxruntime，安装版本与锁文件一致\n\n#### Scenario: 系统库缺失\n- **WHEN** 基础镜像导入 onnxruntime 时缺 `libgomp1` 等系统库\n- **THEN** 构建期安装所需系统库并重新验证 import，不把问题留到运行期\n\n#### Scenario: 无外网启动\n- **WHEN** 容器在无外网环境启动且未开启本地 OCR\n- **THEN** 服务正常启动、`/healthz` 为 ok，不产生任何模型下载请求\n\n#### Scenario: 开启后离线就绪\n- **WHEN** 在无外网的容器内开启本地 OCR\n- **THEN** worker 使用镜像内置模型完成预热并进入 `ready`\n"},{"label":"spec:local-ocr","path":"openspec/changes/m4-local-ocr/specs/local-ocr/spec.md","text":"# local-ocr Specification\n\n## Purpose\n定义本地 OCR 引擎的可用性、进程隔离、识别输出与启停状态，使网关在云厂商不可用时仍能提供降级识别能力。\n\n## ADDED Requirements\n\n### Requirement: R-LOC-01 引擎与模型来源\n系统 SHALL 通过可选依赖 extra `local` 提供 RapidOCR（onnxruntime CPU）引擎；模型 MUST 随安装包分发并在本地校验，识别路径 MUST NOT 发起网络请求。`language` 取值 `zh`/`en`/`auto` SHALL 全部使用内置模型。\n\n#### Scenario: 离线识别\n- **WHEN** 主机无外网且已安装 extra、模型随包存在\n- **THEN** 本地识别成功返回文本，且不产生任何下载请求\n\n#### Scenario: 依赖缺失\n- **WHEN** 运行环境未安装 rapidocr 或 onnxruntime\n- **THEN** 系统报告本地能力不可用，进程不因导入失败而崩溃，云端识别不受影响\n\n### Requirement: R-LOC-02 进程隔离与并发\n本地识别 SHALL 在独立进程池中执行，MUST NOT 阻塞事件循环；并发上限 SHALL 由环境变量控制，默认 1。子进程 MUST 以 `multiprocessing.get_context(\"spawn\")` 创建，MUST NOT 继承父进程堆内存中的凭证；worker initializer MUST 清除 `MASTER_KEY`/`ADMIN_PASSWORD` 等敏感环境变量，worker MUST NOT 读取任何凭证。显式 local 请求 SHOULD 先获取本地并发门（大小 = 并发上限）再进入全局并发槽，使排队中的本地请求不占用全局槽。`[spec-review-amendment R-19/R-26/R-27]`\n\n#### Scenario: 不阻塞事件循环\n- **WHEN** 一个本地识别任务持续运行 2 秒\n- **THEN** 同期健康检查与其他 OCR 请求仍能及时响应\n\n#### Scenario: 并发生效\n- **WHEN** `LOCAL_OCR_MAX_CONCURRENCY=2` 且两个本地请求同时到达\n- **THEN** 两个任务并行执行，不互相排队等待\n\n#### Scenario: 本地排队不挤占全局并发\n- **WHEN** 8 个显式 local 请求同时到达而本地并发为 1，同时有云请求到达\n- **THEN** 云请求仍能取得全局并发槽，不因本地排队被饿死\n\n### Requirement: R-LOC-03 识别与输出归一化\n本地引擎 SHALL 把结果归一化为 `text`（行以换行连接）与 `lines[{text, confidence}]`，置信度取 0–1；成功但无文本 MUST 视为成功，返回空 `text` 与 `EMPTY_TEXT` 警告。\n\n#### Scenario: 中文截图\n- **WHEN** 上传含中文与数字的清晰截图\n- **THEN** 返回 200、`provider=\"local\"`，`lines` 顺序与图片自上而下一致\n\n#### Scenario: 无文本\n- **WHEN** 图片不含可识别文字\n- **THEN** 返回 200、`text=\"\"`，`warnings` 含 `EMPTY_TEXT`\n\n### Requirement: R-LOC-04 超时、取消与恢复\n单次本地识别 SHALL 受剩余请求预算约束，上限由 `LOCAL_OCR_TIMEOUT_MS` 控制；超时 MUST 返回 504 `TIMEOUT`，MUST **终止（terminate/kill）旧池的 worker 进程**并重建（仅取消排队任务不够）；同一池中因重建被取消的其他请求 MUST 映射为 503/504 并写入 `usage_event`，MUST NOT 冒泡为 500；worker 崩溃 MUST 在下次请求时重建，MUST NOT 使后续本地请求永久失败。应用关闭时 shutdown 上限 20s，超时后 kill 残留 worker。`[spec-review-amendment R-03/R-12/R-29]`\n\n#### Scenario: 单次超时\n- **WHEN** 本地识别超过剩余预算\n- **THEN** 返回 504 `TIMEOUT`，旧 worker 被终止、本地状态回到可重试态\n\n#### Scenario: 超时不泄漏进程\n- **WHEN** 连续 N 次本地识别超时\n- **THEN** 子进程数不超过并发上限，不随超时次数增长\n\n#### Scenario: 兄弟请求被重建取消\n- **WHEN** 一个请求超时触发池重建，同一池中另有排队请求\n- **THEN** 被取消的请求返回 503/504 并写入 `usage_event`，不返回 500\n\n#### Scenario: worker 崩溃后恢复\n- **WHEN** worker 进程异常退出\n- **THEN** 下一次本地请求重建进程池并成功识别\n\n### Requirement: R-LOC-05 开关与就绪状态\n系统 SHALL 提供本地 OCR 开关，默认关闭；启用后 SHALL 建池并预热模型，状态按 `stopped`/`starting`/`ready`/`error`/`unavailable` 报告；关闭 MUST 停止进程池且不再执行本地识别。开关为持久化运行时设置：进程重启后 MUST 按持久化值恢复建池（`enabled=true` 时从 `starting` 开始）。依赖缺失 MUST 记为 `unavailable` 且不建池；模型加载失败 MUST 记为 `error`。`set_enabled` MUST 幂等（仅状态变化时执行）；warmup MUST 使用含文字的小图并断言返回非空，MUST 有超时；`error` 后的重试 MUST 有最小间隔与退避。状态快照 SHALL 含启用状态、依赖是否安装、运行状态、并发、超时与有效值、预留预算与有效值、模型信息、最近耗时、最近错误（脱敏）、下次重试等待与累计请求/兜底次数。`[spec-review-amendment R-05/R-09/R-10/R-11/R-18/R-28/R-31]`\n\n#### Scenario: 启用并预热\n- **WHEN** 管理员开启本地 OCR\n- **THEN** 状态先为 `starting`，预热完成后变为 `ready` 并报告模型信息\n\n#### Scenario: 重启后恢复\n- **WHEN** 持久化设置为 `local_ocr_enabled=true` 且依赖已安装，进程重启\n- **THEN** worker 自动建池并预热，状态从 `starting` 进入 `ready`，无需管理员再次保存\n\n#### Scenario: 依赖缺失\n- **WHEN** 运行环境未安装 rapidocr 或 onnxruntime\n- **THEN** 状态为 `unavailable`，不建池；开启开关也不创建 worker；显式 local 仍返回 403\n\n#### Scenario: 重复启用不重复建池\n- **WHEN** 在 `ready` 或 `starting` 状态下再次保存设置（值仍为 true）\n- **THEN** 不创建第二个进程池，状态不变\n\n#### Scenario: 关闭后拒绝\n- **WHEN** 管理员关闭本地 OCR 后请求 `provider=local`\n- **THEN** 返回 403 `FORBIDDEN`，且不再创建 worker 进程\n\n#### Scenario: 预热失败后退避\n- **WHEN** warmup 因模型加载持续失败进入 `error`\n- **THEN** 在最小重试间隔内不重复 spawn/加载，状态接口报告 `next_retry_in_ms`\n"},{"label":"spec:ocr-api","path":"openspec/changes/m4-local-ocr/specs/ocr-api/spec.md","text":"# ocr-api Specification\n\n## MODIFIED Requirements\n\n### Requirement: R-API-01 单张图片识别\n系统 SHALL 接受 multipart 文件或 JSON base64 二选一，将图片交给调度器识别并返回归一化结果；同一请求同时提供两种输入 MUST 返回 400。`language` 只接受 `zh`（默认）/`en`/`auto`，其它值 MUST 返回 400，并按厂商映射表传给适配器。`provider` 只接受 `auto`（默认）/`baidu`/`tencent`/`local`；显式 `local` 在本地 OCR 未启用或依赖不可用时 MUST 返回 403 `FORBIDDEN`，其它未知值 MUST 返回 400 `BAD_REQUEST`。该 403 判定 MUST 先于缓存读取；缓存 MUST NOT 让已禁用的 local 返回成功结果。`[spec-review-amendment D4/R-02]` `[m4-local-ocr]`\n\n#### Scenario: multipart 识别成功\n- **WHEN** 客户端携带 Bearer Key 上传 `file` 且未指定 provider\n- **THEN** 系统返回 200，`text` 与 `lines` 存在，`provider` 为实际使用的厂商\n\n#### Scenario: base64 识别成功\n- **WHEN** 客户端发送 `{\"image_base64\":\"...\"}` 且未指定 provider\n- **THEN** 系统返回 200，响应含 `request_id`、`latency_ms`、`quota.used`\n\n#### Scenario: 两种输入同时提供\n- **WHEN** 请求同时提供 `file` 与 `image_base64`（或 `image_base64` 与 `image_url`）\n- **THEN** 系统返回 400 `BAD_REQUEST`\n\n#### Scenario: 显式本地且已启用\n- **WHEN** 请求 `provider=local` 且本地 OCR 已启用并就绪\n- **THEN** 系统返回 200，`provider=\"local\"`，不调用任何云厂商\n\n#### Scenario: 显式本地但未启用\n- **WHEN** 请求 `provider=local` 且本地 OCR 未启用或依赖不可用\n- **THEN** 系统返回 403 `FORBIDDEN`，不调用任何厂商\n\n#### Scenario: 禁用后缓存不绕过\n- **WHEN** 先在启用状态缓存一张 local 结果，再关闭本地开关并重新请求同一图片与 provider\n- **THEN** 返回 403 `FORBIDDEN`，不返回旧的缓存 200；auto 请求不返回 `provider=\"local\"` 的缓存结果\n\n#### Scenario: 不支持的 provider\n- **WHEN** 请求的 `provider` 不在 `auto`、`baidu`、`tencent`、`local` 之内\n- **THEN** 系统返回 400 `BAD_REQUEST`，不调用任何厂商\n\n#### Scenario: 不支持的语言\n- **WHEN** 请求的 `language` 不在 `zh`、`en`、`auto` 之内\n- **THEN** 系统返回 400 `BAD_REQUEST`，不调用任何厂商\n\n### Requirement: R-API-03 图片规范化\n系统 SHALL 用 Pillow 校验真实图片内容并只接受 JPEG/PNG/BMP；入口上限 10MB（按解码后的图片字节数）；MUST 在解码前拒绝 \u003e40M 像素或最长边 \u003e10000 的图片；MUST 按 EXIF 方向旋转，并按厂商限制（百度：base64+urlencode 后 ≤8MB、最短边 ≥15px、最长边 ≤4096px）等比缩放/转 JPEG，仍超限返回 400。`provider=local` 时 MUST 同样执行 Pillow 校验、EXIF 旋转与 JPEG 重编码；字节上限 MUST 作用于**重编码后的 JPEG 字节**（`MAX_UPLOAD_BYTES`），最长边 10000，MUST NOT 套用 base64 膨胀上限。`[spec-review-amendment D8/D10/D11/R-30]` `[m4-local-ocr]`\n\n#### Scenario: 超限自动缩放\n- **WHEN** 上传 9MB 的 PNG 且 `provider=auto`\n- **THEN** 系统缩放到百度限制（base64+urlencode 后 ≤8MB、最短边 ≥15px、最长边 ≤4096px）后提交厂商并返回 200\n\n#### Scenario: 伪造图片\n- **WHEN** 上传内容无法被 Pillow 解码（即使扩展名为 .png）\n- **THEN** 系统返回 400 `BAD_REQUEST`\n\n#### Scenario: 像素炸弹\n- **WHEN** 上传的图片声明像素数超过 40M（如 12000×12000）\n- **THEN** 系统在解码前返回 400 `BAD_REQUEST`，不分配完整位图\n\n#### Scenario: 超过入口上限\n- **WHEN** 请求体超过 10MB\n- **THEN** 系统返回 400 `BAD_REQUEST`，不调用厂商\n\n#### Scenario: 本地不做 base64 膨胀\n- **WHEN** 上传 9MB 的 PNG 且 `provider=local`\n- **THEN** 系统按原始字节上限校验并完成识别，不因 base64 膨胀返回 400\n\n### Requirement: R-API-05 统一响应与错误码\n成功响应 SHALL 含 `request_id`、`provider`、`text`、`lines[{text, confidence}]`、`latency_ms`、`cached`、`quota{unit,used}`、`warnings`；失败响应 SHALL 为 `{\"request_id\",\"error\":{\"code\",\"message\"}}` 并遵守约定 HTTP 状态。`quota.used` 对云厂商成功调用为 1，对本地识别成功 MUST 为 0；响应与 `usage_event.quota_used` MUST 由实际 `provider` 派生，MUST NOT 对成功路径硬编码 1。网关全局并发饱和且等待超过剩余预算时 SHALL 返回 503 `PROVIDER_UNAVAILABLE`（message 标注 gateway at capacity）；本地识别运行失败 SHALL 返回 502 `PROVIDER_ERROR`。`[spec-review-amendment Q5/R-04]` `[m4-local-ocr]`\n\n#### Scenario: confidence 可空\n- **WHEN** 实际厂商为百度标准版\n- **THEN** `lines[].confidence` 为 `null`，响应仍为 200\n\n#### Scenario: 本地成功不扣配额\n- **WHEN** 请求由本地引擎成功识别\n- **THEN** 响应 `provider=\"local\"`、`quota.used=0`、`warnings` 按文本是否为空决定\n\n#### Scenario: 全部候选不可用\n- **WHEN** `auto` 请求没有任何可用账号且本地 OCR 未启用或不可用\n- **THEN** 返回 503 `PROVIDER_UNAVAILABLE`\n\n#### Scenario: 厂商持续异常\n- **WHEN** 所有候选都返回 5xx/协议错误，且本地兜底未启用或失败\n- **THEN** 返回 502 `PROVIDER_ERROR` `[spec-review-amendment D5]`\n\n#### Scenario: 总预算耗尽\n- **WHEN** 尝试所有候选后超过 `REQUEST_DEADLINE_MS`\n- **THEN** 返回 504 `TIMEOUT`\n\n#### Scenario: 网关并发饱和\n- **WHEN** 全局并发达到 `MAX_CONCURRENT_REQUESTS` 且等待超过剩余预算\n- **THEN** 返回 503 `PROVIDER_UNAVAILABLE`，message 标注 gateway at capacity\n\n### Requirement: R-API-06 服务元数据与健康检查\n系统 SHALL 提供 `GET /v1/providers`（厂商与可用账号数，不含凭证）、`GET /v1/me`（当前 Key 的今日用量与限额）、`GET /healthz`（数据库健康）。`/v1/providers` MUST 额外返回 `local` 条目（`code`/`name`/`enabled`，不含账号数），`enabled` 反映本地 OCR 是否启用且安装可用（合并语义；不区分两种 false 的原因）。`[spec-review-amendment R-20]` `[m4-local-ocr]`\n\n#### Scenario: providers 不泄露凭证\n- **WHEN** 已配置 2 个百度账号与 1 个腾讯账号\n- **THEN** `/v1/providers` 返回 `available_accounts` 计数，响应中无凭证字段\n\n#### Scenario: 本地条目\n- **WHEN** 本地 OCR 已启用且依赖已安装\n- **THEN** `/v1/providers` 含 `{\"code\":\"local\",\"name\":\"本地 RapidOCR\",\"enabled\":true}`，不含路径或模型文件信息\n\n#### Scenario: 数据库不可用\n- **WHEN** `/healthz` 的数据库检查在 1s 内失败\n- **THEN** 返回 503，`db` 字段为 `error`\n"},{"label":"spec:quota-accounting","path":"openspec/changes/m4-local-ocr/specs/quota-accounting/spec.md","text":"# quota-accounting Specification\n\n## MODIFIED Requirements\n\n### Requirement: R-QTA-01 成功请求记账\n每次成功调用厂商 SHALL 使账号计数 +1、Key 当日计数 +1、写入一条 `usage_event`（`quota_used=1`）；缓存命中记 `quota_used=0`；失败请求记 `quota_used=0` 且 MUST NOT 扣账号配额。本地识别成功 MUST 记 `quota_used=0`、`account_id=NULL`、`provider='local'`，MUST NOT 增加任何账号计数；Key 的请求条数与 RPM 仍按实际请求记录。本地事件（含显式 `provider=local` 与 auto 兜底）MUST NOT 计入用户日限额（`daily_limit` 按 `quota_used` 合计）。`[spec-review-amendment R-15]` `[m4-local-ocr]`\n\n#### Scenario: 成功扣一次\n- **WHEN** 一次未命中的请求经百度成功返回\n- **THEN** 账号与 Key 计数各 +1，`usage_event.quota_used=1`\n\n#### Scenario: 缓存命中不扣\n- **WHEN** 相同图片、语言与 provider 再次请求并命中缓存\n- **THEN** `usage_event.cached=1`、`quota_used=0`，账号与 Key 计数不变\n\n#### Scenario: 失败不扣\n- **WHEN** 所有候选均失败\n- **THEN** 账号配额计数不变，`usage_event.success=0`、`quota_used=0`\n\n#### Scenario: 本地成功不扣厂商额度\n- **WHEN** 请求由本地引擎成功识别\n- **THEN** 写入 `provider='local'`、`account_id=NULL`、`quota_used=0` 的事件，账号计数不变，Key 的当日请求条数 +1\n\n#### Scenario: 显式本地不消耗日限额\n- **WHEN** 同一 Key 连续以 `provider=local` 成功识别多张图片\n- **THEN** `usage_event.quota_used` 均为 0，`/v1/me` 的当日已用额度不增长；仅 RPM 与全局并发约束生效\n"},{"label":"spec:result-cache","path":"openspec/changes/m4-local-ocr/specs/result-cache/spec.md","text":"# result-cache Specification\n\n## MODIFIED Requirements\n\n### Requirement: R-CAC-01 缓存键与命中\n系统 SHALL 以 `sha256(image_bytes) + language + (provider 或 auto)` 为键缓存成功结果；命中时 MUST 返回 `cached=true`、`quota.used=0`，且不发起厂商调用。公共入口 MUST 先执行 provider 可用性门禁，再做缓存读取：显式 `provider=local` 在本地 OCR 未启用或依赖不可用时 MUST 返回 403，MUST NOT 因缓存命中返回 200。`[spec-review-amendment R-02]` `[m4-local-ocr]`\n\n#### Scenario: 重复图片命中\n- **WHEN** 相同图片、语言与 provider 在 TTL 内再次请求\n- **THEN** 返回 200、`cached=true`、`quota.used=0`，且无厂商出站请求\n\n#### Scenario: provider 隔离\n- **WHEN** 同一图片先以 `provider=baidu` 请求，再以 `provider=tencent` 请求\n- **THEN** 两次缓存键不同，第二次不复用第一次结果\n\n#### Scenario: 禁用 local 后不命中\n- **WHEN** 先在启用状态缓存一张 `provider=local` 结果，再关闭本地开关并请求同一图片\n- **THEN** 返回 403 `FORBIDDEN`（不是缓存 200）；`provider=auto` 不返回 `provider=\"local\"` 的缓存结果\n\n### Requirement: R-CAC-02 缓存边界\n缓存 SHALL 仅保存成功且 `text` 非空、单条 ≤256KB 的结果；容量默认 1000 条、TTL 默认 3600 秒；容量与 TTL MUST 可经管理端运行时设置覆盖（容量 10–2000 条、TTL 60–86400 秒），参数变更 MUST 清空现有缓存；`local_ocr_enabled` 变化 MUST 同样清空现有缓存（含 `auto` 键下可能存在的 local 结果）；MUST 为进程内存储，重启即失效。`[spec-review-amendment R-02]` `[m4-local-ocr]`\n\n#### Scenario: 空文本不缓存\n- **WHEN** 厂商成功返回空文本\n- **THEN** 结果不写入缓存\n\n#### Scenario: 容量淘汰\n- **WHEN** 已缓存 1000 条后再写入新结果\n- **THEN** 按 LRU 淘汰最旧条目，容量不超过上限\n\n#### Scenario: 运行时参数变更\n- **WHEN** 管理员把 TTL 或容量改为新值并保存\n- **THEN** 缓存被清空，后续请求使用新参数\n\n#### Scenario: 本地开关变更\n- **WHEN** 管理员开启或关闭本地 OCR 并保存\n- **THEN** 缓存被清空，响应标记 `cache_cleared=true`\n\n### Requirement: R-CAC-03 管理端清空\n管理员 SHALL 能清空缓存并返回清除条数；清空后相同请求 MUST 重新调用厂商。`[m4-local-ocr]`\n\n#### Scenario: 清空后重新识别\n- **WHEN** 管理员清空缓存后重复请求同一图片\n- **THEN** 返回 `cached=false` 且发生厂商调用\n"},{"label":"tasks","path":"openspec/changes/m4-local-ocr/tasks.md","text":"# Tasks\n\n## 1. 依赖与本地引擎\n\n- [ ] 1.1 在 `backend/pyproject.toml` 增加 optional extra `local`（`rapidocr\u003e=3.10,\u003c4`、`onnxruntime\u003e=1.20`），**先把项目版本升到 `0.3.0`**，再按 ADR-0002 用镜像重解析 `uv.lock` 并把源 URL 规范化回 PyPI；验证：`uv lock --check --offline` 退出 0、`uv export --frozen --no-dev --no-emit-project --extra local` 含 rapidocr/onnxruntime、`git diff backend/uv.lock` 只有新增包与源地址行 `[spec-review-amendment R-22]`\n  - R-ID: R-LOC-01\n- [ ] 1.2 新增 `app/workers/local_ocr.py`（模块级引擎缓存 + `run_ocr`/`warmup`，输出归一化为 `text`/`lines[{text,confidence}]`，只收 bytes/语言，不导入 app.state/main；initializer 清除敏感 env）与 `app/core/local_engine.py`（状态机、**`multiprocessing.get_context(\"spawn\").Pool` 可 terminate 池（不用 `ProcessPoolExecutor`）**、generation、幂等 `set_enabled`、warmup 含文字小图 + 超时、wait_for 超时、超时/崩溃重建、兄弟请求取消映射、warmup 失败退避、计数）；验证：单元测试覆盖状态迁移与 fake pool，超时不泄漏进程、兄弟请求不 500、重启恢复；真实引擎测试断言文本/置信度与空结果，标记 `slow`、未安装 extra 时 skip `[spec-review-amendment R-03/R-10/R-11/R-12/R-18/R-26/Q1-B]`\n  - R-ID: R-LOC-02, R-LOC-03, R-LOC-04, R-LOC-05\n- [ ] 1.3 在 `app/config.py` 增加 `local_ocr_enabled=false`、`local_ocr_max_concurrency=1`、`local_ocr_timeout_ms=30000`、`local_ocr_reserve_ms=5000`、`local_ocr_min_budget_ms=1000`，并在 `state.py`/`main.py` 装配与关闭 `LocalEngine`：lifespan 按持久化 `local_ocr_enabled \u0026\u0026 installed` 调用 `set_enabled(true)`，关闭时 shutdown 上限 20s；本地专用 gate 接入公共路径；验证：重启后自动建池测试、启动/关闭 lifespan 无悬挂进程、配置默认值单测 `[spec-review-amendment R-05/R-19/R-29]`\n  - R-ID: R-LOC-02, R-LOC-05\n\n## 2. 公共路由与兜底\n\n- [ ] 2.1 `app/utils/images.py` 增加 local 分支（Pillow 校验 + EXIF 旋转 + 重编码 JPEG；上限作用于重编码后的 JPEG 字节 ≤ `MAX_UPLOAD_BYTES`、最长边 10000，不做 base64 膨胀检查）；验证：单测覆盖 9MB PNG 在 local 下通过、10000px 边界通过、超限仍 400 `[spec-review-amendment R-30]`\n  - R-ID: R-API-03, R-LOC-01\n- [ ] 2.2 `Scheduler` 增加 local 分支与 `auto` 兜底：`reserve_eff = min(reserve, max(0, total − min_budget))`、云阶段截止 = deadline − reserve_eff、仅 `NoCandidate`/`UpstreamFailed`/`DeadlineExceeded` 触发、剩余不足 min_budget 放弃；`ScheduleResult.account_id` 改为可空；MODIFY R-SCH-03 的子 deadline 例外；验证：单测断言 1000/3000/5000/20000ms 边界、传给云适配器的 timeout 被扣减、InputError 不兜底、预算不足返回原错误 `[spec-review-amendment R-01/R-06]`\n  - R-ID: R-SCH-03, R-SCH-05, R-SCH-07\n- [ ] 2.3 `app/api/public.py`：`VALID_PROVIDERS` 增 `local`、**provider 可用性门禁先于缓存读取**、显式 local 未启用的 403、local 失败 502/504 映射、`provider` 返回 local、**成功响应的 `quota.used` 与事件 `quota_used` 由实际 provider 派生（local→0）**、`/v1/providers` 增 local 条目；验证：API 测试覆盖 403/200/502/504、禁用后缓存不绕过、local 响应 quota=0、providers 不含账号字段 `[spec-review-amendment R-02/R-04]`\n  - R-ID: R-API-01, R-API-05, R-API-06, R-CAC-01\n- [ ] 2.4 `local_ocr_enabled` 变化时清空缓存并在设置响应标记 `cache_cleared`；验证：开启/关闭开关后缓存归零，`GET /v1/providers` 的 local enabled 同步 `[spec-review-amendment R-02]`\n  - R-ID: R-CAC-02, R-ADM-08\n\n## 3. 记账与迁移\n\n- [ ] 3.1 新增 Alembic `0003` 迁移：batch 重建 `usage_events` 放宽 `ck_usage_provider` 至含 `local`，**同步修改 `app/models.py` 的 CheckConstraint**，downgrade 先用 `UPDATE ... SET provider='auto' WHERE provider='local'` 再恢复旧约束；迁移前评估行数（\u003e100 万行走维护窗口）；验证：升级/降级往返测试（含一条 local 行）、`Base.metadata.create_all` 建库后插入 local 成功 `[spec-review-amendment R-07/R-35]`\n  - R-ID: R-QTA-01\n- [ ] 3.2 本地成功路径写 `usage_event(provider='local', account_id=NULL, quota_used=0)`，不增加账号计数、Key 请求条数照记；**响应 `quota.used=0` 与事件同源**；验证：单测断言事件字段、账号计数不变、`/v1/me` 当日额度不增长、缓存命中的 local 事件为 0 `[spec-review-amendment R-04/R-15]`\n  - R-ID: R-QTA-01, R-API-05\n- [ ] 3.3 用量聚合与日志查询的厂商标签增加「本地 RapidOCR」，前端 `PROVIDER_LABELS`、**日志与用量两处筛选下拉**同步；**账号域 `ProviderCode` 不扩 local，新增事件/展示用 provider 联合类型；`ProviderRow.code` 改用该展示联合（Q3 后 overview 含 local 行）**；验证：API 测试断言 group_by=provider 返回 local 行与 label、用量页 `provider=local` 过滤生效、前端 typecheck 通过 `[spec-review-amendment R-08/R-14]`\n  - R-ID: R-ADM-06, R-API-06\n- [ ] 3.4 管理端 overview 的厂商行增加 `local`（`accounts=0`、`available_accounts=0`），今日请求总数与厂商行请求数之和对账；验证：含 local 事件的 overview API 测试断言行存在且总数=行和 `[spec-review-amendment R-13/Q3-A]`\n  - R-ID: R-ADM-09\n\n## 4. 管理端\n\n- [ ] 4.1 `runtime_settings.py` 增加 `local_ocr_enabled` 字段与 FIELD_RULES 文案（含 403/502/504 copy 表），`_apply_settings` 在 commit 后调用 `LocalEngine.set_enabled`（**幂等，仅值变化时执行**）并清缓存；验证：设置读写测试覆盖合法/非法/持久化/重复保存不重建池，开启后状态进入 starting `[spec-review-amendment R-10/R-20/R-33]`\n  - R-ID: R-ADM-08, R-LOC-05\n- [ ] 4.2 新增 `GET /api/admin/local-ocr/status`（管理员鉴权、依赖缺失返回 `installed=false/state=unavailable`、`effective_timeout_ms`/`effective_reserve_ms`/`next_retry_in_ms`、`last_error` 脱敏）；验证：API 测试覆盖 200/401/依赖缺失/预热失败三态 `[spec-review-amendment R-09/R-28/R-31]`\n  - R-ID: R-ADM-11\n- [ ] 4.3 设置页新增本地 OCR 卡片（开关 + 状态/模型/最近耗时/最近错误，依赖缺失禁用并说明）：**独立 useQuery + 同高骨架、三态、starting 轮询 ≤1s、只提交 dirty 字段、disabled 字段剔除、窄屏单列**，补 `types.ts`（账号/事件类型拆分）与轮询；验证：`pnpm typecheck` + `pnpm lint`，e2e 断言开关保存后状态从 starting 变 ready、状态接口慢时设置区仍可编辑 `[spec-review-amendment R-33]`\n  - R-ID: R-PANEL-08, R-ADM-11\n\n## 5. 镜像与文档\n\n- [ ] 5.1 Dockerfile 依赖层为 `uv export` 增加 `--extra local`；**版本源全部升 `0.3.0`**（`backend/pyproject.toml`、`backend/app/__init__.py`、`frontend/package.json`、`backend/uv.lock` project version、README 版本锚），compose tag 更新为 `0.3.0`/`latest`（`0.2.1` 不动）；**若基础镜像缺 `libgomp1` 等系统库，构建期安装**；验证：镜像构建成功、容器内 `python -c \"import rapidocr, onnxruntime\"` 通过、`/healthz` 为 ok、`readonly.version == 0.3.0` `[spec-review-amendment R-22/R-36]`\n  - R-ID: R-DEP-11, R-DEP-10\n- [ ] 5.2 README 增加本地 OCR 说明、`LOCAL_OCR_*` 环境变量权威清单、模型 Apache-2.0 归属与镜像体积提示；**写明显式 `provider=local` 不计入日限额，仅受 Key RPM 与全局并发约束（M4 接受的边角）**；`.env.example` 补默认值；**逐处更新** README 的「不做本地 OCR」「provider 只接受 auto/baidu/tencent」「版本锚 0.2.1」「回滚到 0.1.0/0001」、`docs/tech-selection.md` 的按需下载/`/local-ocr/download`/`data/models/rapidocr`/`local_ocr_max_concurrency` 设置键；开发快速上手注明 `uv sync --project backend --extra local` 并补本地 OCR 上手的步骤数/耗时假设/TTHW 估算；验证：文档命令与默认值逐条对照 `.env.example` 与代码，`grep -rn \"0.2.1\\|不做本地 OCR\\|local.*400\\|/local-ocr/download\"` 无残留 `[spec-review-amendment R-22/R-32/R-34/Q4-A]`\n  - R-ID: R-DEP-11, R-LOC-01\n- [ ] 5.3 集成验收：停用全部云账号后 `provider=auto` 由本地返回 200；关闭开关后显式 local 返回 403；按 design 的回滚顺序演练 `alembic downgrade -1`（或 `7c1f0d2a9b31`，`--entrypoint` 覆盖）；**安装 extra 后跑 `pytest -m slow`**；**固定 N 次（≥30）基准脚本计算 p95**；**镜像冒烟脚本**：无外网启动 → 开启开关 → 轮询 status 到 ready；验证：验收记录含请求/响应、p95、状态接口快照与子进程数 `[spec-review-amendment R-16/R-17/R-21]`\n  - R-ID: R-SCH-07, R-API-01, R-ADM-11, R-DEP-11\n\n## 测试覆盖图\n\n| 代码路径 | 测试类型 |\n| --- | --- |\n| `LocalEngine` 状态机 / generation / 超时重建 / 兄弟取消 | 单元（fake pool） |\n| 池回收（超时后子进程数不增长） | 单元 + 集成（真实 spawn） |\n| worker 真实识别 / 模型就绪 / 离线 | `slow` 集成（缺 extra 时 skip）+ 镜像冒烟 |\n| 预算预留 / 兜底触发分支 / 1000–20000ms 边界 | 单元（fake clock/adapter） |\n| `provider` 枚举 / 403 / 502 / 504 / providers 列表 | API（`httpx.ASGITransport`） |\n| 缓存门禁 / 开关清缓存 / 禁用后不绕过 | API |\n| 重启恢复 worker | lifespan 集成 |\n| local 记账与迁移升降级 / `create_all` 插入 | 单元 + 迁移往返 |\n| 设置读写 / 状态接口（unavailable/error/effective） | API |\n| 面板三态 / 轮询 / 部分提交 / 窄屏 | 前端 typecheck/lint + e2e |\n| 镜像内置 extra / 离线就绪 | 镜像冒烟脚本 |\n\n## Workflow follow-up\n\n- 项目评审要求满足后归档本 change 并复核归档结果。\n"},{"label":"decision-memo","path":"openspec/changes/m4-local-ocr/decision-memo.md","text":"---\r\nschema_version: 1\r\nchange: m4-local-ocr\r\nbranch: feat/m4-local-ocr\r\ngenerated_at: 2026-11-04T21:40:31+08:00\r\ndecision_hash: a140abd5fb4c\r\n---\r\n\r\n# 决策纪要 · m4-local-ocr\r\n\r\n## 目标态\r\n\r\n本地 OCR 成为可启用的兜底厂商：`provider=auto` 时云端不可用自动切本地，显式 `provider=local` 可用，管理端可开关并看到 worker 状态。\r\n\r\n## 拍板决策\r\n\r\n- **D1 范围：worker + 开关 + auto 兜底 + 显式 local + 状态；不做模型下载** — 依据：rapidocr 3.10.0 wheel 内置 det/rec/cls 三个 onnx 模型（实测解包），离线可用；**砍掉的候选**：下载/修复端点（几乎不会走的联网路径）、自定义模型目录（本机镜像源未必可达 ModelScope/HF，验收风险最高）、独立 local 镜像（运维矩阵翻倍）。\r\n- **D2 镜像：发布镜像内置 local extra，开关默认关** — 依据：技术选型 §9「镜像内置 onnxruntime」；启用无需重构建。**砍掉的候选**：默认 slim 构建参数（启用要先重构建，易踩坑）、独立 local tag。\r\n- **D3 记账：local 成功 `quota_used=0`、`account_id=NULL`、`provider='local'`** — 依据：本地不消耗厂商额度；用户日限额按 `quota_used` 合计，故不拦本地；RPM 仍由 KeyRateLimiter 生效。**砍掉的候选**：`quota_used=1`（与「配额=厂商额度」语义冲突，面板口径要改多处）、独立本地限额（M4 范围外）。\r\n- **D4 预算：总预算上限保持 20s；auto+本地启用时云阶段为本地预留 5s；本地 timeout=`min(30s, 剩余)`；剩余 \u003c1s 不再试本地** — 依据：实测冷启动约 2.4s、热调用 0.49s，5s 可覆盖冷池；不改 R-ADM-08 的 20001→400 断言。**砍掉的候选**：上限提到 60s（spec 面变大）、本地独立预算（违反 R-SCH-03 整请求 deadline）。\r\n- **D5 兜底触发：仅 `auto` 且本地可用，云端 `NoCandidate`/`UpstreamFailed`/`DeadlineExceeded` 时** — 依据：技术选型 §9「云账号全部不可用时自动兜底」；`InputError` 表示请求本身被拒，不兜底；显式云厂不回退（既有语义）。\r\n- **D6 模型与语言：只用 wheel 内置 PP-OCRv6 small，`zh`/`en`/`auto` 统一走内置模型，不联网下载其他语言** — 依据：内置模型实测中文+数字识别正确（score 0.975）；下载路径在本机镜像环境不可保证。\r\n- **D7 隔离：`ProcessPoolExecutor`（spawn）+ 模块级 worker 函数，默认 1 并发（env 可调），启用时起池并预热，禁用时关闭** — 依据：RapidOCR/ONNX 会在 Python 侧做检测后处理，不能占事件循环；实测 `RapidOCR()` 构造不加载模型、首次调用才加载，故必须预热才能让「就绪」状态有意义。\r\n- **D8 图片规范化：local 分支用原始 JPEG 字节上限（10MB）与最长边 10000，不做 base64 膨胀检查** — 依据：base64 膨胀是厂商传输开销，本地不需要；否则 9MB PNG 会被误判超限。\r\n- **D9 配置面：runtime setting 仅 `local_ocr_enabled`；并发/超时/预留为 env（`LOCAL_OCR_MAX_CONCURRENCY` / `LOCAL_OCR_TIMEOUT_MS` / `LOCAL_OCR_RESERVE_MS`）** — 依据：并发变更要重建进程池，进设置页会引入热重建复杂度；M3 hand-off 只要求补真实开关与状态。\r\n- **D10 可观测：新增 `/api/admin/local-ocr/status`；`/v1/providers` 增 `local` 条目；用量/日志标签增 `local`；管理端 overview 的 provider 列表不加 local** — 依据：local 无账号语义（`accounts`/`available_accounts` 无意义），总览按事件聚合的请求数已包含 local。\r\n- **D11 失败语义：显式 `local` 未启用或依赖缺失 → 403 `FORBIDDEN`；运行失败 → 502 `PROVIDER_ERROR`；超时 → 504 `TIMEOUT`** — 依据：技术选型 §API「必须已启用，否则 403」。\r\n- **D12 DB：新增迁移放宽 `ck_usage_provider` 至 `('baidu','tencent','auto','local')`；downgrade 先把 `provider='local'` 行映射为 `auto` 再恢复旧约束** — 依据：`models.py:137` 的 check 会拒绝 local 事件；`ck_accounts_provider` 不变（local 不建账号）。\r\n- **D13 依赖与锁：`backend/pyproject.toml` 增 optional extra `local`；`uv.lock` 用镜像重解析后把源 URL 规范化回 `pypi.org` / `files.pythonhosted.org`** — 依据：ADR-0001 禁止把区域镜像写进跟踪的锁文件；实测重解析保持全部 53 个既有包版本不变、仅新增 15 包，且路径后缀与 PyPI 逐字一致。**砍掉的候选**：`backend/requirements-local.txt` 旁路（双真相源、`uv sync --extra local` 失效）。\r\n- **D14 测试：默认单测注入 fake engine，不依赖 rapidocr；真实引擎测试标 `slow` 且缺依赖 skip；既有 provider 枚举断言同步更新** — 依据：`uv sync` 默认不装 extra，默认测试必须在无 rapidocr 环境通过。\r\n- **D15 版本：升至 0.3.0，镜像 tag `0.3.0` + `latest`，`0.2.1` 保留为回滚锚点** — 依据：功能里程碑（M3 为 0.2.0，0.2.1 为补丁）。\r\n- **D16 新增 ADR-0002，记录离线环境更新 `uv.lock` 的流程与边界** — 依据：人 2026-11-04 明确拍板；该步骤（镜像解析 + URL 规范化回 PyPI）不看文档无法猜到，且与 ADR-0001「镜像不写入锁文件」互补。\r\n\r\n## 承重约束\r\n\r\n- **C1 引擎可离线运行且模型随包分发** — 验证方式：清华镜像可见 `rapidocr 3.10.0`；解包 wheel 见 `rapidocr/models/PP-OCRv6_det_small.onnx`(9.9MB)、`PP-OCRv6_rec_small.onnx`(21MB)、`ch_ppocr_mobile_v2.0_cls_mobile.onnx`(0.6MB)；临时 venv 实测输出 `('OCR 网关本地兜底测试 12345',)`、score 0.975，日志 `File exists and is valid` 未联网。**证据锚**：`python -m pip index versions rapidocr --index-url \u003c清华镜像\u003e` 输出；wheel 内 `dist-i
