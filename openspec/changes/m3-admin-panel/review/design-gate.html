<script type="application/json" id="sdflow-docs">[{"label":"spec-review-report","path":"openspec/changes/m3-admin-panel/spec-review-report.md","text":"---\nchange: m3-admin-panel\nreviewed_commit: 33a0d61\ndispatch: fresh-subagent(7 镜)\nmemo: ok\n---\n\n# Spec Review Report · m3-admin-panel\n\n\u003e ⚠️ 同模型 fresh-context：隔离的是上下文，不是模型盲点。7 个镜由 fresh-context 子代理完成；\n\u003e 广审双镜与接地镜由主 session 完成。没有跨模型第二意见，也没有真正独立的实现者/审者/验证者。\n\u003e\n\u003e Findings 引用基线：`33a0d61`（评审起点）。amendment 已在其后应用，行号可能漂移；引用原文以\n\u003e 该提交为准。\n\n## 拍板三问\n\n- **Q-scope 范围划界认不认？** 自答：锚 `proposal.md` `## Non-Goals`（7 条）+ `design.md`\n  `## Goals / Non-Goals`。评审**不建议砍范围**；只要求把「回滚、请求预算、缓存内存、数据面查询」\n  等目标态缺口补进本 change，而不是留给实现期。`[ ] 认 [ ] 不认`\n- **Q-deps 依赖/顺序认不认？** 自答：锚 `design.md` `## 切片与依赖`（S1→S6）。S1→S6 语义依赖成立；\n  但 S6 的回滚依赖「不可变 release tag + 部署前 DB 备份」，原稿未接上，已补进 R-01/R-50。\n  `[ ] 认 [ ] 不认`\n- **Q-risk 风险赌注与对策认不认？** 自答：锚 `design.md` `## Risks / Trade-offs` 与失败模式表。\n  原表覆盖 CSRF/CSP/时区/构建源；**缺**回滚 schema、缓存内存、summary 扫描、请求预算、设置并发\n  五类，已在 R-01/R-03/R-06/R-08/R-10 补。`[ ] 认 [ ] 不认`\n\n## 决策登记区\n\n### [需拍板]\n\n\u003e 每条给推荐 + 三镜后果 + 主次判定 + 主审亲验的可行性锚。人工设计门逐项勾。\n\n**Q1 发布与回滚版本策略**（R-01）\n- 背景：设计写「回滚 = `docker compose` 回到 `ocr-gateway:0.1.0`」，但 `docker-compose.yml:10-14`\n  每次 build 都把新镜像重打成 `0.1.0`；同时新镜像把 DB 推进到 `0002`，旧镜像 entrypoint\n  `alembic upgrade head` 会因未知 revision 失败。**仅切镜像两条路都不通。**\n- 选项 A（推荐）：M3 版本升 `0.2.0`，`image`/`build.tags` 改 `0.2.0`，`0.1.0` 保持不变；回滚 =\n  `git checkout` 上一提交（compose 指向 `0.1.0`）+ `scripts/rollback.sh \u003c部署前备份\u003e` 把 DB 恢复\n  到 `0001`。证据：README 已写明这套口径（`README.md:150-158`），只是 design 没接上。\n- 选项 B：保留 `0.1.0` 但每次 build 前手工 `docker tag` 旧镜像为 `0.1.0-rollback`；回滚仍要恢复\n  DB。多一条易忘的手工步骤，不推荐。\n- 选项 C：让旧镜像 entrypoint 容忍未知 revision；危险，会掩盖真正的迁移损坏，不推荐。\n- 三镜：系统镜 A 最稳（不可变 tag + DB 快照原子回退）；用户镜 A 回滚可预期；开发循环镜 A 只改\n  compose/README/任务三处。**主次：系统镜优先。**\n- 可行性锚：`docker/entrypoint.sh:16`、`docker-compose.yml:10-14`、`scripts/rollback.sh`、\n  `README.md:150-158` 均已只读核验。\n\n**Q2 缓存内存上限**（R-03）\n- 背景：`cache_max_entries` 允许到 `10000`，单条结果上限 `256KB`（`cache.py:9`），最坏\n  `10000 × 256KB ≈ 2.5GB`，2C4G 单机可被一个设置打爆。\n- 选项 A（推荐）：把可编辑上限压到 `2000`（最坏约 512MB），并在设计里写死\n  `entries × 256KB` 的内存预算；不加新设置键。\n- 选项 B：新增 `cache_max_bytes`（默认 64MB）按 payload 字节淘汰；更正确，但多一个设置键、UI\n  字段、校验与测试，本 change 扩容。\n- 选项 C：保留 10000，只在文档写「可能占 2.5GB」；不推荐。\n- 三镜：A 系统镜可控、开发循环最小；B 系统镜最好但用户镜多一个概念；C 系统镜最差。\n  **主次：系统镜优先，选 A；后续需要更大缓存再另开 byte budget。**\n- 可行性锚：`cache.py:9-17`、`design.md:81` 已核验。\n\n**Q3 settings 400 字段级错误**（R-05）\n- 背景：`design.md:360` 承诺「消息含字段名」，但全局 `RequestValidationError` handler\n  （`main.py:157-167`）统一返回 `invalid request`；`extra=\"forbid\"`/范围校验都会落成无字段名 400。\n- 选项 A（推荐）：settings handler 内捕获 `ValidationError`/`RequestValidationError`，返回\n  `error.fields: [{field, message}]`；未知键、字符串数字、超范围都含字段名。只影响该端点。\n- 选项 B：放宽设计，依赖前端 zod 做字段级；服务端仍泛化 400。实现小，但服务端错误不可诊断，\n  且与 design 文案冲突。\n- 三镜：A 系统镜可诊断、用户镜字段级提示成立；B 开发循环省事但用户镜差。**主次：用户镜。**\n- 可行性锚：`main.py:157-167` 与 `design.md:360` 已对读。\n\n**Q4 HTTPS 反代下 Secure cookie 闭环**（R-04）\n- 背景：`design.md:58` 用 `request.url.scheme` 或 `TRUST_PROXY_HEADERS` + `X-Forwarded-Proto`\n  判 Secure；但 README 的 nginx 示例（`README.md:129-131`）不转发 `X-Forwarded-Proto`，\n  `TRUST_PROXY_HEADERS` 默认 false（`config.py:81`），文档还写它「仅用于登录限速」。按 README\n  部署，HTTPS 下会话 cookie 实际不带 `Secure`。\n- 选项 A（推荐）：README/nginx 示例补 `proxy_set_header X-Forwarded-Proto $scheme;`，明确反代\n  部署必须 `TRUST_PROXY_HEADERS=true`；镜像冒烟断言反代后的 `Set-Cookie` 含 `Secure`。\n- 选项 B：新增 `COOKIE_SECURE=auto|always` 显式配置；更可控，但多一个配置面与优先级规则。\n- 选项 C：只靠 `request.url.scheme`；在反代终结 TLS 的部署下不可达。\n- 三镜：A 用户镜直接可达且无新概念；B 系统镜更显式但开发循环多一维；C 不成立。\n  **主次：用户镜优先，选 A；若运维要求强制 Secure，再加 B。**\n- 可行性锚：`README.md:128-136`、`config.py:81`、`docker/entrypoint.sh:19` 已核验。\n\n**Q5 `/overview` 是否内嵌 7 日序列**（R-09）\n- 背景：总览页要「近 7 日请求折线」（`design.md:203-204`），但 `/overview` 响应示例只有\n  `today/providers/accounts/recent_errors/cache`（`design.md:366-392`），页面还得再调\n  `/usage/series`；加上 `/me`，首屏至少 3 次请求，与「单请求/一次往返」矛盾。\n- 选项 A（推荐）：`/overview` 响应增加 `series`（近 7 个本地日桶），页面首屏只依赖 `/overview`\n  + `/me`；复用 series 聚合，代价一个字段。\n- 选项 B：接受 3 个并行请求，修正「一次往返」表述与请求瀑布，不扩 overview 契约。\n- 三镜：A 用户镜首屏少一跳、系统镜多一个聚合字段；B 实现更少但用户镜多一次往返。\n  **主次：用户镜优先，选 A。**\n- 可行性锚：`design.md:203-204`、`:366-392`、`:508` 已对读。\n\n**Q6 请求总预算上限 vs 停机宽限**（R-08）\n- 背景：`request_deadline_ms` 允许到 `60000`（`design.md:81`），compose `stop_grace_period: 25s`\n  （`docker-compose.yml:28`）。设到 25s 以上时，SIGTERM 后仍在途的 OCR 请求会被 SIGKILL，用量\n  事件/配额刷盘可能丢失。\n- 选项 A（推荐）：把 `request_deadline_ms` 上限压到 `20000`（与默认一致），并在设计里绑定\n  `stop_grace_period`；慢厂商需求另开 change。\n- 选项 B：`stop_grace_period` 提到 `70s`；保留 60s 预算，但每次部署停机更久。\n- 三镜：A 系统镜最稳、用户镜少 40s 上限；B 用户镜保留长预算、开发循环部署变慢。\n  **主次：系统镜优先，选 A。**\n- 可行性锚：`docker-compose.yml:28`、`design.md:81` 已核验。\n\n**Q7 已删除实体的分组口径**（R-11）\n- 背景：`usage_events.user_id/account_id` 是 `ON DELETE SET NULL`（`models.py:116/122`），删除后\n  group_by=user/account 的 key 变 `null`；多个已删除实体会合并成同一 `null` 行，且 `null` 与 int\n  混合排序会 `TypeError`。原设计只写「label 为 null」，没定义分组键与排序。\n- 选项 A（推荐）：接受合并为一个 `null` 行，排序时 `null` 最后；前端显示「已删除」。不改 schema。\n- 选项 B：新增 `user_id_snapshot/account_id_snapshot` 列保留归属；更准确，但要迁移 + 回填不可能，\n  本 change 扩容。\n- 三镜：A 系统镜最小、用户镜接受「已删除合并」；B 系统镜更准、开发循环多一次迁移。\n  **主次：开发循环镜优先，选 A；若运营需要区分已删除实体，另开 change。**\n- 可行性锚：`models.py:110-142`、`admin.py:512-527`、`design.md:98-101/401` 已核验。\n\n**Q8 `/docs` 的 Authorize 工作流**（R-49）\n- 背景：`require_admin` 是普通依赖，不是 `HTTPBearer`；实测 `app.openapi()` 的\n  `components` 只有 `schemas`，**没有 `securitySchemes`**。README 让用户在 `/docs` 右上角\n  Authorize 填 Bearer，但按钮不存在；proposal 的「/docs 工作流不受影响」不成立。\n- 选项 A（推荐）：`require_admin` 改用 `HTTPBearer(auto_error=False)`，保留 cookie 回退；OpenAPI\n  自动生成 Bearer scheme，`/docs` Authorize 可用。只改依赖声明，不改鉴权语义。\n- 选项 B：只修 README，写明「/docs 不能 Authorize，请用 curl」；不补能力。\n- 三镜：A 用户镜恢复文档承诺、系统镜多一个标准 security scheme；B 用户镜继续残缺。\n  **主次：用户镜优先，选 A。**\n- 可行性锚：已用 `uv run --project backend python` 实测 OpenAPI 无 securitySchemes；\n  `deps.py:51-59` 已核验。\n\n**Q9 首屏 JS 预算口径**（R-19）\n- 背景：`design.md:555` 写「gzip 后 ≤250KB（登录+shell+总览，图表库按路由懒加载）」，但总览\n  首屏就含 Recharts 折线；`tasks.md:46` 只人工量一次，没定义计入哪些 chunk。\n- 选项 A（推荐）：拆成「登录+shell ≤150KB；总览路由 chunk（含 Recharts）≤350KB」，并在 task 4.4\n  记录实际 chunk 清单；不引 CI。\n- 选项 B：保留 250KB，把图表改为首屏后懒加载 + 单独 Suspense；用户镜首屏先见骨架。\n- 三镜：A 指标可测且不伤首屏；B 省预算但用户镜多一次等待。**主次：开发循环镜（可测性）优先，选 A。**\n- 可行性锚：`design.md:448/555`、`tasks.md:46` 已核验；Recharts 体积未实测，故给区间而非精确值。\n\n**Q10 缺失的 spec delta**（R-50）\n- 背景：本次把 `request_deadline_ms` 改成运行时设置、把 cache TTL/容量改成可编辑；但主 spec\n  `openspec/specs/account-pool-scheduling/spec.md:31` 仍写 `REQUEST_DEADLINE_MS` 耗尽，\n  `openspec/specs/result-cache/spec.md:20` 仍写「容量默认 1000、TTL 默认 3600」，没有 MODIFIED delta。\n- 选项 A（推荐）：补两个 MODIFIED delta（deadline 来源、cache 运行时覆盖 + 变更清空），并在设计\n  Compliance 加一张 scope-check 表枚举 7 个 capability。\n- 选项 B：在设计里声明「这两条属于 admin-api 配置面，不改主 spec」，只加 scope-check 表。\n  合同套件仍留旧措辞，下次升级容易再漏。\n- 三镜：A 系统镜契约一致；B 开发循环少两个文件但系统镜留漂移。**主次：系统镜优先，选 A。**\n- 可行性锚：两份主 spec 与 `design.md:77-81` 已对读。\n\n### [自动决策]\n\n| id | 决定 | 理由 |\n|---|---|---|\n| A1 | 请求总预算改为单一来源：`public.py` 外层 deadline 与 `Scheduler` 都读 `RuntimeSettings`（或由 public 计算绝对 deadline 传入 Scheduler） | R-02；只改 Scheduler 会让「调大预算」完全无效，调小也被旧外层截断 |\n| A2 | `usage/summary` 增加 90 天跨度上限，聚合尽量下推 SQL；`logs.total` 与过滤共用索引；NFR 覆盖 summary | R-06；原 NFR 只覆盖 series/logs，summary 可扫全表并 materialize 全部 ORM 行 |\n| A3 | `delete_account` 调 `state.quota.reset_account(account_id)`，并补「删除→两个 flush 周期→新账号 used=0、无 FK 错误」测试 | R-07；当前内存计数残留会让 2s flush 对已删除 id upsert，FK 失败并停掉所有配额落盘 |\n| A4 | settings 写入用进程内 `asyncio.Lock` 串行化 merge+commit+apply；不再声称「不含 await」 | R-10；并发 PUT 的提交/应用顺序可让 DB 与 runtime 分叉 |\n| A5 | 时间窗口统一：`to` 默认本地当日结束/now，`from` 默认对齐本地 00:00 的 7 个日桶；日期形式 `to` 用半开区间 `[from, next_local_day_00:00)`；90 天按本地日历日含当日 ≤90 | R-12；否则默认 7 日会得到 8 个桶，90/91 天边界会误 400 |\n| A6 | 静态兜底改为「非 API 且无扩展名 → index.html；带扩展名的缺失静态文件 → JSON 404」 | R-13；spec 原文「所有非 API 未知路径回退」会把缺失 JS 当 HTML 返回 |\n| A7 | `AccountUpdate.timeout_ms` 显式 null 返回 400；编辑表单留空 = 省略字段（保持原值）；新建留空 = runtime 默认 | R-14；否则 null 会撞 `accounts.timeout_ms NOT NULL` 变 500 |\n| A8 | `PUT /settings` 显式 null 一律 400（部分更新只由 omit 表达） | R-15；避免 null 被当「未提供」或写入非法值 |\n| A9 | `ResultCache.reconfigure(enabled, max_entries, ttl_seconds)` 与构造函数参数顺序对齐（或强制关键字） | R-16；顺序不一致会静默交换 TTL/容量 |\n| A10 | 明确 Scheduler 注入 `RuntimeSettings`（构造引用或 deadline provider），并更新现有单测 | R-17；原设计只写「每次 recognize 读取」，没写怎么拿到引用 |\n| A11 | `settings.key` 统一为 `TEXT`（设计第 73 行与 267 行自相矛盾） | R-18；SQLite 两者亲和性相同，但契约应唯一 |\n| A12 | 安全头中间件必须最外层（在 `BodyLimitMiddleware` 之后 add），并断言超大 body 的 400 响应也带齐头 | R-20；Starlette 最后 add 的中间件最外层，现有 request middleware 在内层 |\n| A13 | `available_accounts` 明确定义为「瞬时可调度数（含并发/QPS 瞬时排除）」，overview 只读快照，不触发状态迁移 | R-21；`candidates()` 会 recover/置 quota_exhausted 并标 dirty，GET 不应有写副作用 |\n| A14 | 升级文档补三条：只配 `UV_DEFAULT_INDEX` 的离线部署需新增 `NPM_REGISTRY`；`DEFAULT_TIMEOUT_MS` 从「账号创建不生效」变为「生效」；`TRUST_PROXY_HEADERS` 新增 Secure 判定用途 | R-22；DX-04 原判 N/A 不成立 |\n| A15 | 错误文案以文案表为唯一真相源；补 `cache_max_entries/request_deadline_ms/default_timeout_ms` 与未知键原文；定义 `FRONTEND_NOT_BUILT` message 并区分源码/镜像两条 fix | R-23；失败模式表与文案表当前给出不同原文 |\n| A16 | TTHW 重新按时长假设求和，并把「打开面板并登录」纳入终点；标注 `uv sync`/`pnpm install` 各自区间与 registry 参数 | R-24；1–3 分钟 + 1–2 秒推不出 4–6 分钟 |\n| A17 | `FRONTEND_DIST` 进 README/.env.example 与命名节；`NPM_REGISTRY` 明说「语义同构、词形不同」 | R-25；配置面不完整，命名对照缺失 |\n| A18 | `apiFetch` 15s 仅作默认；账号测活按 `account.timeout_ms + 5s` 覆盖；204 不解析 JSON | R-26；测活厂商调用可到 60s，15s 会假超时 |\n| A19 | login 请求 `skipAuthRedirect`；`/me` 非 401 失败显示启动错误页 + 重试 | R-27；401 全局跳转会把「密码错误」吃掉 |\n| A20 | GET 重试仅网络/5xx；401/403/400 不重试；明确 15s 总预算 | R-28；无条件重试会重复触发 SessionExpired/CSRF 提示 |\n| A21 | 防双提交用 `isPending` 禁用 + mutation `scope`（v5）或提交 guard；`mutationKey` 不承担串行 | R-29；mutationKey 只是标识 |\n| A22 | CSRF token 单一来源 = `ocr_csrf` cookie；AuthContext 只留 username；403 时 GET `/me` 刷新后单次重试 | R-30；登录会轮换 CSRF cookie，其他标签页的旧 context 值会 403 |\n| A23 | 每个路由一个与最终布局同尺寸的 Suspense fallback；总览图表单独 Suspense；ErrorBoundary 包在 Suspense/lazy 外层 | R-31/R-32；单一骨架无法匹配异构页面，chunk 失败也需被本页边界捕获 |\n| A24 | `/me` 与首屏查询并行（或明确串行并修正瀑布）；`/me` 计入首屏往返与预算 | R-33；原「一次往返」与 `/me` 引导矛盾 |\n| A25 | 所有 naive UTC 字段（含 `ove esign | 无 | `tech-selection` §11；`README.md:128-136` | README/反向代理补头最实 |\n| Q5 | `overview` 只在 design/spec/tasks；无现有 series 复用 | 无 | `design.md:203-204/366-392` | 加 `series` 字段最省往返 |\n| Q6 | `request_deadline_ms` 在 config/public/scheduler/design；`stop_grace_period` 在 compose | 无 | `deployment` R-DEP-08；`docker-compose.yml:28` | 压到 20s 最稳 |\n| Q7 | `SET NULL` 在 models；`usage_summary` 用 `getattr`；无 snapshot 列 | 无 | `quota-accounting` R-QTA-05 只记录 id | 合并 null 行最简 |\n| Q8 | `require_admin` 20 处引用；OpenAPI 无 securitySchemes | 无 | `README.md:42-43` 与实际能力矛盾 | 加 HTTPBearer 最优 |\n| Q9 | `250KB` 仅 design/tasks；无 chunk 清单 | 无 | `tech-selection` §15 只要求类型检查+构建 | 拆预算最可测 |\n| Q10 | `REQUEST_DEADLINE_MS` 在 account-pool-scheduling；TTL/容量在 result-cache | 无 | `design.md:77-81` | 补 MODIFIED delta 最稳 |\n\n## Amendments（已应用）\n\n\u003e 以下改动均带 `[spec-review-amendment]` 标记；引用基线为 `33a0d61`。\n\n### 四件套\n\n- `design.md`\n  - D-A1：Bearer 来源判定、`/me` csrf、Secure 判定/首跳、`/docs` HTTPBearer scheme、登出残留风险。\n  - D-A2：settings 并发锁、`reconfigure` 参数顺序、Scheduler 注入、public 外层 deadline、timeout null、\n    PUT null、字段级 400、cache 上限 2000、deadline 20s、DB 失败模式、settings RPO。\n  - D-A3：label null、summary 90 天/SQL 聚合、null group key、auto provider、时间窗口、精度/错误定义、\n    available_accounts、时间序列化。\n  - D-A4：静态兜底扩展名规则、`FRONTEND_NOT_BUILT` message、安全头最外层、深链接 CSP。\n  - D-A5：Suspense/ErrorBoundary、`/me` 并行、CSRF 单源、15s 覆盖、login skip、GET retry、\n    mutation scope、query invalidation、时间解析、keepPreviousData、returnTo、脏表单、最小宽度、CWV。\n  - D-A7：NPM_REGISTRY/FRONTEND_DIST 文档、VITE 扫密、版本 0.2.0。\n  - 数据模型：`settings.key` 统一 TEXT；cache 上限 2000。\n  - 接口契约：overview `series`、settings 400 `fields`、summary 90 天、auto provider。\n  - 失败模式/可观测性/安全/Compliance/Risks/Migration Plan：补对应行与回滚 runbook。\n- `proposal.md`：修正 `/docs` 工作流表述；补升级/回滚注意。\n- `specs/admin-api/spec.md`：R-ADM-01/06/08/09 补 Bearer 无效不回退、summary 90 天、null 排序、\n  auto、字段级 400、null 拒绝、时间窗口。\n- `specs/admin-panel/spec.md`：R-PANEL-11 扩展名规则；R-PANEL-12 深链接 CSP；R-PANEL-04 超时留空。\n- `specs/deployment/spec.md`：R-DEP-09 回滚场景改为「恢复匹配 schema 的备份」；新增 R-DEP-10\n  不可变发布 tag。\n- `specs/account-pool-scheduling/spec.md`（新增 MODIFIED）：R-SCH-03 deadline 来源。\n- `specs/result-cache/spec.md`（新增 MODIFIED）：R-CAC-02 运行时 TTL/容量 + 变更清空。\n- `tasks.md`：1.1/1.2/2.1/2.3/2.4/3.1/3.2/3.3/3.5/4.1/4.3/4.4/5.1/5.3/5.6/6.1/6.3/6.4/6.6 与\n  测试覆盖图同步；补 slow marker/种子数据/回滚 runbook。\n\n### 未修订（记录）\n\n- `decision-memo.md` 不改：D1–D11 是人的拍板记录，不在评审中改写；C12 的 TEXT 与 design 已统一。\n- `README.md`/`docker-compose.yml`/`Dockerfile` 不在四件套内，改动由 tasks 6.1/6.2 承接；本报告只\n  给要求。\n\n## T/S 残差\n\n无。`openspec validate m3-admin-panel --strict` 通过；四件套规则槽位已逐项核对：\n\n- proposal：`## Why` / `## Success Metrics` / `## Non-Goals` / `## Compliance` 均在；需求优先级、\n  假设、利益相关方、开放问题/外部成本已按触发词加节。\n- design：`## Compliance` 在；数据模型/失败模式+可观测性/NFR/安全/决策记录/组件图/切片均在。\n- specs：每个 Requirement 有稳定 ID 与 `#### Scenario`；新能力 `admin-panel` 有 `## Purpose`；\n  MODIFIED 块完整复制。\n- tasks：每个任务带 `R-ID` 与验证方式；测试覆盖图存在。\n\n## 诚实边界\n\n- 同模型 fresh-context：7 个子代理隔离的是上下文，不是模型盲点；广审双镜与接地镜由主 session\n  亲做，存在自查偏置。没有跨模型第二意见。\n- 子代理 A3 结果被截断（`truncated: yes`），只保留最严重 8 条；已在该镜注明。\n- 接地抽查覆盖全部高严重度条目，但低严重度条目未逐条亲验；报告已标「子代理引文」，不冒充\n  机械核验。\n- 设计 token 对比度、npm 版本、OpenAPI securityScheme 已实测；p95/JS 体积未实测，报告给的是\n  可验证目标而非实测值。\n\n## 结论\n\n建议进入设计 HARD-GATE。**不建议在 Q1/Q2/Q4/Q5/Q6/Q8 拍板前开工**：这六项会改变发布回滚、\n内存边界、反代安全、首屏契约、停机预算与 `/docs` 可用性。其余自动决策已落进四件套，人工可覆盖。\n"},{"label":"proposal","path":"openspec/changes/m3-admin-panel/proposal.md","text":"# Proposal\n\n## Why\n\n`docs/tech-selection.md` 的 M3 要求「管理员可完整管理」，但 M0 的「面板壳」实际从未落地：仓内没有 `frontend/`、没有静态托管，管理员只能靠 `/docs` 与 curl 完成全部运营动作。本 change 补齐可登录的管理面板，并把 MVP 阶段刻意延后的 cookie + CSRF 管理端会话恢复回来，让浏览器操作与 API 安全边界同时成立。\n\n## What Changes\n\n- 新增 `frontend/`：管理 SPA，包含登录、总览、账号、成员与 Key、用量、日志、设置七个路由；技术栈沿用 `docs/tech-selection.md` 的已定稿选型。\n- 管理端鉴权恢复双轨：`POST /api/admin/login` 在返回 Bearer token 的同时设置 HttpOnly 签名会话 cookie 与 JS 可读的 CSRF cookie；`require_admin` 同时接受 Bearer 与 cookie，cookie 路径的写操作强制校验 `X-CSRF-Token`；新增 `POST /api/admin/logout`。\n- 新增运行时设置：`settings` 键值表 + `GET/PUT /api/admin/settings`；可编辑缓存开关/TTL/容量、请求总预算、账号默认超时，保存后即时生效（缓存参数变更会清空缓存）。\n- 补齐面板数据面：新增 `GET /api/admin/overview` 与 `GET /api/admin/usage/series`；扩展 `GET /api/admin/usage/summary`（平均延迟与筛选）、`GET /api/admin/logs`（时间过滤与总数）、`GET /api/admin/accounts`（当前周期已用配额）。\n- 同源静态托管：FastAPI 在存在构建产物时挂载 `/assets` 并对非 API 的 GET 路径回退 `index.html`；增加 CSP、`X-Content-Type-Options`、`Referrer-Policy`、`X-Frame-Options` 安全头。\n- 镜像与部署：`Dockerfile` 增加 Node 构建阶段，`NPM_REGISTRY` 构建参数与 `UV_DEFAULT_INDEX` 同模式；`docker-compose.yml` 传递该参数；README 与 `.env.example` 更新面板入口、前端开发与构建说明。\n- 发布与回滚：M3 镜像版本升 `0.2.0`，保持 `0.1.0` tag 不可变；回滚用 `scripts/rollback.sh` 恢复部署前 DB 备份。`[spec-review-amendment R-01]`\n- 仓库卫生：`.zcode/` 加入 `.gitignore`（人 2026-11-04 拍板）。\n\n无破坏性变更：Bearer 管理鉴权继续可用；curl 工作流不受影响；`/docs` 在本次补 HTTPBearer security scheme 后 Authorize 可用（当前实测无 securitySchemes）。新增的响应字段与端点均为增量。`[spec-review-amendment R-49]`\n\n## Success Metrics\n\n- 面板核心流程 — 基准：0 个可浏览器访问的管理页面 → 目标：登录后可在面板完成「建成员 → 建 Key → 建账号 → 总览/用量/日志查看 → 改设置」全流程 — 度量方式：构建产物 + 浏览器冒烟截图，7 个路由均成功渲染且无控制台错误。\n- 管理端鉴权安全 — 基准：仅 Bearer，无 CSRF 面 → 目标：cookie-only 写请求缺/错 CSRF 100% 返回 403，Bearer 路径回归 100% 通过，登录/登出/过期跳转全部通过 — 度量方式：`pytest` 新增鉴权用例。\n- 前端质量门 — 基准：无前端工程 → 目标：`pnpm lint`、`pnpm typecheck` 与 `pnpm build` 全绿，产物被镜像收录 — 度量方式：本地命令 + `docker compose build` 后 `GET /` 返回面板 HTML、`/assets/*` 返回 200。\n\n## 需求优先级\n\n- **P0（必须有）**：登录/会话/CSRF 双轨、登出；同源静态托管与安全头；账号、成员与 Key 的核心 CRUD；设置读写与即时生效；前端构建进入镜像。\n- **P1（应当有）**：总览指标；用量时间序列与图表；日志时间过滤/分页/总数；账号周期配额显示；用量 CSV 导出。\n- **P2（锦上添花）**：配额刻度标尺与动效细节；窄屏体验优化；查询基准脚本。\n\n## Non-Goals\n\n- **不做匿名接入与「API 鉴权开关」**：本 change 的设置页只展示鉴权强制开启。可证伪假设：所有调用方都必须持有网关 Key；若未来要做公开匿名试用，需另开 change 设计按 IP 限流与滥用防护。\n- **不做本地 OCR 开关与模型下载**：本地 OCR worker 属 M4。可证伪假设：M4 之前没有可查询的 worker/模型状态；现在放开关只能是假开关。\n- **不做成员登录或成员自助面板**：沿用 `docs/tech-selection.md:134` 的 v1 边界，成员只用 `/v1/me` 自查。可证伪假设：成员不需要浏览器会话；若需要，必须先设计只读角色与权限边界。\n- **不做阿里云/华为适配器或对应账号表单**：适配器仍只有百度、腾讯（MVP D1）。可证伪假设：M3 不新增厂商；若适配器先于面板交付，再补表单字段。\n- **不做深色主题、实时推送、PDF OCR、表格版面识别**：可证伪假设：手动刷新与浅色单主题满足当前运营场景；若需要秒级监控，另开 SSE/WebSocket change。\n- **不在日志里展示 OCR 原文**：可证伪假设：排障只需要 request_id、错误码、耗时与账号归属；`debug_store_text` 属后续可选能力。\n- **不引入 Playwright 端到端套件**：可证伪假设：M3 以类型检查、构建、后端 API 测试与浏览器冒烟覆盖关键路径；稳定后再补自动化。\n\n## 假设\n\n- **同源部署**：面板与 API 由同一 FastAPI 提供（单端口或同域反代）。若不成立，`SameSite=Lax` cookie 与 CSRF 双提交需改为跨域方案，登录流程需重做。\n- **现代常青浏览器**：管理员使用支持 ES2020+、CSS 变量、`fetch`、`Intl` 的浏览器。若不成立，面板无法运行，需要降级构建或明确支持矩阵。\n- **单实例/单 worker**：设置热更新只作用于当前进程。若未来多实例，设置需改为共享存储 + 轮询/失效广播，配额内存计数也需重做。\n- **数据规模**：账号/Key/成员 \u003c1000，`usage_events` \u003c10^5。若超出，列表需分页、用量需预聚合，当前查询设计会退化。\n- **管理员人数少**：\u003c20 名管理员，无角色/审计需求。若需要多人协作，需补只读角色与操作审计。\n- **构建期可达 npm 镜像**：默认源不可达时通过 `NPM_REGISTRY` 指定。若两者都不可达，前端无法构建（R-DEP-07 的失败路径）。\n- **React 18 兼容性**：锁定的前端依赖 peer 范围覆盖 React 18。若某依赖升级后放弃 React 18，需回退该依赖或先升级 React 并更新技术选型。\n- **无第三方前端脚本**：不接统计/客服/广告；字体自托管。若未来接入，CSP 与隐私声明需同步调整。\n- **公网走 HTTPS**：反代负责 TLS；HTTP 下 cookie 不带 `Secure`。若公网裸 HTTP，会话与密码传输不安全，部署不合规。\n- **OCR 原文不落库**：日志页只展示元数据。若未来开启 `debug_store_text`，日志接口与页面必须先做脱敏/权限设计。\n\n## 利益相关方与外部依赖\n\n- **管理员**：唯一使用者与验收人（决策权）。\n- **团队成员**：继续通过既有网关 Key 调用公共 API，不受面板影响（知情）。\n- **运维**：镜像构建新增 Node 阶段，构建时间与 npm 源可达性需知情（知情，需配合 `.env` 的 `NPM_REGISTRY`）。\n- **外部依赖**：构建期 npm registry 与 Docker registry；运行期无新增第三方服务，字体自托管。\n\n## 开放问题与外部成本\n\n- **开放问题**：无。影响 specs/方案/切片划分的未知项已在相位 B 解决；实现中若浏览器冒烟发现 CSP 或样式冲突，按 design 的 Risks 表在实现内调整。\n- **外部计费服务**：无新增。OCR 厂商调用沿用既有链路；前端字体自托管，不引入 CDN/统计。\n\n## Compliance\n\n- 遵守 `docs/tech-selection.md` §11（会话/CSRF/面板安全头/日志不含原文）、§12（页面清单与交互）、§15（前端先保证类型检查与构建）。\n- 遵守 `openspec/specs/admin-api/spec.md` 的既有契约；本次以 MODIFIED delta 更新 R-ADM-01 与 R-ADM-06，并新增设置/总览/账号配额需求。\n- 遵守 `openspec/specs/deployment/spec.md` R-DEP-07：构建索引可参数化；npm 与 PyPI 使用同一模式，构建不依赖默认源可达。\n- 遵守单实例/单 worker 约束（`docs/tech-selection.md` 风险表），设置热更新只在当前进程生效。\n- 遵守 `AGENTS.md`：任何被跟踪文件提及本机私有凭证文档时，只用「仓库外的本地私有凭证文档」代称。\n- 不把真实凭证、Key 明文或 OCR 原文写入仓库、日志、前端存储或镜像。\n\n## Capabilities\n\n### New Capabilities\n\n- `admin-panel`: 管理面板的浏览器行为与交付边界——登录/会话、七个路由、设计系统、同源静态托管、前端构建与镜像收录。\n\n### Modified Capabilities\n\n- `admin-api`: 管理端鉴权改为 cookie + CSRF 双轨并保留 Bearer；新增设置读写、总览、用量序列；扩展日志与账号响应的查询能力。\n- `deployment`: 镜像新增前端构建阶段与 `NPM_REGISTRY` 构建参数；运行镜像包含并托管面板静态资源。\n\n## Impact\n\n- **后端**：`backend/app/main.py`（静态托管、安全头）、`backend/app/api/deps.py`（双轨鉴权/CSRF）、`backend/app/api/admin.py`（登录/登出/设置/总览/序列/日志/账号配额）、`backend/app/models.py` + `backend/app/alembic/versions/0002_*`（settings 表）、`backend/app/config.py`（构建期/运行期配置）、`backend/tests/`（鉴权、设置、序列、静态托管用例）。\n- **前端**：新增 `frontend/`（Vite 工程、路由、页面、组件、设计 token、API 客户端、类型检查与构建脚本）。\n- **构建与部署**：`Dockerfile`、`docker-compose.yml`、`.env.example`、`README.md`。\n- **API**：`POST /api/admin/logout`、`GET/PUT /api/admin/settings`、`GET /api/admin/overview`、`GET /api/admin/usage/series` 为新增；`GET /api/admin/usage/summary`、`GET /api/admin/logs`、`GET /api/admin/accounts`、`POST /api/admin/login` 为增量字段/参数。\n- **依赖**：前端新增 React/Vite/Tailwind/shadcn/React Query/Recharts 等 npm 依赖；后端无新增 Python 运行时依赖。\n"},{"label":"design","path":"openspec/changes/m3-admin-panel/design.md","text":"# Design\n\n## Context\n\n现状（均已用代码/命令核验，锚见括号）：\n\n- 管理 API 只有 Bearer token：登录换签名 token，`require_admin` 从 `Authorization` 取 token（`backend/app/api/deps.py:41-59`）；20 个管理路由中 19 个非登录路由全部经该依赖（`backend/app/api/admin.py`）。`[spec-review-amendment R-49]`\n- 没有前端工程、没有静态托管：`frontend/` 不存在；`backend/app/main.py:195-200` 只挂公共/管理路由；`Dockerfile` 没有 Node 阶段。`.gitignore:18-20` 已预留 `node_modules/` 与 `frontend/dist/`。\n- 没有 settings 表：`backend/app/models.py` 无该模型，`backend/alembic/versions/` 只有 `0001_initial.py`；缓存 TTL/容量与请求 deadline 在启动时固化（`backend/app/core/cache.py:13-17`、`backend/app/core/scheduler.py:56-73`、`backend/app/main.py:84-95`）。\n- 数据面缺口：`_account_out` 无已用配额（`backend/app/api/admin.py:93-117`）；`usage_summary` 只有整段聚合行、无时间序列（`:495-535`）；`list_logs` 无时间过滤与总数（`:536-575`）。\n- 安全面缺口：响应头只有 `X-Request-ID`（`backend/app/main.py:119`）；`docs/tech-selection.md:489` 要求面板 CSP、`X-Content-Type-Options`、`Referrer-Policy`。\n- 构建环境：npm 官方源不可达、`registry.npmmirror.com` 可达；`node:22-bookworm-slim` 已成功拉取（digest `sha256:4b150b48…`）。Docker 配置了 registry mirror。\n- 技术栈与视觉方向：`docs/tech-selection.md:15`、`:111` 定 React + Vite + Tailwind + shadcn/ui + Recharts；人 2026-11-04 拍板浅色单主题、深墨蓝、极简高级。\n\n动机与范围见 `proposal.md`；决策全文与砍掉的候选见 `decision-memo.md`。\n\n## 利益相关方与外部依赖\n\n- **使用者 / 验收人**：管理员（决策与验收，权力级别：决策）；团队成员只通过已有网关 Key 调用公共 API，不直接使用面板。\n- **无跨团队 sign-off**：本 change 不改变公共 API 契约、不改厂商适配器、不改配额语义；不需要外部团队配合。\n- **构建期外部依赖**：npm registry（本机经 npmmirror，镜像构建经 `NPM_REGISTRY`）与 Docker registry（Node/Python 基础镜像）。运维需知晓镜像构建时间会增加一个前端阶段。\n- **运行期外部依赖**：无新增第三方服务；字体自托管，前端不接统计/CDN；OCR 厂商调用沿用现状。\n\n## Goals / Non-Goals\n\n**Goals:**\n\n- 管理员在浏览器完成登录、会话续用、登出；写操作受 CSRF 保护，Bearer 路径不受影响。\n- 七个路由可用：登录、总览、账号、成员与 Key、用量、日志、设置。\n- 设置项持久化、可校验、保存后即时生效；缓存参数变更的行为可解释。\n- 数据端点支持总览指标、日序列、日志时间过滤/总数、账号周期用量。\n- 构建产物由 FastAPI 同源托管并进入镜像；安全响应头齐备。\n- 视觉按已拍板 token 与结构落地，关键页有加载/空/错误三态。\n\n**Non-Goals（设计层）:**\n\n- 不做 SSR / RSC / 同构渲染；SPA 静态托管。\n- 不做全局状态库；远端数据只用 React Query，UI 状态留在 URL 或组件内。\n- 不做服务端 CSV、服务端图表渲染。\n- 不做多语言框架；v1 文案中文，日期/数字用 `Intl`。\n- 不做深色主题、WebSocket/SSE、离线缓存、账号/成员列表分页（数据量假设见下）。\n- 不做管理端多角色/成员登录；只有单一 admin。\n- 不做 aliyun/huawei 账号表单（适配器未交付）。\n\n## Decisions\n\n### D-A1 管理端鉴权：cookie + CSRF 双轨，Bearer 保留\n\n**方案**\n\n- 登录响应同时返回 `token`、`expires_in`、`csrf_token`，并设置两个 cookie：\n  - `ocr_admin_session`：值为现有 `create_admin_token` 签名 token；`Path=/; HttpOnly; SameSite=Lax; Max-Age=\u003csession_ttl_seconds\u003e`；HTTPS 时加 `Secure`。\n  - `ocr_csrf`：32 字节 `secrets.token_urlsafe`；`Path=/; SameSite=Lax; Max-Age=\u003csession_ttl_seconds\u003e`；**不**加 `HttpOnly`（前端要读）。\n- `require_admin` 先看 `Authorization: Bearer`；没有再看 `ocr_admin_session` cookie。Bearer 存在但无效时直接 401，不回退 cookie（避免陈旧 Authorization 头把浏览器会话带进不确定状态）；两者都无/无效 → 401。\n- 认证来源为 cookie 且方法属于 `POST/PUT/PATCH/DELETE` 时，校验 `X-CSRF-Token` 与 `ocr_csrf` cookie 常量时间相等；缺失或不符 → 403 `FORBIDDEN`。Bearer 来源豁免 CSRF。\n- `GET /api/admin/me` 返回 `{\"username\":\"admin\",\"csrf_token\":\"…\"}`；若 cookie 会话存在但 `ocr_csrf` 缺失，则补发 CSRF cookie（GET 只补 cookie，不改变业务状态）。Bearer 调用不依赖 CSRF，`csrf_token` 可省略；前端以 `ocr_csrf` cookie 为唯一来源。`[spec-review-amendment R-30]`\n- `POST /api/admin/logout`：经 `require_admin`；清空两个 cookie（`Max-Age=0`），返回 204。无服务端会话表，Bearer token 仍按原语义到期失效；已泄露的签名 token 在 12h TTL 内仍有效，这是 v1 接受的残留风险（HttpOnly + SameSite=Lax；服务端即时吊销另开 change）。`[spec-review-amendment R-53]`\n- `Secure` 判定：`request.url.scheme == \"https\"`，或 `TRUST_PROXY_HEADERS=true` 且 `X-Forwarded-Proto` 首值（逗号分隔的第一个）为 `https`。反向代理部署 MUST 同时转发 `X-Forwarded-Proto` 并设置 `TRUST_PROXY_HEADERS=true`；README 的 nginx 示例与镜像冒烟按此验收。`[spec-review-amendment R-04]`\n- CSRF 失败与未登录都走现有错误 envelope：`{\"request_id\": \"...\", \"error\": {\"code\": \"...\", \"message\": \"...\"}}`。\n- `require_admin` 用 `HTTPBearer(auto_error=False)` 声明 Bearer security scheme，使 `/docs` 的 Authorize 可用；cookie 回退保留。Swagger 写操作用 Bearer；cookie 会话写操作仍需 `X-CSRF-Token`。`[spec-review-amendment R-49]`\n\n**为什么不是别的**\n\n- Bearer + localStorage：12h token 可被任意 XSS 读取；且偏离 `docs/tech-selection.md:482-483`。\n- 服务端 CSRF 存储（session 表）：双提交不需要服务端状态；单实例下增加清理负担，无收益。\n- 只做 cookie 不做 Bearer：会破坏 `/docs` 与 curl 工作流；MVP D4 明确要「双轨」。\n\n**代价**：引入 CSRF 失败面；cookie 在 HTTP 本地下不带 `Secure`（README 说明公网必须 HTTPS）。\n\n### D-A2 运行时设置：新表 + 进程内 RuntimeSettings\n\n**方案**\n\n- 新表 `settings(key TEXT PK, value TEXT NOT NULL, updated_at DATETIME NOT NULL)`；`value` 存 JSON 编码（bool/int），读取时校验类型与范围。\n- 启动顺序：迁移完成后加载表 → 与 env 默认值合并 → 构造 `RuntimeSettings` → 用其构造 `ResultCache`/`Scheduler`；非法存量值忽略并记 warning，不阻塞启动。\n- `RuntimeSettings` 是普通 dataclass，字段与 env 同名；单事件循环内整体替换字段，字段替换段无 `await`。DB `commit()` 是唯一 `await`；merge+commit+apply 用进程内 `asyncio.Lock` 串行化，提交返回后再整体应用运行时，避免两个并发 PUT 的提交顺序与应用顺序分叉。不引入线程/进程共享状态。`[spec-review-amendment R-10]`\n- 缓存重建（`reconfigure`）在写请求的同步段内完成；已在重建前取到旧条目的在途请求仍返回旧结果，下一次读取使用新缓存，属于可接受的一次性过渡。`[spec-review-amendment R-16]`\n- `Scheduler` 改为 `recognize(..., deadline: float)`：由 `public.py` 在请求开始时从 `RuntimeSettings.request_deadline_ms` 计算一次绝对 deadline 并传入；`Scheduler` 不再在构造时固化，也不再自行起算。这样调大/调小都作用于真实总预算（含信号量等待）。`[spec-review-amendment R-02/R-17]`\n- `ResultCache` 增加 `reconfigure(enabled, max_entries, ttl_seconds) -\u003e bool`（与构造函数参数顺序一致，或强制关键字）：参数不变返回 False；变化则重建 `TTLCache`（清空旧条目）并返回 True。`[spec-review-amendment R-16]`\n- `AccountCreate.timeout_ms` 默认从 `8000` 改为 `None`；`create_account` 用 `payload.timeout_ms or runtime.default_timeout_ms`。PATCH 语义：显式 `null` 返回 400（`accounts.timeout_ms` 是 NOT NULL）；编辑表单留空表示省略该字段（保持原值），新建表单留空表示使用运行时默认。`[spec-review-amendment R-14]`\n- `PUT /api/admin/settings` 接受部分字段；先全量校验，再单事务 upsert；提交成功后才应用运行时；返回 `cache_cleared` 标志。任何校验失败 → 400，DB 与运行时都不变。请求模型 `extra=\"forbid\"`，未知键也返回 400（防拼写错误被静默忽略）；显式 `null` 一律 400，部分更新只由省略字段表达。`[spec-review-amendment R-15]`\n- settings 端点的校验错误 MUST 返回字段级信息：`{\"request_id\":\"…\",\"error\":{\"code\":\"BAD_REQUEST\",\"message\":\"invalid settings\",\"fields\":[{\"field\":\"cache_ttl_seconds\",\"message\":\"must be between 60 and 86400\"}]}}`。未知键、字符串数字、超范围都必须带字段名；不依赖全局 `RequestValidationError` 的泛化 `invalid request`。`[spec-review-amendment R-05]`\n- SQLite 写路径显式设置 `busy_timeout=5s`；settings 写失败/锁等待/磁盘满返回 500，事务回滚、运行时不应用，并记结构化日志。`[spec-review-amendment R-44]`\n- 可编辑项：`cache_enabled`（bool）、`cache_ttl_seconds`（60–86400）、`cache_max_entries`（10–2000，按单条 256KB 估算最坏约 512MB）、`request_deadline_ms`（1000–20000，须小于 compose `stop_grace_period` 25s）、`default_timeout_ms`（1000–60000）。`[spec-review-amendment R-03/R-08]`\n- 只读项（GET 返回）：`api_auth_enabled`（恒 true）、`version`、`max_upload_bytes`、`max_image_pixels`、`max_concurrent_requests`、`session_ttl_seconds`、`frontend_built`（启动快照；构建产物后需重启才变 true）。`[spec-review-amendment R-56]`\n\n**为什么不是别的**\n\n- 只用 env：设置页无法即时生效，M3 的「设置面板」退化。\n- 每次请求查 DB：热路径多一次 IO；单实例下进程内对象足够。\n- 缓存 TTL 只对新条目生效：`cachetools.TTLCache` 的 ttl 是 cache 级，无法按条目设置；自研 TTL 结构成本高。\n\n**代价**：保存缓存参数会清空缓存（人已知晓并接受）；多实例下设置不跨进程同步（v1 单实例约束）。\n\n### D-A3 数据面：新增总览/序列，扩展查询\n\n**方案**\n\n- `GET /api/admin/overview` 一次返回今日指标、厂商可用账号、账号配额用量、最近 10 条错误、缓存状态；今日窗口固定 `Asia/Shanghai` 00:00 到当前。\n- `GET /api/admin/usage/series` 返回按本地日分桶的序列；缺日补零；默认 7 天，最大 90 天；支持 `user_id/provider/account_id` 过滤。\n- `GET /api/admin/usage/summary` 增加 `avg_latency_ms` 与同样的过滤参数；行按 key 升序、`null` 最后；每行增加 `label`（成员名/账号名/厂商名），已删除实体一律为 `null`（前端显示「已删除」）；`provider='auto'` 的 label 为「自动路由」。`[spec-review-amendment R-52]`\n- `GET /api/admin/logs` 增加 `from/to/error_code` 过滤与 `total`；保持 `limit/offset` 分页与 id 倒序；每行增加 `user_name`、`account_name`（可为 `null`）。\n- `GET /api/admin/accounts` 增加 `quota_usage` 与 `owner_name`：配额从 `AccountRegistry` 取 runtime、从 `QuotaManager.used()` 取日/月/总量，period_key 用现有 `period_key()` 规则；`owner_name` 来自成员表。\n- 名称补充用一次成员/账号映射查询（小规模），不在每行做 N+1；已删除成员/账号的名称返回 `null`，前端显示「已删除」。\n- summary/series/logs 共用时间窗口与 90 天上限；summary MUST 也拒绝超过 90 天的范围（400），并把聚合尽量下推 SQL `GROUP BY`；`logs.total` 与过滤共用 `created_at` 索引。`[spec-review-amendment R-06]`\n- `group_by=user/account` 的已删除实体合并为 `key=null` 的单行（历史归属已被 `SET NULL` 丢失，不在本 change 补快照列）；排序时 `null` 最后。`[spec-review-amendment R-11]`\n- `provider='auto'`：成功事件记录实际厂商（baidu/tencent）；无候选/解析前的失败事件可能记为 `auto`。summary/overview 必须能为 `auto` 提供显示名「自动路由」；`overview.providers` 只列两家厂商，`today.auto_failures` 单独计数，避免今日总数与厂商行对不上。`[spec-review-amendment R-52]`\n- 默认窗口按 `Asia/Shanghai` 本地日对齐：`to` 默认取当前时刻，`from` 默认取本地日 00:00 往前 6 天（共 7 个日桶）；日期形式的 `to` 表示该本地日的结束，用半开区间 `[from, next_local_day_00:00)`，日期形式 `from` 表示当日 00:00；90 天按本地日历日差含当日 ≤90。summary/logs/series 共用。`[spec-review-amendment R-12]`\n- `avg_latency_ms` 为四舍五入到整数的均值；`success_rate`/`cache_hit_rate` 保留 4 位小数；`recent_errors` 定义为 `success=false` 按 `created_at desc` 取前 10。`[spec-review-amendment R-52]`\n- `available_accounts` 是「瞬时可调度数」（含并发已满/令牌桶暂时为空等瞬时排除）；overview 只读快照，不触发 `_recover`/状态迁移/dirty 标记；若需要配置口径，另给字段。`[spec-review-amendment R-21]`\n- 时间序列化：summary 的 `from/to` 保持 UTC naive（兼容既有响应），series/overview 的 `from/to/generated_at` 带 `+08:00`；前端按字段分别解析。`[spec-review-amendment R-52]`\n- `overview.recent_errors` 增加 `account_name`（可为 `null`），避免总览要求前端再拉账号列表。\n\n**为什么不是别的**\n\n- 前端多次拉全量日志自行聚合：分页语义错误、数据量不可控。\n- 新增独立统计表：当前规模（\u003c10^5 事件）无需预聚合；沿用 `usage_events.created_at` 索引即可。\n\n**代价**：每次打开总览/用量页做一次范围扫描；事件量继续增长时需要预聚合（后续 change）。\n\n### D-A4 同源静态托管与安全头\n\n**方案**\n\n- 配置 `FRONTEND_DIST`（默认 `\u003crepo\u003e/frontend/dist`，Docker 内 `/app/static`）。启动时若 `index.html` 存在：\n  - `GET /assets/*` 由 `StaticFiles` 托管，`Cache-Control: public, max-age=31536000, immutable`（Vite 文件名带 hash）。\n  - 根级静态文件（`favicon.svg` 等）存在则直接返回；`index.html` 用 `Cache-Control: no-store`。\n  - 兜底 GET：路径以 `api/`、`v1/`、`healthz` 开头 → JSON 404；非 API 且无扩展名的未知路径 → `index.html`；非 API 但带扩展名且文件不存在 → JSON 404（不得把缺失静态资源回退成 HTML）。兜底路由注册在所有 API 路由之后。`[spec-review-amendment R-13]`\n- 产物不存在时：`GET /` 返回 404 JSON（`FRONTEND_NOT_BUILT`），message 固定为 `panel assets are not built; run pnpm build or use an image with the panel`；API 不受影响；启动日志 warning。`[spec-review-amendment R-23]`\n- 安全头中间件：\n  - 所有响应追加 `X-Content-Type-Options: nosniff`、`Referrer-Policy: no-referrer`、`X-Frame-Options: DENY`、`Permissions-Policy: camera=(), microphone=(), geolocation=()`。安全头中间件 MUST 在最外层（在 `BodyLimitMiddleware` 之后 add），确保 body-too-large/异常响应也带齐；测试断言超限请求的 400 响应头。`[spec-review-amendment R-20]`\n  - **CSP 作用于所有返回 `index.html` 的响应（含 SPA 深链接回退）与静态资源**〔spec-review-amendment R-36〕：`Content-Security-Policy: default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'`。\n  - `/docs` 与 `/openapi.json` 不加 CSP：FastAPI 自带 Swagger UI 默认从公共 CDN 加载 JS/CSS，`default-src 'self'` 会直接打不开现有 `/docs` 工作流（README 仍以它作为 Bearer 操作入口）。API 响应保持无 CSP，但仍有类型/Referrer/frame 头。\n  - 管理 API 响应追加 `Cache-Control: no-store`，避免 `/me` 的 `csrf_token` 或账号数据被中间缓存。\n- `style-src` 允许 `'unsafe-inline'`：Recharts/React 会写元素 `style` 属性；不放宽 `script-src`，构建产物不含内联脚本。不引入第三方脚本，故不需要 nonce 渐进路径。\n- 路径穿越防护：兜底只从 `FRONTEND_DIST` 解析并校验 `resolve()` 后仍位于该目录；不做任意文件服务。\n\n**为什么不是别的**\n\n- 独立前端容器/域名：多一套反代与 CORS，cookie/CSRF 与「面板和 API 同域」（`docs/tech-selection.md:591`）冲突。\n- 哈希/nonce CSP：当前无内联脚本，`'self'` 已足够；哈希清单会随构建变化，维护成本高。\n\n### D-A5 前端架构\n\n- 工程：`frontend/`，Vite + React 18 + TypeScript strict + ESLint（`react-hooks`、`jsx-a11y`）；`base: \"/\"`；dev server 代理 `/api`、`/healthz`、`/v1` 到 `http://127.0.0.1:8000`。\n- 质量门：`pnpm lint`、`pnpm typecheck`、`pnpm build` 三条；不引入 Prettier（格式化非本 change 的交付门）。\n- 构建关闭 `build.modulePreload.polyfill`（目标常青浏览器），避免 Vite 向 `index.html` 注入内联脚本；构建后 grep 确认所有 `\u003cscript\u003e` 都带 `src`，与 CSP `script-src 'self'` 一致。\n- 设置 `build.assetsInlineLimit: 0`：避免字体被内联成 data URI 后触发 `font-src 'self'` 拦截；图标使用 lucide 组件而非图片资产。\n- 路由（react-router-dom）：`/login`、`/`（总览）、`/accounts`、`/members`、`/usage`、`/logs`、`/settings`、`*`（404）。页面级 `React.lazy`；每个路由提供与最终布局同尺寸的 Suspense fallback（总览图表单独 Suspense，骨架高度=图表高度）；`ErrorBoundary` 包在 `Suspense`/`lazy` 外层，chunk 失败由本页边界捕获。`[spec-review-amendment R-31/R-32]`\n- 鉴权引导：应用挂载时 `GET /api/admin/me`；401 → 清缓存并跳 `/login`；非 401 失败显示可重试的启动错误页。`/me` 与首屏数据查询并行（统一 401 处理），或明确串行并把 `/me` 计入首屏往返。成功后 `AuthContext` 只持有 `username`；`csrf_token` 单一来源是 `ocr_csrf` cookie，不复制进 context。不把 token 写入 localStorage/sessionStorage。登出时清空 React Query 缓存、重置本地会话状态并跳登录，避免下一位管理员看到上一位的缓存数据；跨标签 401/403 也走同一清理路径。`[spec-review-amendment R-30/R-33]`\n- 数据层：`apiFetch\u003cT\u003e()` 统一处理 `credentials: \"same-origin\"`、写方法从 cookie 读 `ocr_csrf` 并加 `X-CSRF-Token`、15s `AbortController` 默认超时（账号测活按 `account.timeout_ms + 5s` 覆盖，204 不解析 JSON）、错误 envelope 归一化；401 抛 `SessionExpiredError` 并由顶层统一跳登录，login 请求设 `skipAuthRedirect` 以便就地显示密码错误；403 CSRF 时 GET `/me` 刷新 cookie 后单次重试。`[spec-review-amendment R-26/R-27/R-30]`\n- 时间显示：所有 UTC naive ISO 字符串（现有 `created_at`/`last_used_at`，以及新增 `overview.recent_errors.created_at`、`logs.created_at`、`summary.from/to`）统一用 `parseServerTime()` 显式按 UTC 解析再格式化到 `Asia/Shanghai`，不能直接 `new Date(naive)`（浏览器会当本地时间，差 8 小时）；`overview.generated_at` 与序列的 `from/to` 带偏移，按 ISO 正常解析；序列的 `date` 是本地日期字符串，直接展示。`[spec-review-amendment R-34]`\n- React Query：GET `staleTime` 30s、窗口聚焦刷新；写操作成功后精确失效相关 query（账号 CRUD/reset → accounts+overview；cache clear/缓存设置 → overview+settings；成员/Key → members+accounts+overview）；用量/日志筛选变化用 `placeholderData: keepPreviousData` 保留上一结果。写操作不做乐观更新，用 pending 按钮态 + 成功 toast；GET 仅对网络/5xx 重试 1 次，401/403/400 不重试，写不自动重试。`[spec-review-amendment R-28/R-35/R-41]`\n- 表单：react-hook-form + zod；格式类校验 blur 后显示，跨字段/提交时汇总；错误文案贴近字段；账号凭证编辑不回填掩码值；密码字段 `autocomplete=\"current-password\"`。\n- 表单默认值：账号 `priority=100`、`weight=1`、`max_concurrency=2`、`qps_limit=5`、`reset_day=1`；新建账号超时留空用运行时默认，编辑账号超时留空表示省略该字段（保持原值，不提交 null），配额留空表示不限；Key 表单预填日限额 100、RPM 30，提供「不限」开关（提交 `null`）；编辑账号时凭证字段留空表示不修改。`[spec-review-amendment R-14]`\n- Key 的「禁用」走 `PATCH enabled=false`，「吊销」走 `DELETE`；两者都使该 Key 立即失效（R-ADM-03）。成员/账号的「禁用」与「删除」同理区分，删除前必须确认。\n- 状态：远端数据不复制进 `useState`；筛选/分页/指标切换进 URL（`useSearchParams`）；筛选变化时 offset 归零；登录页保存同源相对 `returnTo`，成功后回跳；声明滚动恢复策略。对话框开关、侧栏折叠等局部状态留在组件。`[spec-review-amendment R-37]`\n- CSV 导出使用 UTF-8 BOM + CRLF，Excel 打开中文不乱码；按 RFC 4180 转义逗号/引号/换行；对以 `= + - @` 开头的单元格加前缀 `'`，防公式注入；导出内容为当前筛选后的汇总表。\n- 错误边界：每个路由一个 ErrorBoundary（白屏半径=单页），根级兜底页；无第三方脚本。\n- 可访问性：所有表单有 `\u003clabel\u003e`；对话框焦点陷阱与 Esc；焦点环 2px；图标按钮有 `aria-label`；表格数字右对齐但保留表头语义。\n\n### D-A6 设计系统（人 2026-11-04 拍板）\n\n**原则**\n\n1. 仪器面板，不是卡片墙：数字与状态是主角，不用卡片网格切割信息。\n2. 细线结构与留白编码层级：发丝线、间距、对齐优先于边框、阴影、色块。\n3. 蓝色只给操作、焦点与图表强调；数据本身用 ink/navy，避免全屏蓝。\n4. 字体承担个性：单一 Plex Sans + 中文回退，靠字号、字重、tabular numerals 建立层次。\n5. 密度与空气并存：行高紧凑，区块间距大方；删掉不影响信息传达的装饰。\n\n**色彩（CSS 变量 / Tailwind v4 `@theme`）**\n\n| Token | 值 | 用途 |\n|---|---|---|\n| `--paper` | `#F7F9FB` | 页面底 |\n| `--surface` | `#FFFFFF` | 表格/对话框表面 |\n| `--ink` | `#0D1B2A` | 正文、主数字 |\n| `--muted` | `#5B6B7B` | 说明、次要元数据 |\n| `--line` | `#DCE4EC` | 发丝线/表头分隔 |\n| `--mist` | `#EAF1F7` | 选中、hover |\n| `--navy` | `#14385C` | 主操作、选中条、标题 |\n| `--blue` | `#2E6FA7` | 焦点、链接、图表强调 |\n| `--success` | `#1F6F55` | 成功状态点/文本 |\n| `--warn` | `#8A6118` | 冷却/警告 |\n| `--danger` | `#A33B3B` | 失败/危险操作 |\n\n- 不使用渐变；不使用投影（对话框用 1px line + `rgba(13,27,42,.32)` 遮罩）；圆角 4px（控件）/6px（对话框）。\n- 蓝色只用于主操作、焦点与图表强调；数据本身用 ink/navy。\n- shadcn 语义变量映射：`--background=paper`、`--foreground=ink`、`--primary=navy`、`--primary-foreground=surface`、`--border=line`、`--ring=blue`、`--muted-foreground=muted`、`--accent=mist`；不在组件里写裸色值。\n- 对比度：正文 `ink/paper` ≥ 12:1，`muted/paper` ≥ 4.5:1；状态色不单独承载语义，必须配文字（圆点 + 状态名）。\n\n**字体与排版**\n\n- Latin/数字：`@fontsource-variable/ibm-plex-sans`，自托管（`font-src 'self'`）。\n- 中文回退：`\"PingFang SC\", \"Microsoft YaHei\", \"Noto Sans CJK SC\", sans-serif`。\n- 字号：28/20/15/13/12；行高 1.5（正文）、1.25（标题）；标题字重 500。\n- 表格数字 `font-variant-numeric: tabular-nums`；`request_id`、Key 前缀用 `ui-monospace`，仅此一处。\n- 行长 ≤ 80 字符；不使用全大写小标签、不用「单词变色」式标题强调。\n\n**布局**\n\n- 桌面：左栏 232px（发丝右线）+ 内容区；内容最大宽 1280px，左右 32px；顶栏 56px。\n- 断点：`\u003c768` 侧栏收为顶部抽屉；表格横向滚动并保留首列；`1440+` 内容不继续拉宽。\n- 表头 12px muted，行高 44px，无斑马纹；状态用 6px 圆点 + 文本；配额用**刻度标尺**（25/50/75 刻度 + 当前位置标记），作为唯一记忆点。\n- 空态：一句说明 + 一个下一步动作；错误态：说明发生了什么 + 重试/返回；加载态：固定高度骨架，避免 CLS。\n\n**页面结构**\n\n```\n总览：MetricStrip（今日请求/成功率/缓存命中/平均延迟）\n      + 厂商汇总行（账号数/可用数/今日请求）\n      + 近 7 日请求折线\n      + 账号配额标尺列表（月配额为主，展开显示日/总量）\n      + 最近错误表\n\n账号：PageHeader（新建账号）\n      + 过滤（厂商/状态）\n      + 表格：厂商 | 名称 | 贡献者 | 优先级 | 配额标尺 | 状态 | EWMA | 最近错误 | 操作\n      + 配额列三项全空时显示「未配置额度，可能超用」，不画满格\n      + 新建/编辑对话框（按厂商渲染凭证字段） | 测活结果对话框 | 重置/启停/删除确认\n\n成员与 Key：成员表（名称/启用/Key 数/操作）\n      + 选中成员后显示其 Key 表（前缀/日限额/RPM/最近使用/启用/吊销）\n      + 新建成员、创建 Key（明文只显示一次）对话框\n\n用量：筛选（时间/用户/厂商/账号）+ 指标切换（请求数/成功率/延迟）\n      + 折线图 + 分组切换（成员/厂商/账号）汇总表 + 导出 CSV\n\n日志：筛选（时间/状态/厂商/错误码）+ 表格 + 分页 + 详情对话框\n      + 列：时间 | request_id | 用户 | 厂商 | 账号 | 耗时 | 状态 | 错误码\n\n设置：可编辑区（缓存/预算/超时）+ 只读区（鉴权/版本/上传/并发/会话）\n      + 配额模板表（免责声明）+ 保存设置 + 清空缓存（显示清除条数）\n\n登录：居中 360px 列，wordmark + 密码字段 + 主按钮\n      + 无插画/背景装饰；错误显示在字段下方\n```\n\n**文案规则**：中文、句式简洁、主动语态；按钮与 toast 同名（「保存设置」→「设置已保存」）；错误说明 problem/cause/fix，不道歉。\n\n### D-A7 构建与镜像\n\n- `Dockerfile` 增加 `frontend-builder` 阶段：\n  - `ARG NODE_IMAGE=node:22-bookworm-slim@sha256:4b150b48b4116e2a22f2c39cc27025fbf4f153e2078fd3b14d159fdb5c7279da`，`FROM ${NODE_IMAGE}`；与现有 `PYTHON_IMAGE` 一样可被参数覆盖。\n  - `ARG NPM_REGISTRY=\"\"`；非空时安装 pnpm 用 `npm install -g pnpm@11.2.2 --registry \"$NPM_REGISTRY\"`，依赖安装用 `pnpm install --frozen-lockfile --registry \"$NPM_REGISTRY\"`；为空则两者都省略 `--registry`。\n  - `COPY frontend/package.json frontend/pnpm-lock.yaml` 后安装依赖；`COPY frontend/` 后 `pnpm build`。\n  - 运行阶段 `COPY --from=frontend-builder /app/frontend/dist /app/static`，`ENV FRONTEND_DIST=/app/static`。\n- 选 pnpm 而非 npm：npm lockfile 的 `resolved` 字段会固化下载 URL（本机经 npmmirror 生成后，换环境会指向镜像）；pnpm lockfile 以 integrity 为主，registry 通过参数注入，更符合 R-DEP-07 的「构建不依赖默认源」。\n- `docker-compose.yml` 的 `build.args` 增加 `NPM_REGISTRY: \"${NPM_REGISTRY:-}\"`；`.env.example` 增加说明；README 更新面板入口与前端开发命令。\n- `.dockerignore` 增加 `frontend/node_modules` 与 `frontend/dist`：只把源码送进构建上下文，避免宿主机依赖目录拖慢/污染镜像。\n- 发布版本：M3 将 `image`/`build.tags` 升到 `ocr-gateway:0.2.0`，保持 `0.1.0` 不可变；`.env.example` 增加 `NPM_REGISTRY` 与升级说明（只配 `UV_DEFAULT_INDEX` 的离线部署升级后必须补 `NPM_REGISTRY`；`DEFAULT_TIMEOUT_MS` 从“账号创建不生效”变为生效；`TRUST_PROXY_HEADERS` 新增 Secure 判定用途）。`[spec-review-amendment R-01/R-22]`\n- `FRONTEND_DIST` 默认 `\u003crepo\u003e/frontend/dist`（Docker 内 `/app/static`）；README 环境变量表与 `.env.example` 必须列出；命名与 `DATA_DIR` 的差异按“DIST=构建产物目录、DIR=数据目录”说明。`[spec-review-amendment R-25]`\n- 构建产物扫描：镜像构建/CI 断言 dist 不含 `MASTER_KEY`、`ADMIN_PASSWORD`、凭证或 Key 明文；前端不得用 `VITE_*` 承载秘密（Vite 会内联进产物）。`[spec-review-amendment R-48]`\n- 依赖层与代码层分开 COPY，前端依赖变更才失效；`pnpm` store 不跨阶段保留，避免镜像膨胀。\n\n### D-A8 切片与依赖\n\n真实 `Blocked-by` 落在 tickets.md；本表是语义源。\n\n| 切片 | 交付行为 | 依赖 |\n|---|---|---|\n| S1 后端鉴权与托管骨架 | cookie/CSRF 双轨、登出、安全头、静态兜底（无 dist 时 404）、Bearer 回归 | 无 |\n| S2 运行时设置 | settings 表 + 迁移 + 加载/热更新 + GET/PUT + 缓存重建 | S1（鉴权测试） |\n| S3 数据端点 | overview / usage.series / usage.summary 扩展 / logs 扩展 / accounts 配额 | S1、S2（总览读设置） |\n| S4 前端骨架与总览 | Vite 工程、设计 token、登录/框架、总览页、API 客户端 | S1、S3 |\n| S5 管理页 | 账号、成员与 Key、用量、日志、设置五页 | S4 |\n| S6 交付与视觉验收 | Docker 多阶段、README、镜像冒烟、七路由截图验收 | S5 |\n\nS6 的回滚依赖不可变 `0.2.0`/`0.1.0` tag + 部署前 DB 备份；详见 Migration Plan。`[spec-review-amendment R-01]`\n\n## 数据模型与迁移（D-2）\n\n`settings` 为新表，无旧表。\n\n**v_old**：不存在（`0001_initial` 无 settings 表）。\n\n**v_new**\n\n| 列 | 类型 | 约束 | 默认 | nullable |\n|---|---|---|---|---|\n| `key` | `TEXT` | PRIMARY KEY | 无 | NOT NULL |\n| `value` | `TEXT` | 无 | 无 | NOT NULL |\n| `updated_at` | `DATETIME` | 无 | 应用层 `utcnow()` | NOT NULL |\n\n索引：仅主键。迁移 `0002_settings.py`：`upgrade()` 建表；`downgrade()` 删表。存量数据无回填。\n\n**键与默认/校验**\n\n| key | 类型 | 默认（来自 env） | 校验 |\n|---|---|---|---|\n| `cache_enabled` | bool | `CACHE_ENABLED` | 必须是 bool |\n| `cache_ttl_seconds` | int | `CACHE_TTL_SECONDS` | 60–86400 |\n| `cache_max_entries` | int | `CACHE_MAX_ENTRIES` | 10–2000（最坏约 512MB） |\n| `request_deadline_ms` | int | `REQUEST_DEADLINE_MS` | 1000–20000（须 \u003c stop_grace_period 25s） |\n| `default_timeout_ms` | int | `DEFAULT_TIMEOUT_MS` | 1000–60000 |\n\n生命周期：启动加载 → 管理员 PUT 部分更新（单事务 upsert）→ 提交成功后应用到内存；删除账号/成员不影响设置；无归档。\n\n\u003e `key` 类型统一为 `TEXT`（与 D-A2 首段一致；SQLite 下与 VARCHAR 亲和性相同，契约仍取唯一写法）。`[spec-review-amendment R-18]`\n\u003e settings 随 SQLite 备份/恢复；丢失时回退 env 默认。RPO=最近一次备份（默认每日），RTO=`scripts/rollback.sh` 恢复时间。`[spec-review-amendment R-43]`\n\n## 接口契约（D-1 已核验现有路径/字段）\n\n### 登录 / 登出 / 当前管理员\n\n`POST /api/admin/login`\n\n```json\n{ \"password\": \"correct horse battery staple\" }\n```\n\n200：\n\n```json\n{ \"token\": \"\u003csigned-token\u003e\", \"expires_in\": 43200, \"csrf_token\": \"\u003curlsafe-token\u003e\" }\n```\n\n`Set-Cookie: ocr_admin_session=\u003csigned-token\u003e; Path=/; HttpOnly; SameSite=Lax; Max-Age=43200[; Secure]`\n`Set-Cookie: ocr_csrf=\u003curlsafe-token\u003e; Path=/; SameSite=Lax; Max-Age=43200[; Secure]`\n\n错误：401 `UNAUTHORIZED`（密码错误）、429 `RATE_LIMITED`（1 分钟 5 次失败后）。\n\n`GET /api/admin/me`\n\n200：`{ \"username\": \"admin\", \"csrf_token\": \"\u003curlsafe-token\u003e\" }`；cookie 会话缺 CSRF cookie 时补发。\n\n`POST /api/admin/logout`\n\n204；清空两个 cookie。Cookie 路径写操作需 `X-CSRF-Token`；Bearer 路径豁免。\n\n**CSRF 规则**\n\n| 认证来源 | GET/HEAD | POST/PUT/PATCH/DELETE |\n|---|---|---|\n| Bearer | 不校验 | 不校验 |\n| cookie | 不校验 | 必须 `X-CSRF-Token` == `ocr_csrf` |\n\n同时存在 Bearer 与 cookie 时以 Bearer 为准（不校验 CSRF）。\n\n### 设置\n\n`GET /api/admin/settings`\n\n```json\n{\n  \"editable\": {\n    \"cache_enabled\": true,\n    \"cache_ttl_seconds\": 3600,\n    \"cache_max_entries\": 1000,\n    \"request_deadline_ms\": 20000,\n    \"default_timeout_ms\": 8000\n  },\n  \"readonly\": {\n    \"api_auth_enabled\": true,\n    \"version\": \"0.2.0\",\n    \"max_upload_bytes\": 10485760,\n    \"max_image_pixels\": 40000000,\n    \"max_concurrent_requests\": 8,\n    \"session_ttl_seconds\": 43200,\n    \"frontend_built\": true\n  }\n}\n```\n\n`PUT /api/admin/settings`（部分更新）\n\n```json\n{ \"cache_ttl_seconds\": 1800, \"request_deadline_ms\": 15000 }\n```\n\n200：\n\n```json\n{ \"settings\": { \"...\": \"同 editable 全量\" }, \"cache_cleared\": true }\n```\n\n400 `BAD_REQUEST`（字段类型/范围非法；`error.fields` 含字段名与原因）；显式 `null` 也 400；500 `INTERNAL_ERROR`（DB 写失败，运行时不生效）。`[spec-review-amendment R-05/R-15]`\n\n### 总览\n\n`GET /api/admin/overview`\n\n```json\n{\n  \"generated_at\": \"2026-11-04T01:00:00+08:00\",\n  \"today\": {\n    \"requests\": 128, \"success\": 127, \"failure\": 1, \"cached\": 49,\n    \"quota_used\": 79, \"success_rate\": 0.9922, \"cache_hit_rate\": 0.3828,\n    \"avg_latency_ms\": 412, \"auto_failures\": 0\n  },\n  \"providers\": [\n    { \"code\": \"baidu\", \"name\": \"百度智能云\", \"accounts\": 2, \"available_accounts\": 2,\n      \"today_requests\": 70, \"today_failures\": 0 }\n  ],\n  \"accounts\": [\n    { \"id\": 1, \"name\": \"百度-小明\", \"provider\": \"baidu\", \"state\": \"active\",\n      \"quota_usage\": {\n        \"daily\": { \"used\": 12, \"limit\": null, \"period_key\": \"2026-11-04\" },\n        \"monthly\": { \"used\": 120, \"limit\": 1000, \"period_key\": \"2026-11-01\" },\n        \"total\": { \"used\": 120, \"limit\": null, \"period_key\": \"all\" }\n      } }\n  ],\n  \"recent_errors\": [\n    { \"id\": 42, \"request_id\": \"…\", \"provider\": \"tencent\", \"account_id\": 2,\n      \"account_name\": \"腾讯-小李\", \"error_code\": \"TIMEOUT\", \"latency_ms\": 8000,\n      \"created_at\": \"2026-11-04T00:59:00\" }\n  ],\n  \"cache\": { \"enabled\": true, \"entries\": 123, \"ttl_seconds\": 3600, \"max_entries\": 1000 },\n  \"series\": [\n    { \"date\": \"2026-10-29\", \"requests\": 10, \"success\": 9, \"failure\": 1,\n      \"cached\": 3, \"quota_used\": 7, \"avg_latency_ms\": 380 }\n  ]\n}\n```\n\n`success_rate`/`cache_hit_rate` 在请求数为 0 时为 `null`。`available_accounts` 用 `AccountRegistry.available_count()`（`backend/app/core/registry.py:188`），口径为瞬时可调度数（含并发/QPS 瞬时排除），overview 只读快照、不触发状态迁移；`today.auto_failures` 单独计数 `provider='auto'` 的失败；`series` 为近 7 个本地日桶（与 `/usage/series` 同口径），总览页首屏不再额外拉序列。`[spec-review-amendment R-09/R-21/R-52]`\n\n### 用量汇总与序列\n\n`GET /api/admin/usage/summary?from\u0026to\u0026group_by=user|provider|account\u0026user_id\u0026provider\u0026account_id`\n\n在现有响应基础上，每行增加 `avg_latency_ms`（int 或 null）与 `label`（成员名/账号名/厂商名；已删除实体为 `null`，`auto` 为「自动路由」），行按 key 升序且 `null` 最后；summary 也受 90 天跨度上限约束（超出 400）；其余字段不变。`[spec-review-amendment R-06/R-11/R-52]`\n\n`GET /api/admin/usage/series?from\u0026to\u0026user_id\u0026provider\u0026account_id`\n\n```json\n{\n  \"from\": \"2026-10-29T00:00:00+08:00\",\n  \"to\": \"2026-11-04T01:00:00+08:00\",\n  \"bucket\": \"day\",\n  \"rows\": [\n    { \"date\": \"2026-10-29\", \"requests\": 10, \"success\": 9, \"failure\": 1,\n      \"cached\": 3, \"quota_used\": 7, \"avg_latency_ms\": 380 }\n  ]\n}\n```\n\n- 日桶按 `Asia/Shanghai`；范围内缺日补零；`to` 默认当前时刻，`from` 默认本地日 00:00 往前 6 天（7 个日桶）；最大跨度按本地日历日差含当日 ≤90，超出 400。\n- 时间参数接受 ISO datetime 或 `YYYY-MM-DD`；**仅日期形式的 `to` 表示该本地日的结束（含当日）**，实现用半开区间 `[from, next_local_day_00:00)`；`from` 的日期形式表示当日 00:00。summary/logs/series 共用这一口径；`from` 晚于 `to` 返回 400。\n- `avg_latency_ms` 为该日全部事件 `latency_ms` 四舍五入到整数的均值（含失败；失败也代表真实耗时）。`[spec-review-amendment R-12/R-52]`\n\n### 日志\n\n`GET /api/admin/logs?limit=50\u0026offset=0\u0026from\u0026to\u0026success\u0026provider\u0026error_code`\n\n响应在现有字段上增加 `total`（同过滤条件的总数）与每行的 `user_name`、`account_name`（可为 `null`）；`limit` 1–200；`offset \u003e= 0`；id 倒序。`provider` 过滤接受 `auto|baidu|tencent`；`from/to` 与 summary/series 共用口径与 90 天上限。不含 OCR 原文。`[spec-review-amendment R-06/R-12/R-52]`\n\n### 账号\n\n`GET /api/admin/accounts` 每行增加：\n\n```json\n\"owner_name\": \"小明\",\n\"quota_usage\": {\n  \"daily\": { \"used\": 12, \"limit\": 100, \"period_key\": \"2026-11-04\" },\n  \"monthly\": { \"used\": 120, \"limit\": 1000, \"period_key\": \"2026-11-01\" },\n  \"total\": { \"used\": 120, \"limit\": null, \"period_key\": \"all\" }\n}\n```\n\nruntime 缺失时 `used=0` 并记 warning（正常路径不缺失：启动加载、创建注册、删除移除）；`delete_account` MUST 同步 `state.quota.reset_account(account_id)`，避免内存计数残留导致 flush FK 失败或 id 复用继承旧用量。`[spec-review-amendment R-07]`\n\n## 组件与依赖\n\n**组件清单**\n\n| 组件 | 职责 | 技术 | 部署 |\n|---|---|---|---|\n| Admin SPA | 七个路由、表单、图表、设计系统 | React 18 + TS + Vite + Tailwind v4 + shadcn/ui + React Query + Recharts | 构建为静态资源，由 FastAPI 同源托管 |\n| FastAPI 管理面 | 鉴权、设置、总览、用量、日志、账号 API | FastAPI | 单进程 uvicorn |\n| 静态托管/安全头 | `/assets`、SPA 兜底、CSP 等 | Starlette StaticFiles + 中间件 | 同进程 |\n| Settings 存储 | 运行时可编辑设置 | SQLite + SQLAlchemy + Alembic | 同库 |\n| 用量/日志读取 | 聚合与分页 | SQLAlchemy | 同库 |\n| 构建链 | 前端构建 + 镜像打包 | Node 22 + pnpm + Docker 多阶段 | 构建期 |\n\n**变更前依赖**\n\n```\nAdmin ──Bearer──▶ /docs ──▶ admin API ──▶ SQLite\nClient ──Bearer──▶ public API ──▶ Scheduler ──▶ Providers / SQLite\n```\n\n**变更后依赖**\n\n```mermaid\nflowchart LR\n  Browser[Admin SPA\u003cbr/\u003eReact 18] --\u003e|cookie+CSRF / Bearer| API[FastAPI /api/admin]\n  Browser --\u003e|GET /assets, /| Static[FastAPI static + CSP]\n  API --\u003e Settings[(settings)]\n  API --\u003e Usage[(usage_events)]\n  API --\u003e Accounts[(accounts / quota_counters)]\n  API --\u003e Registry[AccountRegistry + QuotaManager\u003cbr/\u003ein-memory]\n  Client[API client] --\u003e|Bearer| Public[FastAPI /v1]\n  Public --\u003e Scheduler[Scheduler]\n  Scheduler --\u003e Providers[Baidu / Tencent]\n```\n\n**登录与写请求时序**\n\n```mermaid\nsequenceDiagram\n  participant B as Browser SPA\n  participant A as FastAPI require_admin\n  participant D as SQLite\n  B-\u003e\u003eA: POST /api/admin/login {password}\n  A-\u003e\u003eA: 校验密码 + 限速\n  A--\u003e\u003eB: 200 {token, csrf_token} + Set-Cookie(session, csrf)\n  B-\u003e\u003eA: PUT /api/admin/settings (cookie + X-CSRF-Token)\n  A-\u003e\u003eA: 校验 session cookie + CSRF 双提交\n  A-\u003e\u003eD: BEGIN; upsert settings; COMMIT\n  A-\u003e\u003eA: 应用 RuntimeSettings / 重建缓存\n  A--\u003e\u003eB: 200 {settings, cache_cleared}\n```\n\n**用量读取数据流**\n\n```\nusage_events (UTC naive)\n  → 按 [from,to] UTC 过滤（created_at 索引）\n  → Python 按 Asia/Shanghai 日期分桶 / 按维度聚合\n  → overview / summary / series / logs\n  → React Query 缓存 → 图表 / 表格\n```\n\n## 前端规格\n\n### 请求瀑布\n\n- 总览：`/overview`（内含 accounts/providers/recent_errors/cache/series）+ 鉴权 `/me` 并行；首屏数据一次往返，鉴权可并行。`[spec-review-amendment R-09/R-33]`\n- 成员与 Key：`/users` 与 `/api-keys` 并行；选中成员后本地过滤，不追加请求。\n- 账号：`/accounts` 与 `/users` 并行（列表名称由 `owner_name` 带回，`/users` 只用于新建/编辑的贡献者下拉）。\n- 用量：`/usage/summary`、`/usage/series`、`/users`、`/accounts` 并行；筛选源有自己的 loading/error 降级，不阻塞图表/表格。`[spec-review-amendment R-31]`\n- 日志：`/logs` 单请求（含 `total`、`user_name`、`account_name`）。\n- 设置：`/settings` 与 `/quota-templates` 并行。\n- 名称类字段由后端随响应返回；`/users`、`/accounts` 只在需要下拉选项的页面并行拉取，列表本身不再做 N+1 映射。\n- 页面级 code split：首屏只加载 shell + 当前路由。\n\n### 加载 / 空 / 错误三态\n\n| 场景 | 加载 | 空 | 错误 |\n|---|---|---|---|\n| 表格 | 固定高度骨架行 | 一句说明 + 主操作 | 错误说明 + 重试按钮 |\n| 图表 | 同高占位 + 发丝网格 | 「所选时间内没有请求」 | 图表区错误 + 重试 |\n| 表单对话框 | 提交按钮 pending/禁用 | — | 字段级错误 + 顶部汇总 |\n| 设置 | 骨架 | — | 保留旧值 + toast |\n| 鉴权引导 | 全屏 Boot 骨架 | — | 启动错误页 + 重试（401 直接跳登录） |\n| 筛选源（`/users`、`/accounts`） | 下拉禁用 + 小骨架 | 「暂无选项」 | 下拉禁用 + 行内错误，不把整页打成错误 |\n\n### 交互边界（FE-01/03/10）\n\n- 所有提交按钮 pending 时禁用；同一资源写操作加 `scope`（React Query v5）或提交 guard 串行，防双击；`mutationKey` 只作标识，不承担串行/去重。`[spec-review-amendment R-29]`\n- 慢网络：15s 超时后显示「请求超时，请重试」；不自动重试写操作。\n- 并发标签页：会话 cookie 共享；一个标签页登出后，另一个标签页下一次请求 401 → 清缓存并跳登录；登录轮换 CSRF cookie 后旧标签页写请求 403 → GET `/me` 刷新 token 后单次重试。`[spec-review-amendment R-30]`\n- 脏表单：`beforeunload` 与路由离开确认；同表单双标签明确 last-write-wins 并提示。`[spec-review-amendment R-38]`\n- 编辑账号时凭证字段留空表示不修改；任一凭证字段填写则要求该厂商全部必填字段；掩码值不回填、不回传。\n- Key 明文只在创建成功对话框显示一次，带复制按钮与「关闭后无法再次查看」提示；剪贴板不可用时回退为可选中文本。\n- 删除成员/账号/Key 用确认对话框；删除成员提示会一并吊销其 Key（DB `ON DELETE CASCADE` 已启用，`backend/app/db.py` 的 `PRAGMA foreign_keys=ON`）。\n- 「重置状态」调用现有 `reset-state`：恢复 `active` 之外还会清零该账号的配额计数（现有端点行为）；确认框必须写明这一点，避免管理员误以为只清冷却。\n\n### URL 即状态（FE-09）\n\n- 用量：`from/to/user/provider/account/metric/group` 全部进 query；刷新/分享/后退保持；筛选变化时 offset 归零。\n- 日志：`from/to/status/provider/error/limit/offset` 进 query；翻页即改 query。\n- 账号：`provider/state` 过滤进 query。\n- 成员与 Key：`member` 选中进 query。\n- 设置：不把表单草稿放进 URL（避免误分享未保存值）。\n- 登录：受保护路由未认证跳转时保存同源相对 `returnTo`，登录成功回跳；滚动恢复按路由/query 记录。`[spec-review-amendment R-37]`\n\n### 视觉与响应式（FE-04/05/13）\n\n- 首屏可辨识：侧栏 wordmark + 深墨蓝 + 刻度标尺；不使用图标+圆圈+三列卡片套路。\n- 黑名单自查：无紫色渐变、无 blob/几何装饰、无 emoji 图标、无全局居中排版。\n- 断点：`\u003c768` 顶部抽屉 + 表格横向滚动（首列 sticky）；`768–1279` 侧栏 208px；`≥1280` 232px；内容最大宽 1280px；最小支持宽度 360px，登录列 `width: min(360px, 100% - 32px)`，对话框窄屏全宽，图表最小高度固定。`[spec-review-amendment R-40]`\n- 表格在窄屏保留关键列（名称/状态/操作），其余横向滚动；不把表格改造成卡片列表。\n- `prefers-reduced-motion` 下关闭过渡；动效只用于对话框/抽屉开合与页面首次淡入（120–180ms ease-out）。\n\n### CWV 与 NFR（FE-06 / BASE-16）\n\n- 目标（75 分位、生产构建、LAN）：LCP ≤ 2.5s、INP ≤ 200ms、CLS ≤ 0.1。验收方式：Lighthouse 移动端/4G 跑一次并记录实测值（不新增 CI）；与 task 4.4/6.5 的截图一起归档。`[spec-review-amendment R-39]`\n- 首屏 JS 预算：登录+shell gzip 后 ≤ 150KB；总览路由 chunk（含 Recharts）gzip 后 ≤ 350KB；task 4.4 记录实际 chunk 清单，不把“懒加载”当作未计量。`[spec-review-amendment R-19]`\n- 设置保存 p95 ≤ 500ms（localhost SQLite，5 行 upsert）。\n- 用量序列/汇总/日志查询 p95 ≤ 300ms（10 万条 `usage_events` 以内，本地 SQLite，`created_at` 索引；summary 也受 90 天上限约束并有基准覆盖）。`[spec-review-amendment R-06]`\n- 无可用性 SLA（单实例内部工具）；沿用配额计数 RPO ≤ 2s 的既有语义。\n\n## 失败模式与可观测性\n\n| 场景 | 检测 | 处理 / 降级 | 用户可见 | 测试 |\n|---|---|---|---|---|\n| 密码错误 | 401 | 不建会话 | 「密码不正确，请检查后重试。」 | pytest |\n| 登录过频 | 429 | 保持登录页 | 「尝试次数过多，请 1 分钟后再试。」 | pytest |\n| 会话过期 | 401 | 清前端会话状态 | 跳登录 + 「登录已过期，请重新登录。」 | pytest + 手工 |\n| CSRF 缺失/不符 | 403 | 不执行写 | 「页面已过期，请刷新后重试」 | pytest |\n| 设置字段非法 | 400 | 不写 DB、不改运行时 | 字段级错误 | pytest |\n| 设置 DB 写失败 | 500 | 事务回滚，运行时不变 | 「保存失败，请重试」 | pytest（注入失败） |\n| 静态产物缺失 | `index.html` 不存在 | API 正常，`/` 返回 404 | 「面板未构建」 | pytest |\n| API 404 被 SPA 兜底 | 路径前缀/扩展名规则 | 返回 JSON 404 | 错误 toast | pytest |\n| 用量时间非法/跨度过大 | 400 | 保留上一次结果 | 「时间范围无效」 | pytest |\n| 图表空数据 | rows 空 | 空态 | 「所选时间内没有请求」 | 手工 |\n| 网络断开/超时 | fetch reject/abort | 错误态 + 重试 | 「无法连接网关」/「请求超时」 | 手工 |\n| 账号测活失败 | 200 `ok=false` | 不写事件、不扣配额 | 错误码 + 消息 | pytest |\n| 修改缓存设置 | `cache_cleared=true` | 重建缓存 | toast 提示缓存已清空 | pytest + 手工 |\n| 删除成员 | 204 | 级联删除 Key | 确认框已提示 | pytest |\n| 回滚 DB schema 不匹配 | 旧入口迁移失败 | `scripts/rollback.sh` 恢复部署前备份；0.2.0/0.1.0 tag 不可变 | 启动失败/重启循环 | 手工演练 |\n| 缓存内存超预算 | entries × 256KB | 上限 2000；后续 byte budget 另开 | 服务变慢/OOM | 单元 + 手工 |\n| summary 全表扫描 | 跨度/行数 | 90 天 400；SQL 聚合 | 「时间范围无效」/超时 | pytest + 基准 |\n| 并发 PUT settings | Lock 串行 | DB/runtime 一致 | 保存后值不生效 | pytest |\n| 删除账号后配额 flush | FK 错误日志 | `quota.reset_account` | 配额统计停更 | pytest |\n| CSRF 403（其他标签页旧 token） | 403 | GET `/me` 刷新后重试 | 「页面已过期」 | 手工 |\n`[spec-review-amendment R-01/R-03/R-06/R-10/R-07/R-30]`\n\n**可观测性**\n\n- 沿用请求中间件日志：`request_id`、method、path、status、latency_ms（`backend/app/main.py:114-132`）。\n- 新增结构化日志：`admin.login.succeeded/failed`（IP，不含密码）、`admin.settings.updated`（变更键名，不含凭证）、`admin.settings.rejected`（字段名/原因）、`admin.query`（path、duration_ms、rows，overview/series/summary/logs）、`admin.panel.static_missing`（启动警告）。`[spec-review-amendment R-45]`\n- 不新增 metrics/追踪端点（Prometheus 属 M5）；前端不接第三方分析。\n- 健康检查不变：`GET /healthz` 只判 DB。\n\n## 安全与数据保护\n\n- 信任边界：浏览器 → FastAPI admin API。所有 `/api/admin/*`（除 login）都要鉴权；无横向越权面（只有单一 admin，无对象归属校验）。\n- 输入校验：Pydantic 模型 + 字段范围；日志/用量查询的 `from/to` 复用现有 `_parse_time` 与 400 语义。\n- 凭证：账号凭证 AES-GCM 存储；列表只返回掩码；编辑不回传掩码；前端不把凭证写入 query/localStorage。\n- Key：只存 SHA-256；明文只在创建响应；前端只在一次性对话框展示。\n- 日志：不含 OCR 原文、不含凭证、不含密码；`image_hash` 只存前 16 位。\n- XSS：React 默认转义；不使用 `dangerouslySetInnerHTML`；CSP `script-src 'self'`。\n- CSRF：双提交 + `SameSite=Lax`；Bearer 路径不依赖 cookie。\n- Cookie：session `HttpOnly`；HTTPS 时 `Secure`；不设 `Domain`；`Path=/`。\n- 数据外发：除百度/腾讯 OCR 调用外无第三方；前端无统计/字体 CDN（字体自托管）。\n- 登出只清客户端 cookie；签名 token 在 12h 内仍有效（无服务端会话表），这是 v1 接受的残留风险；服务端即时吊销另开 change。`[spec-review-amendment R-53]`\n- `/docs`：`require_admin` 声明 `HTTPBearer` security scheme，Swagger Authorize 可用；cookie 会话的写操作仍需 `X-CSRF-Token`。`[spec-review-amendment R-49]`\n- 反代：README 的 nginx 示例 MUST 转发 `X-Forwarded-Proto`，部署 MUST 设置 `TRUST_PROXY_HEADERS=true`；HTTPS 下登录响应 cookie 必须带 `Secure`，镜像冒烟断言。`[spec-review-amendment R-04]`\n- 合规：不涉及 PII 存储；OCR 原文默认不落库；无数据居留/行业合规要求（项目为内部小团队工具）。\n\n## DX / 上手与文案\n\n**TTHW（估算，非实测）**\n\n- **Docker 路径**：`cp .env.example .env` → 填 2 个必填值 → `docker compose up -d` → `curl /healthz`，共 3 条命令。假设：镜像已构建、`.env` 填写约 1 分钟、健康等待 30–90 秒；**面板可用 TTHW 约 2 分钟 + 10 秒登录**（估算，不含首次镜像构建）。README 沿用此口径，并把「打开面板并登录」作为终点。\n- **前端源码开发路径**：`uv sync --project backend`（按 1–3 分钟）→ `pnpm install --registry \u003c镜像\u003e`（按 1–3 分钟）→ 启动后端（1–2 秒）→ `pnpm dev`（1–2 秒），共 4 条命令；**估算约 4–6 分钟**（首次，按区间相加），后续热启动 \u003c1 分钟。前置：Node 22 + pnpm；默认 npm 源不可达时用 `--registry`/`.npmrc`。README 标注「估算」与假设。`[spec-review-amendment R-24]`\n\n**新增用户可见错误文案（problem / cause / fix）**\n\n\u003e 本表是用户可见文案的唯一真相源；失败模式表的同一错误只引用本表原文。`[spec-review-amendment R-23]`\n\n| 文案 | problem | cause | fix |\n|---|---|---|---|\n| 密码不正确，请检查后重试。 | 登录失败 | 输入的密码与 `ADMIN_PASSWORD` 不一致 | 重新输入；忘记则查看部署环境变量 |\n| 尝试次数过多，请 1 分钟后再试。 | 登录被限速 | 1 分钟内失败次数达到上限 | 等待 1 分钟再试 |\n| 登录已过期，请重新登录。 | 会话失效 | cookie 过期或服务重启/密钥轮换 | 重新登录 |\n| 页面已过期，请刷新后重试。 | 写操作被拒 | CSRF 头缺失或与 cookie 不一致 | 刷新页面后重试；仍失败则重新登录 |\n| 缓存 TTL 需在 60 到 86400 秒之间。 | 设置未保存 | 输入超出允许范围 | 按提示范围修改 |\n| 缓存容量需在 10 到 2000 条之间。 | 设置未保存 | 输入超出允许范围 | 按提示范围修改 |\n| 请求总预算需在 1000 到 20000 毫秒之间。 | 设置未保存 | 输入超出允许范围 | 按提示范围修改 |\n| 账号默认超时需在 1000 到 60000 毫秒之间。 | 设置未保存 | 输入超出允许范围 | 按提示范围修改 |\n| 未知设置项：\u003c字段名\u003e。 | 设置未保存 | 请求包含未定义的键 | 删除该键后重试 |\n| 保存失败，请重试；若持续失败，请查看服务日志。 | 设置未保存 | 数据库写入失败 | 重试；持续失败时查服务端日志 |\n| 无法连接网关，请确认服务正在运行。 | 数据未加载 | 网络不可达或后端未启动 | 检查服务状态与网络后重试 |\n| 请求超时，请重试。 | 请求未完成 | 超过 15 秒客户端超时 | 重试；持续超时查服务端 |\n| 面板尚未构建，请先运行 pnpm build。 | 面板不可用 | 源码环境缺少前端产物 | 在源码环境运行 pnpm build 后重启 |\n| 面板资源未构建，请使用包含面板的镜像。 | 面板不可用 | 当前镜像没有前端产物 | 改用含面板的镜像，或按部署文档重新构建 |\n| 所选时间内没有请求。 | 图表为空 | 筛选范围内没有事件 | 放宽时间范围 |\n\n**命名与默认值**\n\n- 设置键沿用 env 的 snake_case 与语义：`cache_enabled` / `cache_ttl_seconds` / `cache_max_entries` / `request_deadline_ms` / `default_timeout_ms`；默认值来自同名 env。升级影响：`DEFAULT_TIMEOUT_MS` 过去对账号创建不生效，升级后生效（自定义过该值的部署新账号超时会变）；`TRUST_PROXY_HEADERS` 新增 Secure 判定用途；离线部署需补 `NPM_REGISTRY`。范围校验见「数据模型与迁移」。`[spec-review-amendment R-22]`\n- `NPM_REGISTRY` 与既有 `UV_DEFAULT_INDEX` 语义同构（空值=默认源，非空=指定镜像），词形不同；两者并列写在 `.env.example` 并加相邻注释。`[spec-review-amendment R-25]`\n- `FRONTEND_DIST`：默认 `\u003crepo\u003e/frontend/dist`，Docker 内 `/app/static`；`DIST` 表示构建产物目录，区别于 `DATA_DIR` 的数据目录；README/.env.example 必须列出。`[spec-review-amendment R-25]`\n- 新端点沿用 `/api/admin/\u003cresource\u003e` 复数/只读命名：`/overview`、`/usage/series`、`/settings`、`/logout`。\n- cookie 统一 `ocr_` 前缀：`ocr_admin_session`、`ocr_csrf`。\n- 升级路径：Bearer 保留；旧脚本与 curl 不受影响。`/docs` 的 Authorize 本次补 HTTPBearer scheme 后可用。**DX-04 不判 N/A**：离线部署需新增 `NPM_REGISTRY`，`DEFAULT_TIMEOUT_MS` 语义变化，`TRUST_PROXY_HEADERS` 用途扩展；升级说明见 README/.env.example。本次不新增/修改 SKILL.md（DX-05 N/A）。`[spec-review-amendment R-22/R-49]`\n\n## Compliance\n\n- **D-1**：本设计引用的函数/字段/路径均已 `grep`/读文件核验（`require_admin`、`_account_out`、`usage_summary`、`list_logs`、`QuotaManager.used`、`ResultCache`、`Scheduler.__init__`、`settings` 缺失、`0001_initial` 唯一迁移）。**补记**：`request_deadline_ms` 的消费点除 `config.py:71`/`scheduler.py` 外还有 `public.py:200`（外层总预算）；本次一并切换。`[spec-review-amendment R-02]`\n- **D-2**：`settings` 表的 v_old/v_new 列清单见「数据模型与迁移」。\n- **D-3**：proposal 的 Non-Goals 每条附可证伪假设。\n- **D-4**：不新增外部运行时依赖；前端同源 fetch 15s 超时；SQLite 为本地文件；写操作事务回滚；无第三方网络调用（除既有 OCR 厂商）。\n- **D-5**：proposal 含 Success Metrics（3 条，可观察）。\n- **D-6**：`settings` 只属于本应用，不跨产品/模块共享；未触碰 `users/api_keys/accounts` 的共享边界；无越界。\n- **技术选型**：遵守 `docs/tech-selection.md` §11（cookie/CSRF/CSP/日志）、§12（页面与交互）、§15（前端类型检查+构建）；不擅自引入 SSR/新状态库/新 UI 框架。\n- **显式豁免**：密码存储沿用 MVP D22（`ADMIN_PASSWORD` env 常量时间比较，不引 argon2）；API 鉴权开关/本地 OCR 开关按 decision-memo D3 与 proposal Non-Goals 砍掉。`[spec-review-amendment R-51]`\n- **部署**：遵守 `openspec/specs/deployment/spec.md` R-DEP-07（索引参数化）与 R-DEP-08（非 root、自愈）；镜像仍单进程、单 worker。\n- **AGENTS.md**：提及本机私有凭证文档时只用「仓库外的本地私有凭证文档」代称。\n- **BASE 质量项**：BASE-06 失败模式表、BASE-11 可观测性、BASE-12 决策记录（`decision-memo.md` + 本节）、BASE-16 NFR 数字、BASE-19 图（组件/时序/数据流）、BASE-24 数据模型、BASE-25 组件清单、BASE-28 安全、BASE-31 切片。\n- **FE/REACT/BE/DX**：FE-01/02/03/04/05/06/07/09/10/11/13、REACT-01/02、BE-01~07/09/10、DX-01~03 已在对应小节落地；FE-12（i18n）与 REACT-03（RSC）不适用；BE-11 SLA 不适用（内部工具）。\n\n### 契约同步清单（scope-check，`[spec-review-amendment R-50]`）\n\n| 文档 | 本次是否改 | 理由 |\n|---|---|---|\n| `openspec/specs/admin-api/spec.md` | 改（MODIFIED） | R-ADM-01/06/08/09 |\n| `openspec/specs/deployment/spec.md` | 改（MODIFIED/ADDED） | R-DEP-07/09/10 |\n| `openspec/specs/account-pool-scheduling/spec.md` | 改（MODIFIED R-SCH-03） | deadline 来源改为运行时设置 |\n| `openspec/specs/result-cache/spec.md` | 改（MODIFIED R-CAC-02） | TTL/容量可运行时覆盖，变更清空 |\n| `openspec/specs/quota-accounting/spec.md` | 不改 | 记账语义不变；仅展示已用量 |\n| `openspec/specs/ocr-api/spec.md` | 不改 | 公共 API 契约不变 |\n| `openspec/specs/provider-adapters/spec.md` | 不改 | 适配器不变 |\n| `README.md` / `.env.example` / `docker-compose.yml` | 改（tasks 6.1/6.2） | 面板入口、NPM_REGISTRY、升级/回滚 |\n\n## Risks / Trade-offs\n\n| 风险 | 缓解 |\n|---|---|\n| CSRF/cookie 配置错误导致面板无法写 | 双路径测试 + 真实浏览器冒烟；Bearer 后备；错误码可诊断 |\n| 设置热更新与并发请求竞态 | 单事件循环、整体字段替换、提交后应用；文档标明单实例边界 |\n| SPA 兜底吞掉 API 404 | 路径前缀/扩展名规则 + 测试；兜底注册在最后 |\n| CSP 阻止 Recharts/内联样式 | `style-src 'unsafe-inline'`、不引入第三方脚本；浏览器冒烟核对控制台 |\n| CSP 误伤 `/docs` 的 Swagger CDN 资源 | CSP 只作用于面板入口/静态资源，`/docs` 与 API 不加 CSP；冒烟验证 `/docs` 可打开 |\n| 前端构建源不可达 | `NPM_REGISTRY` 参数 + pnpm integrity lock；README/`.env.example` 说明 |\n| 设计漂移 | token 集中在 CSS 变量；组件只用 shadcn 原语 + 自定义 3 个小件；截图验收 |\n| 账号配额显示与 DB 差 2s | 内存计数器是权威；页面标注「准实时」；不承诺秒级 |\n| 掩码凭证被回传覆盖真实凭证 | 编辑表单不回填/不回传掩码；后端 `credentials` 缺省即不改 |\n| 时区分桶错位 | 复用 `SHANGHAI` 与 `period_key`；单测覆盖跨日/月边界 |\n| 镜像构建时间增加 | 前端依赖层缓存；Node 阶段与运行阶段分离；构建失败不产出镜像 |\n| 旧镜像回滚后设置表无用数据 | 旧代码忽略新表；`downgrade` 可删；数据仅 5 行 |\n| 回滚时 DB 已到 0002、旧镜像迁移失败；0.1.0 tag 被覆盖 | 发布前备份 + `scripts/rollback.sh` 恢复；0.2.0/0.1.0 tag 不可变；6.6 演练 |\n| 缓存条目上限导致内存膨胀 | `cache_max_entries` ≤2000（最坏约 512MB）；后续 byte budget 另开 |\n| summary 全表扫描 | 90 天上限 + SQL 聚合 + 基准覆盖 |\n| 请求预算调大后被停机宽限截断 | `request_deadline_ms` ≤20000 或 `stop_grace_period` \u003e60s |\n| 删除账号后配额 flush FK 失败 | `delete_account` 同步 `quota.reset_account` + 回归测试 |\n| 并发 PUT 设置 DB/runtime 分叉 | `asyncio.Lock` 串行 merge+commit+apply |\n`[spec-review-amendment R-01/R-03/R-06/R-08/R-07/R-10]`\n\n## Migration Plan\n\n1. 合并后 `alembic upgrade head` 创建 `settings` 表（entrypoint 已自动迁移）。\n2. 启动加载 settings；非法值回退 env 默认并 warning。\n3. 构建镜像：M3 版本升 `0.2.0`，`image`/`build.tags` 改为 `ocr-gateway:0.2.0`，保持 `0.1.0` 不可变；Node 阶段产出 `dist` → 运行镜像 `/app/static`；`docker compose up -d` 后 `/` 返回面板，`/healthz` 不变。`[spec-review-amendment R-01]`\n4. 回滚：先 `git checkout` 上一提交（compose 指向 `ocr-gateway:0.1.0`，该 tag 必须未被 M3 构建覆盖），再 `scripts/rollback.sh \u003c部署前备份\u003e` 把 DB 恢复到 0001；仅切镜像不恢复 DB 会让旧 entrypoint 的 `alembic upgrade head` 遇到未知 revision 0002 并退出。旧代码只认 Bearer，管理员可用 `/docs`（本次补 HTTPBearer scheme）。`[spec-review-amendment R-01]`\n5. 前端本地开发：`pnpm install \u0026\u0026 pnpm dev`（代理 8000）；生产验证用 `pnpm build` + 后端静态托管。\n6. 备份：沿用 `scripts/backup.sh` 的 SQLite 备份；新增表随库一起备份；settings 丢失时回退 env，RPO=最近一次备份，RTO=`scripts/rollback.sh` 恢复时间。`[spec-review-amendment R-43]`\n7. 升级提示：只配 `UV_DEFAULT_INDEX` 的离线部署需补 `NPM_REGISTRY`；`DEFAULT_TIMEOUT_MS` 现在对账号创建生效；`TRUST_PROXY_HEADERS` 新增 Secure 判定用途；`/docs` 的 Authorize 本次补 HTTPBearer scheme 后可用。`[spec-review-amendment R-22/R-49]`\n\n"},{"label":"spec:account-pool-scheduling","path":"openspec/changes/m3-admin-panel/specs/account-pool-scheduling/spec.md","text":"# Spec Delta\n\n## MODIFIED Requirements\n\n### Requirement: R-SCH-03 故障切换与总预算\n\n对可重试失败，调度器 SHALL 标记账号并继续下一个候选，直到成功或请求总预算耗尽；输入错误 MUST NOT 切换；无候选可用返回 503，候选全部失败且最后一次失败为 `PROVIDER_ERROR` 返回 502，预算耗尽返回 504。请求总预算默认取 `REQUEST_DEADLINE_MS`，MUST 可被管理端运行时设置覆盖并即时生效，且 `public.py` 的外层等待与 `Scheduler` MUST 使用同一个绝对 deadline。`[spec-review-amendment R-50]`\n\n#### Scenario: 主账号 5xx 切换备用\n- **WHEN** 首选账号返回 5xx\n- **THEN** 同一请求由同厂商备用账号成功返回\n\n#### Scenario: 输入错误不回退\n- **WHEN** 首选账号返回图片格式错误\n- **THEN** 直接返回 400，不调用备用账号\n\n#### Scenario: 厂商持续 5xx\n- **WHEN** 候选账号都返回 5xx 且总预算未耗尽\n- **THEN** 返回 502 `PROVIDER_ERROR`，不返回 503\n\n#### Scenario: 运行时预算生效\n- **WHEN** 管理员把请求总预算改为 10000ms 并保存\n- **THEN** 后续请求按新的 10000ms 总预算执行，不再被旧的外层 deadline 截断\n"},{"label":"spec:admin-api","path":"openspec/changes/m3-admin-panel/specs/admin-api/spec.md","text":"# Spec Delta\n\n## MODIFIED Requirements\n\n### Requirement: R-ADM-01 管理员登录与令牌\n\n系统 SHALL 用 `ADMIN_PASSWORD` 校验登录，返回签名 Bearer token 并设置 HttpOnly 会话 cookie 与 CSRF cookie（默认 12h）；除 `/api/admin/login` 外的所有 `/api/admin/*` MUST 接受 Bearer 或有效会话 cookie，缺失/无效/过期返回 401；cookie 会话的写方法 MUST 校验 `X-CSRF-Token`；登录失败 MUST 限速（5 次/分钟，按 IP + 全局双层，全局层只延迟不永久阻断）；登出 MUST 清空会话与 CSRF cookie。`[spec-review-amendment D16/D20；m3 恢复 cookie+CSRF 双轨；R-49]`\n\n#### Scenario: 登录成功\n- **WHEN** 提交正确密码\n- **THEN** 返回 token、`expires_in` 与 `csrf_token`，并设置会话 cookie 与 CSRF cookie\n\n#### Scenario: Cookie 属性\n- **WHEN** 在 HTTPS 请求上登录\n- **THEN** 会话 cookie 为 HttpOnly 且带 `Secure`，CSRF cookie 可被脚本读取且与响应中的 `csrf_token` 一致\n\n#### Scenario: 未带令牌访问管理 API\n- **WHEN** 请求 `/api/admin/accounts` 且无 Authorization、无会话 cookie\n- **THEN** 返回 401\n\n#### Scenario: Bearer 访问\n- **WHEN** 请求携带有效 Bearer token\n- **THEN** 请求成功，且不要求 CSRF 头\n\n#### Scenario: Bearer 无效且存在 cookie\n- **WHEN** 请求同时携带无效 Bearer 与有效会话 cookie\n- **THEN** 返回 401，不回退 cookie\n\n#### Scenario: Swagger Authorize\n- **WHEN** 打开 `/docs`\n- **THEN** OpenAPI 声明 Bearer security scheme，Authorize 可用\n\n#### Scenario: HTTPS 反代 Cookie\n- **WHEN** 反代终结 TLS，转发 `X-Forwarded-Proto` 且 `TRUST_PROXY_HEADERS=true`\n- **THEN** 登录响应的会话 cookie 与 CSRF cookie 都带 `Secure`\n\n#### Scenario: Cookie 写请求缺 CSRF\n- **WHEN** 仅凭会话 cookie 发起 `PUT /api/admin/settings` 且缺少或不匹配 `X-CSRF-Token`\n- **THEN** 返回 403 `FORBIDDEN`，不执行写操作\n\n#### Scenario: Cookie 写请求带 CSRF\n- **WHEN** 仅凭会话 cookie 发起写请求且 `X-CSRF-Token` 与 CSRF cookie 一致\n- **THEN** 写操作成功\n\n#### Scenario: 当前管理员\n- **WHEN** 已登录管理员请求 `/api/admin/me`\n- **THEN** 返回 `username` 与 `csrf_token`；cookie 会话缺 CSRF cookie 时补发\n\n#### Scenario: 登出\n- **WHEN** 管理员调用 `/api/admin/logout`\n- **THEN** 两个 cookie 被清空，随后仅凭 cookie 的请求返回 401\n\n#### Scenario: 暴力尝试\n- **WHEN** 1 分钟内连续 5 次密码错误\n- **THEN** 第 6 次返回 429\n\n### Requirement: R-ADM-06 用量与日志查询\n\n管理员 SHALL 能按时间与维度查询用量汇总、按本地日查询时间序列、分页查询请求日志；汇总、序列与日志 MUST 共用时间窗口并拒绝超过 90 天的跨度；汇总与序列 MUST 支持成员/厂商/账号过滤，汇总行 MUST 带显示名称并按 key 升序（`null` 最后），日志 MUST 带成员与账号名称、支持时间与错误码过滤并返回匹配总数；`provider='auto'` MUST 有显示名「自动路由」；日志 MUST NOT 返回 OCR 原文与凭证。`[spec-review-amendment R-06/R-11/R-12/R-52]`\n\n#### Scenario: 按厂商汇总\n- **WHEN** 调用 `/usage/summary?group_by=provider`\n- **THEN** 返回每个厂商的成功、失败、缓存命中计数与平均延迟\n\n#### Scenario: 平均延迟口径\n- **WHEN** 汇总或序列范围内同时存在成功与失败事件\n- **THEN** 平均延迟为该范围内全部事件 `latency_ms` 的整数均值（含失败事件），无事件时为 `null`\n\n#### Scenario: 汇总显示名称\n- **WHEN** 汇总按成员或账号分组\n- **THEN** 每行包含可显示的名称；对应实体已删除时为 `null`\n\n#### Scenario: 已删除实体分组\n- **WHEN** 汇总范围内同时存在有效成员与已删除成员\n- **THEN** 已删除成员合并为 `key=null` 的单行，排序在有效 key 之后，label 为 `null`\n\n#### Scenario: 自动路由失败\n- **WHEN** `provider=auto` 的请求因无候选失败\n- **THEN** 汇总中 `auto` 行 label 为「自动路由」，总览 `today.auto_failures` 加一\n\n#### Scenario: 汇总跨度上限\n- **WHEN** 汇总请求的时间跨度超过 90 天\n- **THEN** 返回 400 `BAD_REQUEST`\n\n#### Scenario: 默认窗口\n- **WHEN** 未传 `from/to` 请求序列\n- **THEN** 返回 7 个本地日桶（含今日）\n\n#### Scenario: 日序列\n- **WHEN** 调用 `/usage/series?from=2026-10-29\u0026to=2026-11-04`\n- **THEN** 返回按 `Asia/Shanghai` 日分桶的序列，缺失日期补零，且包含 `2026-11-04` 当日\n\n#### Scenario: 仅日期结束值含当日\n- **WHEN** `to` 只给 `YYYY-MM-DD` 形式\n- **THEN** 该参数被解释为该本地日的结束，筛选结果包含当日事件\n\n#### Scenario: 日期边界\n- **WHEN** 事件时间恰好是 `to` 次日的本地 00:00:00\n- **THEN** 该事件不计入本次筛选（半开区间）\n\n#### Scenario: 时间范围倒置\n- **WHEN** `from` 晚于 `to`\n- **THEN** 返回 400 `BAD_REQUEST`\n\n#### Scenario: 序列跨度上限\n- **WHEN** 序列请求的时间跨度超过 90 天\n- **THEN** 返回 400 `BAD_REQUEST`\n\n#### Scenario: 日志分页\n- **WHEN** 调用 `/logs?limit=50\u0026offset=50`\n- **THEN** 返回第二页、不超过 50 条，并返回匹配总数\n\n#### Scenario: 日志过滤\n- **WHEN** 调用 `/logs?success=false\u0026provider=tencent\u0026error_code=TIMEOUT`\n- **THEN** 只返回同时满足三个条件的记录\n\n#### Scenario: 日志显示名称\n- **WHEN** 日志行对应的成员或账号存在\n- **THEN** 返回 `user_name` 与 `account_name`；实体已删除时为 `null`\n\n#### Scenario: 非法时间\n- **WHEN** 传入无法解析的 `from` 或 `to`\n- **THEN** 返回 400 `BAD_REQUEST`\n\n## ADDED Requirements\n\n### Requirement: R-ADM-08 运行时设置读写\n\n管理员 SHALL 能读取与部分更新运行时设置：缓存开关、缓存 TTL、缓存容量、请求总预算、账号默认超时；更新 MUST 校验类型与范围，显式 `null` MUST 返回 400，校验错误 MUST 含字段名；提交成功后 MUST 对后续请求生效；缓存参数变化 MUST 清空现有缓存并在响应中标记；只读项 MUST 包含鉴权状态、版本、上传限制、并发上限、会话时长与面板产物状态。`[spec-review-amendment R-05/R-15]`\n\n#### Scenario: 读取设置\n- **WHEN** 调用 `GET /api/admin/settings`\n- **THEN** 返回可编辑项与只读项，值为当前生效值\n\n#### Scenario: 部分更新\n- **WHEN** 只提交 `cache_ttl_seconds`\n- **THEN** 其余设置保持不变，重启后新值仍生效\n\n#### Scenario: 非法值\n- **WHEN** 提交超出范围的缓存 TTL 或非整数\n- **THEN** 返回 400 `BAD_REQUEST`，`error.fields` 含字段名，设置与运行时均不变\n\n#### Scenario: 显式 null\n- **WHEN** 提交 `{\"cache_ttl_seconds\": null}`\n- **THEN** 返回 400 `BAD_REQUEST`，不把 null 当作未提供\n\n#### Scenario: 容量与预算上限\n- **WHEN** 提交 `cache_max_entries=2001` 或 `request_deadline_ms=20001`\n- **THEN** 返回 400 `BAD_REQUEST`\n\n#### Scenario: 未知键\n- **WHEN** 提交未被定义的设置键\n- **THEN** 返回 400 `BAD_REQUEST`，不静默忽略\n\n#### Scenario: 缓存参数变更\n- **WHEN** 修改缓存开关、TTL 或容量并保存\n- **THEN** 响应标记缓存已清空，缓存条目归零\n\n#### Scenario: 请求预算生效\n- **WHEN** 把请求总预算改为更小值并保存\n- **THEN** 后续 OCR 请求使用新的总预算\n\n#### Scenario: 账号默认超时生效\n- **WHEN** 修改账号默认超时后创建未显式指定超时的账号\n- **THEN** 新账号使用新的默认超时\n\n### Requirement: R-ADM-09 总览聚合\n\n管理员 SHALL 能获取总览数据：今日请求、成功、失败、缓存命中、配额用量、成功率、缓存命中率、平均延迟，近 7 个本地日的序列，各厂商账号数与可用账号数，账号配额用量，最近 10 条错误与缓存状态；今日 MUST 按 `Asia/Shanghai` 自然日计算；无请求时比率 MUST 为空值而不是 0；`available_accounts` MUST 表示瞬时可调度数；`provider='auto'` 的失败 MUST 单独计数。`[spec-review-amendment R-09/R-21/R-52]`\n\n#### Scenario: 有数据的总览\n- **WHEN** 今日存在成功与失败请求\n- **THEN** 各计数、成功率、缓存命中率与平均延迟为非空值\n\n#### Scenario: 无请求的总览\n- **WHEN** 今日没有请求\n- **THEN** 计数为 0，成功率、缓存命中率与平均延迟为 `null`\n\n#### Scenario: 可用账号数\n- **WHEN** 某厂商账号被禁用、冷却或配额耗尽\n- **THEN** 该厂商的可用账号数不包含这些账号\n\n#### Scenario: 可用账号数的瞬时口径\n- **WHEN** 账号并发已满或令牌桶暂时为空\n- **THEN** 该账号也暂不计入 `available_accounts`；GET 不改变账号状态\n\n#### Scenario: 近 7 日序列\n- **WHEN** 请求总览\n- **THEN** 响应包含 7 个本地日桶的序列\n\n#### Scenario: 自动路由失败计数\n- **WHEN** 今日存在 `provider=auto` 的失败事件\n- **THEN** `today.auto_failures` 计入这些事件，厂商行不重复计入\n\n#### Scenario: 最近错误\n- **WHEN** 存在超过 10 条失败记录\n- **THEN** 只返回最近 10 条，包含账号名称，且不含 OCR 原文与凭证\n\n### Requirement: R-ADM-10 账号列表用量与归属\n\n账号列表 SHALL 返回每个账号的贡献者名称、当前日/月/总量周期的已用配额、限额与周期键；已用值 MUST 与调度使用的配额计数一致，限额为空时 MUST 返回 `null`。`[spec-review-amendment R-07]`\n\n#### Scenario: 成功请求后用量增加\n- **WHEN** 账号成功完成一次 OCR 请求\n- **THEN** 该账号的日/月/总量已用值各增加 1\n\n#### Scenario: 贡献者名称\n- **WHEN** 账号有贡献者成员\n- **THEN** 列表返回 `owner_name`；贡献者已删除时为 `null`\n\n#### Scenario: 未配置限额\n- **WHEN** 账号未配置日/月/总量限额\n- **THEN** 对应 `limit` 为 `null`，已用值仍返回\n\n#### Scenario: 周期切换\n- **WHEN** 跨过 `Asia/Shanghai` 的日重置点\n- **THEN** 日已用值从 0 开始，月与总量保持不变\n\n#### Scenario: 删除账号清理配额\n- **WHEN** 删除一个有已用配额的账号，再等待两个 flush 周期并创建新账号\n- **THEN** 不出现外键错误，新账号的已用值为 0\n"},{"label":"spec:admin-panel","path":"openspec/changes/m3-admin-panel/specs/admin-panel/spec.md","text":"# Spec Delta\n\n## Purpose\n\n管理面板的浏览器行为与交付边界：管理员通过同源 SPA 登录并完成日常运营操作，静态资源由网关托管并受安全响应头保护。\n\n## ADDED Requirements\n\n### Requirement: R-PANEL-01 登录与会话\n\n面板 SHALL 提供管理员密码登录；登录成功后进入总览并保持会话，刷新页面不丢失登录态；未认证访问受保护路由 MUST 跳转登录；登出 MUST 清除会话并回到登录页。\n\n#### Scenario: 登录成功\n- **WHEN** 管理员在登录页提交正确密码\n- **THEN** 进入总览页，顶栏显示管理员身份\n\n#### Scenario: 刷新保持登录\n- **WHEN** 已登录管理员的页面刷新\n- **THEN** 仍停留在原页面，不跳转登录\n\n#### Scenario: 未认证访问\n- **WHEN** 未登录时直接访问 `/accounts`\n- **THEN** 跳转到登录页\n\n#### Scenario: 登出\n- **WHEN** 管理员点击登出\n- **THEN** 回到登录页，浏览器后退不能恢复已登录页面\n\n### Requirement: R-PANEL-02 路由与导航\n\n面板 SHALL 提供登录、总览、账号、成员与 Key、用量、日志、设置七个路由；受保护路由共享侧栏与顶栏导航；未知路径 MUST 显示 404 页面并可返回总览。\n\n#### Scenario: 七个路由可达\n- **WHEN** 管理员依次访问七个路由\n- **THEN** 每个路由渲染对应页面且无控制台错误\n\n#### Scenario: 未知路径\n- **WHEN** 访问不存在的面板路径\n- **THEN** 显示 404 页面，提供返回总览的入口\n\n#### Scenario: 窄屏导航\n- **WHEN** 视口宽度小于 768px\n- **THEN** 侧栏收起为顶部抽屉，当前页面仍可到达全部导航项\n\n### Requirement: R-PANEL-03 总览\n\n总览 SHALL 显示今日请求数、成功率、缓存命中率、平均延迟、各厂商可用账号、账号配额进度与最近错误；无数据时 MUST 显示空态而不是空白区域。\n\n#### Scenario: 有数据的今日指标\n- **WHEN** 今日存在请求记录\n- **THEN** 四项今日指标显示非空数值\n\n#### Scenario: 无数据的空态\n- **WHEN** 今日没有请求记录\n- **THEN** 指标显示 0 或「—」，并提供去用量页查看历史的入口\n\n#### Scenario: 最近错误\n- **WHEN** 存在失败请求\n- **THEN** 最近错误列表显示时间、厂商、账号、错误码与耗时，不含 OCR 原文\n\n### Requirement: R-PANEL-04 账号管理界面\n\n账号页 SHALL 列表展示厂商、名称、贡献者、优先级、配额、状态、EWMA 延迟与最近错误，并支持新建、编辑、测活、重置状态、启用/禁用与删除；凭证字段 MUST 按厂商渲染，编辑时 MUST NOT 回填明文；编辑时超时留空 MUST 省略字段而不是提交 `null`。`[spec-review-amendment R-14]`\n\n#### Scenario: 新建账号\n- **WHEN** 管理员选择厂商并填写该厂商全部必填凭证\n- **THEN** 账号创建成功并出现在列表中，列表只显示脱敏凭证\n\n#### Scenario: 编辑时保留凭证\n- **WHEN** 管理员编辑账号但凭证字段留空\n- **THEN** 保存后原凭证仍可用，测活成功\n\n#### Scenario: 编辑时超时留空\n- **WHEN** 管理员编辑账号且超时字段留空\n- **THEN** 提交省略该字段，原超时保持不变，不发送 `null`\n\n#### Scenario: 测活结果\n- **WHEN** 管理员点击测活\n- **THEN** 显示识别文本与耗时；失败时显示错误码与消息，且不产生用量记录\n\n#### Scenario: 未配置额度提示\n- **WHEN** 账号的日/月/总量限额全部为空\n- **THEN** 配额列显示「未配置额度，可能超用」提示，不显示为额度已满\n\n#### Scenario: 重置状态确认\n- **WHEN** 管理员点击重置状态\n- **THEN** 确认框说明会同时清零该账号的配额计数；确认后状态恢复为 `active` 且用量从 0 开始\n\n#### Scenario: 删除确认\n- **WHEN** 管理员删除账号\n- **THEN** 先出现确认对话框，确认后账号从列表移除\n\n### Requirement: R-PANEL-05 成员与 Key 界面\n\n成员与 Key 页 SHALL 支持创建、启用/禁用、删除成员，以及为成员创建 Key、设置日限额与 RPM、启用/吊销 Key；创建 Key 的明文 MUST 只在创建成功时显示一次，之后列表只显示前缀。\n\n#### Scenario: 创建成员\n- **WHEN** 管理员提交新的成员名称\n- **THEN** 成员出现在列表，并可为其创建 Key\n\n#### Scenario: Key 明文只显示一次\n- **WHEN** 管理员创建 Key 后关闭成功对话框并刷新列表\n- **THEN** 列表不显示明文，只显示前缀\n\n#### Scenario: 删除成员提示级联\n- **WHEN** 管理员删除仍有 Key 的成员\n- **THEN** 确认对话框说明其 Key 会一并吊销\n\n#### Scenario: 吊销 Key\n- **WHEN** 管理员吊销某个 Key\n- **THEN** 该 Key 立即从「启用」变为不可用状态展示\n\n### Requirement: R-PANEL-06 用量界面\n\n用量页 SHALL 支持按时间范围、成员、厂商、账号筛选，切换请求数、成功率、平均延迟三种视图，显示折线图与汇总表，汇总表 MUST 支持按成员/厂商/账号分组切换，并支持把当前筛选结果导出为 CSV；筛选条件 MUST 反映在 URL 中。\n\n#### Scenario: 筛选与 URL\n- **WHEN** 管理员修改时间范围或厂商筛选\n- **THEN** 图表与表格更新，URL query 同步变化，刷新后筛选保持\n\n#### Scenario: 空范围\n- **WHEN** 所选范围内没有请求\n- **THEN** 图表区显示「所选时间内没有请求」的空态\n\n#### Scenario: CSV 导出\n- **WHEN** 管理员点击导出\n- **THEN** 下载的 CSV 行与当前汇总表一致，包含表头与筛选后的数据\n\n### Requirement: R-PANEL-07 日志界面\n\n日志页 SHALL 支持按时间、成功/失败、厂商、错误码筛选并分页；列表显示时间、request_id、成员、厂商、账号、耗时、状态与错误码；详情 MUST NOT 展示 OCR 原文或凭证。\n\n#### Scenario: 筛选与分页\n- **WHEN** 管理员选择失败状态并翻到第二页\n- **THEN** 列表只显示失败记录，分页位置与 URL 同步\n\n#### Scenario: 详情不含原文\n- **WHEN** 管理员打开一条日志详情\n- **THEN** 只显示元数据与错误码，不显示 OCR 原文或凭证\n\n#### Scenario: 空结果\n- **WHEN** 筛选条件没有匹配记录\n- **THEN** 显示空态与清除筛选的入口\n\n#### Scenario: 时间按本地时区显示\n- **WHEN** 管理员查看日志或账号的最近使用时间\n- **THEN** 时间按 `Asia/Shanghai` 展示，服务端的 UTC naive 时间不被当作浏览器本地时间\n\n### Requirement: R-PANEL-08 设置界面\n\n设置页 SHALL 分可编辑区与只读区：可编辑缓存开关、缓存 TTL、缓存容量、请求总预算、账号默认超时；只读展示鉴权状态、版本、上传限制、并发上限与会话时长；页面 MUST 展示配额模板与「以官网为准」免责声明。\n\n#### Scenario: 保存合法设置\n- **WHEN** 管理员把缓存 TTL 改为合法值并保存\n- **THEN** 保存成功，刷新页面后显示新值\n\n#### Scenario: 非法值\n- **WHEN** 管理员提交超出范围的值\n- **THEN** 字段显示错误，保存被阻止，原设置不变\n\n#### Scenario: 缓存参数变更提示\n- **WHEN** 管理员修改缓存开关、TTL 或容量并保存\n- **THEN** 成功提示说明现有缓存已清空\n\n#### Scenario: 清空缓存\n- **WHEN** 管理员点击清空缓存并确认\n- **THEN** 页面提示已清除的条数，缓存条目归零\n\n#### Scenario: 只读区\n- **WHEN** 管理员查看设置页\n- **THEN** 鉴权状态显示为强制开启，版本、上传限制、并发与会话时长可见\n\n### Requirement: R-PANEL-09 三态与重复提交\n\n每个数据视图 SHALL 具备加载、空、错误三种状态；写操作提交期间 MUST 禁用按钮并防止重复触发；请求超时或网络失败 MUST 给出可恢复的错误提示。\n\n#### Scenario: 加载态\n- **WHEN** 页面数据尚未返回\n- **THEN** 显示与最终内容同高的骨架，不出现布局跳动\n\n#### Scenario: 请求失败\n- **WHEN** 数据请求返回错误\n- **THEN** 显示错误说明与重试按钮，点击重试重新请求\n\n#### Scenario: 双击提交\n- **WHEN** 管理员快速双击保存按钮\n- **THEN** 只发出一次写请求，按钮在请求期间禁用\n\n### Requirement: R-PANEL-10 视觉与响应式\n\n面板 SHALL 使用浅色单主题与深墨蓝主色，采用发丝线分隔、留白与少量圆角，MUST NOT 使用渐变、卡片投影或装饰性背景；状态 MUST 以圆点加文字表达；配额进度 MUST 以带刻度标尺呈现；窄屏 MUST 保持可用。\n\n#### Scenario: 桌面布局\n- **WHEN** 视口宽度不小于 1280px\n- **THEN** 显示左侧导航、顶栏与内容区，表格数字右对齐\n\n#### Scenario: 窄屏表格\n- **WHEN** 视口宽度小于 768px\n- **THEN** 表格横向滚动且关键列仍可读，页面不出现横向溢出\n\n#### Scenario: 减少动效\n- **WHEN** 系统启用 `prefers-reduced-motion`\n- **THEN** 页面过渡与动效被关闭\n\n#### Scenario: 可读性\n- **WHEN** 检查正文、次要文字与状态\n- **THEN** 文字对比度不低于 4.5:1，状态不单独依赖颜色表达\n\n### Requirement: R-PANEL-11 同源托管与回退\n\n网关 SHALL 在面板构建产物存在时同源托管 SPA 与静态资源；对非 API 且无文件扩展名的未知路径 MUST 回退到入口 HTML；对 `/api/*`、`/v1/*`、`/healthz` 的未知路径 MUST 返回 JSON 404，不得被回退吞掉；非 API 但带扩展名且文件不存在的请求 MUST 返回 404 JSON，不得回退成 HTML；产物缺失时 MUST 明确提示且不影响公共与管理 API。`[spec-review-amendment R-13]`\n\n#### Scenario: 根路径\n- **WHEN** 构建产物存在且访问 `/`\n- **THEN** 返回面板入口 HTML\n\n#### Scenario: 深链接刷新\n- **WHEN** 管理员直接访问 `/accounts` 并刷新\n- **THEN** 返回入口 HTML，面板路由渲染账号页\n\n#### Scenario: API 404 不被吞\n- **WHEN** 访问不存在的 `/api/admin/not-exist`\n- **THEN** 返回 JSON 404，而不是入口 HTML\n\n#### Scenario: 缺失静态资源\n- **WHEN** 访问不存在的 `/assets/not-exist.js`\n- **THEN** 返回 404 JSON，不返回入口 HTML\n\n#### Scenario: 深链接入口\n- **WHEN** 访问 `/accounts` 且构建产物存在\n- **THEN** 返回入口 HTML\n\n#### Scenario: 产物缺失\n- **WHEN** 构建产物不存在且访问 `/`\n- **THEN** 返回明确的未构建提示，`/healthz` 与 `/v1/ocr/image` 仍正常\n\n### Requirement: R-PANEL-12 前端安全与数据最小化\n\n面板 MUST NOT 把管理员 token、账号凭证或 API Key 明文写入 localStorage、sessionStorage 或 URL；登录后的写请求 MUST 携带 CSRF 头；面板入口、静态资源与所有返回入口 HTML 的深链接响应 MUST 带 CSP，所有响应 MUST 带 `X-Content-Type-Options`、`Referrer-Policy` 与 frame 限制头；CSP MUST NOT 允许内联脚本，且 MUST NOT 阻断既有 `/docs`。`[spec-review-amendment R-36]`\n\n#### Scenario: 不持久化敏感值\n- **WHEN** 管理员登录并创建 Key\n- **THEN** 浏览器持久化存储中不存在管理员 token、凭证或 Key 明文\n\n#### Scenario: 写请求带 CSRF\n- **WHEN** 面板发起创建、修改或删除请求\n- **THEN** 请求包含与 CSRF cookie 一致的 `X-CSRF-Token`\n\n#### Scenario: 安全响应头\n- **WHEN** 请求面板入口或任意返回入口 HTML 的深链接\n- **THEN** 响应包含 CSP、`X-Content-Type-Options: nosniff`、`Referrer-Policy` 与 frame 限制头\n\n#### Scenario: API 安全头\n- **WHEN** 请求管理 API\n- **THEN** 响应包含 `X-Content-Type-Options: nosniff`、`Referrer-Policy` 与 frame 限制头\n\n#### Scenario: 文档页不被阻断\n- **WHEN** 浏览器打开 `/docs`\n- **THEN** Swagger UI 正常加载，不被 CSP 拦截\n\n#### Scenario: 内联脚本被禁\n- **WHEN** 检查面板 CSP 的 `script-src`\n- **THEN** 不包含 `'unsafe-inline'`\n"},{"label":"spec:deployment","path":"openspec/changes/m3-admin-panel/specs/deployment/spec.md","text":"# Spec Delta\n\n## MODIFIED Requirements\n\n### Requirement: R-DEP-07 构建可复现且索引可参数化\n\n镜像构建 SHALL 安装锁文件锁定的 Python 与前端依赖版本，并 SHALL 允许通过参数分别指定 PyPI 与 npm 包索引；构建 MUST NOT 依赖锁文件中记录的默认下载地址可达。\n\n#### Scenario: 离线环境构建成功\n- **WHEN** 默认 Python 包索引不可达，但参数指定的索引可达\n- **THEN** 构建成功，且安装的依赖版本与锁文件一致\n\n#### Scenario: npm 索引可参数化\n- **WHEN** 默认 npm 源不可达，但参数指定的 npm 索引可达\n- **THEN** 前端依赖安装与构建成功，且版本与前端锁文件一致\n\n#### Scenario: 无可达索引\n- **WHEN** 未指定索引且默认索引不可达\n- **THEN** 构建失败，不产出可用镜像\n\n## ADDED Requirements\n\n### Requirement: R-DEP-09 面板产物随镜像交付\n\n运行镜像 SHALL 包含当前版本的前端构建产物，构建 MUST NOT 依赖宿主机预装 Node 或宿主机预先构建的产物；产物 MUST NOT 包含任何凭证或 Key 明文。`[spec-review-amendment R-01]`\n\n#### Scenario: 镜像内构建\n- **WHEN** 在干净检出上执行镜像构建\n- **THEN** 构建阶段产出前端资源并复制进运行镜像，无需宿主机 Node\n\n#### Scenario: 镜像托管面板\n- **WHEN** 新镜像启动且请求 `/`\n- **THEN** 返回面板入口 HTML，静态资源请求返回 200\n\n#### Scenario: 产物不含敏感值\n- **WHEN** 扫描前端构建产物\n- **THEN** 不含 `MASTER_KEY`、`ADMIN_PASSWORD`、账号凭证或 API Key 的任何取值\n\n#### Scenario: 回滚镜像\n- **WHEN** 回滚到不含面板产物的旧镜像\n- **THEN** 先把数据库恢复到与旧镜像匹配的 schema 版本（部署前备份或显式 `alembic downgrade`），旧镜像启动后公共与管理 API 仍正常，`/` 返回 404（旧镜像没有面板路由）\n\n## ADDED Requirements\n\n### Requirement: R-DEP-10 发布版本与回滚锚\n\n发布镜像的版本 tag SHALL 不可变；新版本 MUST 使用新 tag，MUST NOT 覆盖既有发布 tag；回滚 MUST 同时恢复与目标镜像匹配的数据库 schema 版本（部署前备份或显式 downgrade）。`[spec-review-amendment R-01]`\n\n#### Scenario: 新版本不覆盖旧 tag\n- **WHEN** 发布 `0.2.0`\n- **THEN** `0.1.0` tag 仍指向旧镜像\n\n#### Scenario: 回滚到 0.1.0\n- **WHEN** 数据库已升级到 `0002` 后回滚到 `0.1.0`\n- **THEN** 先恢复部署前备份（或执行 `downgrade`）再启动旧镜像，`/healthz` 返回 200\n"},{"label":"spec:result-cache","path":"openspec/changes/m3-admin-panel/specs/result-cache/spec.md","text":"# Spec Delta\n\n## MODIFIED Requirements\n\n### Requirement: R-CAC-02 缓存边界\n\n缓存 SHALL 仅保存成功且 `text` 非空、单条 ≤256KB 的结果；容量默认 1000 条、TTL 默认 3600 秒；容量与 TTL MUST 可经管理端运行时设置覆盖（容量 10–2000 条、TTL 60–86400 秒），参数变更 MUST 清空现有缓存；MUST 为进程内存储，重启即失效。`[spec-review-amendment R-50]`\n\n#### Scenario: 空文本不缓存\n- **WHEN** 厂商成功返回空文本\n- **THEN** 结果不写入缓存\n\n#### Scenario: 容量淘汰\n- **WHEN** 已缓存 1000 条后再写入新结果\n- **THEN** 按 LRU 淘汰最旧条目，容量不超过上限\n\n#### Scenario: 运行时参数变更\n- **WHEN** 管理员把 TTL 或容量改为新值并保存\n- **THEN** 缓存被清空，后续请求使用新参数\n"},{"label":"tasks","path":"openspec/changes/m3-admin-panel/tasks.md","text":"# Tasks\n\n\u003e 本表已按 `spec-review-report.md` 的 amendment 更新；与评审起点 `33a0d61` 的差异见报告 Amendments 节。`[spec-review-amendment]`\n\n## 1. 后端鉴权、安全头与托管骨架\n\n- [ ] 1.1 实现管理端双轨鉴权：登录设置会话/CSRF cookie，`require_admin` 接受 Bearer 或 cookie，cookie 写方法校验 `X-CSRF-Token`，`/me` 返回并补发 CSRF，`/logout` 清 cookie；用 `HTTPBearer(auto_error=False)` 声明 security scheme；验证新增 pytest 覆盖 cookie GET、缺/错 CSRF 403、正确 CSRF 成功、Bearer 豁免、Bearer 无效不回退 cookie、登出后 401、cookie 属性（HttpOnly/Secure/CSRF 可读）、`/me` 补发 CSRF、`/docs` OpenAPI 有 Bearer scheme。\n  - R-ID: R-ADM-01\n- [ ] 1.2 实现安全响应头中间件（面板入口/静态资源/深链接 index CSP；所有响应 `X-Content-Type-Options`、`Referrer-Policy`、`X-Frame-Options`、`Permissions-Policy`；管理 API `Cache-Control: no-store`）；中间件必须在 `BodyLimitMiddleware` 之后 add（最外层）；验证 `/healthz`、面板入口、`/accounts` 深链接、`/api/admin/login`、超大 body 的 400 响应头断言通过，CSP `script-src` 不含 `'unsafe-inline'`，`/docs` 不被 CSP 阻断。\n  - R-ID: R-PANEL-12\n- [ ] 1.3 实现静态托管骨架：产物存在时托管 `/assets` 与非 API 无扩展名路径回退 `index.html`，带扩展名的缺失文件返回 JSON 404；`index.html` no-store、assets immutable，API 未知路径保持 JSON 404，产物缺失时 `/` 返回明确 404（`FRONTEND_NOT_BUILT`）；验证用临时 dist 目录的 pytest 覆盖六种情况（含缺失 JS 不回退 HTML、路径穿越）。\n  - R-ID: R-PANEL-11\n- [ ] 1.4 更新 `conftest` 与既有管理端测试以同时支持 Bearer 与 cookie 客户端，保证原有用例全绿；验证 `uv run --project backend pytest backend/tests/test_ticket2_admin.py` 通过。\n  - R-ID: R-ADM-01\n\n## 2. 运行时设置\n\n- [ ] 2.1 新增 `settings` 模型与 Alembic `0002`（upgrade 建表、downgrade 删表，`key TEXT PK`）；验证 `alembic upgrade head` → `downgrade -1` → `upgrade head` 往返成功，列名/类型/约束与 design 的 v_new 一致。\n  - R-ID: R-ADM-08\n- [ ] 2.2 实现 `RuntimeSettings` 加载与合并（env 默认 + DB 覆盖、非法存量回退并 warning），在启动时接入 `AppState`；验证单测覆盖默认值、DB 覆盖、非法值回退。\n  - R-ID: R-ADM-08\n- [ ] 2.3 实现 `ResultCache.reconfigure(enabled, max_entries, ttl_seconds)`、`Scheduler` 接收 public 计算好的绝对 deadline、`public.py` 外层从 `RuntimeSettings` 读取预算、账号创建默认超时取运行时设置；验证单测覆盖缓存重建清空、预算调大/调小都改变总耗时、未显式超时的账号使用新默认值。\n  - R-ID: R-ADM-08\n- [ ] 2.4 实现 `GET/PUT /api/admin/settings`（部分更新、范围校验、未知键 400、显式 null 400、字段级 `error.fields`、单事务 upsert、提交后应用、`cache_cleared`）；验证 pytest 覆盖读取、部分更新、重启后保持、非法值 400（含字段名）、未知键 400、显式 null 400、DB 写失败 500（注入）、缓存参数变更后条目归零、并发 PUT 后 DB/runtime/重启值一致，并记录本机 PUT p95 \u003c 500ms。\n  - R-ID: R-ADM-08\n\n## 3. 数据端点\n\n- [ ] 3.1 实现 `GET /api/admin/overview`（今日指标、比率、auto_failures、厂商账号/可用数、账号配额、近 7 日序列、最近 10 条错误含账号名称、缓存状态）；验证 pytest 覆盖有数据、无请求时比率与平均延迟为 null、不可用账号不计入可用数、available 的瞬时口径不触发状态迁移、最近错误含名称且不含原文、auto 失败单独计数。\n  - R-ID: R-ADM-09\n- [ ] 3.2 实现 `GET /api/admin/usage/series` 并扩展 `usage/summary`（过滤参数、`avg_latency_ms`、`label`、key 升序且 null 最后、仅日期 `to` 含当日、`from \u003e to` 400、summary 也受 90 天上限、默认 7 个日桶、`auto` label）；验证 pytest 覆盖 `Asia/Shanghai` 日分桶与补零、90 天限制 400、三种过滤、平均延迟四舍五入、日期形式 `to` 包含当日且次日 00:00 不计入、已删除实体合并 null 行、auto 失败 label、live+deleted 混合排序。\n  - R-ID: R-ADM-06\n- [ ] 3.3 扩展 `GET /api/admin/logs`（`from/to/error_code`、`total`、`user_name`、`account_name`、`from \u003e to` 400、90 天上限、`provider=auto`）；验证 pytest 覆盖组合过滤、分页 total、非法时间 400、空结果 `rows=[] total=0`、已删除实体名称为 null、日期形式 `to` 的半开边界。\n  - R-ID: R-ADM-06\n- [ ] 3.4 扩展 `GET /api/admin/accounts` 的 `owner_name` 与 `quota_usage`（日/月/总量、限额、周期键）；验证 pytest 覆盖成功请求后三周期 +1、限额 null、跨日重置后日用量归零、贡献者删除后 owner_name 为 null、删除账号后配额清理（两个 flush 周期无 FK 错误）。\n  - R-ID: R-ADM-10\n- [ ] 3.5 加入用量/日志/汇总查询基准测试（10 万条 `usage_events`，批量插入，注册 `slow` marker 并默认 `-m \"not slow\"`；6.4 显式跑 `-m slow`），输出 p50/p95；目标序列、汇总与日志查询 p95 \u003c 300ms，结果写入 change 的验证记录。\n  - R-ID: R-ADM-06\n\n## 4. 前端骨架、设计系统与总览\n\n- [ ] 4.1 初始化 `frontend/`：Vite + React 18 + TypeScript strict + ESLint（react-hooks/jsx-a11y）+ Ta
