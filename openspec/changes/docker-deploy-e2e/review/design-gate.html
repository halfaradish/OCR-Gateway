<script type="application/json" id="sdflow-docs">[{"label":"spec-review-report","path":"openspec/changes/docker-deploy-e2e/spec-review-report.md","text":"\u003e ⚠️ **单 session 自查**：逐镜由主 session 完成；同模型、不同上下文，非独立评审。\n\u003e 报告头部记 `dispatch: single-session`（本仓无 fresh-subagent 派发能力）。\n\u003e\n\u003e 评审对象：`openspec/changes/docker-deploy-e2e/` 四件套 @ `4a9ebbf`（下称 **C1**）。\n\u003e 本报告同批 amendments 产出 **C2**；对 C2 的窄复核见 §7。\n\u003e 决策纪要机械门：`check_decision_memo.py` → `{\"ok\": true}`，exit 0。\n\n# 设计评审报告 · docker-deploy-e2e\n\n## 拍板三问\n\n\u003e 人在设计 HARD-GATE 逐项勾选；每问的自答只指回锚点，不替代人的判断。\n\n**Q-scope 范围划界认不认？**\n自答：锚 `proposal.md` `## Non-Goals`（24–31 行）+ `design.md` `## Goals / Non-Goals`（15–27 行）——范围是\n「compose 单服务 + 启动期自动迁移 + 最小加固 + 真机 E2E」；明确不做反代/TLS、多实例/Postgres、完整加固、\n业务逻辑改动；E2E 只验证既有能力，不重定义。范围自洽，未见蔓延（5 个切片落在 3–6 票预算内）。\n[ ] 认 [ ] 不认\n\n**Q-deps 依赖/顺序认不认？**\n自答：锚 `design.md` `## 切片与依赖`（95–105 行）——S1→S2→S3→S4→S5，S5 依赖 S3/S4。顺序本身合理；\n但 **S1 的构建命令有 4 个会直接打断出镜像的缺陷**（D1 `uv export` 输出 `-e .`、D2 无 venv、D3 构建期\n镜像源无通路、D14 uv 自身未安装），必须先在 tasks/ADR 修正再出票。\n[ ] 认 [ ] 不认\n\n**Q-risk 风险赌注与对策认不认？**\n自答：锚 `design.md` `## Risks / Trade-offs`（118–126 行）+ `proposal.md` `## 假设`（47–53 行）——主要赌注是\nregistry/PyPI mirror 可达（A2）与 A1「非 root + bind mount 在 Windows Docker Desktop 下权限可用」。\nA1 **只覆盖 Windows，未覆盖目标 Linux 服务器**（Q1）；90s 指标未排除首次构建（Q2）；镜像平台/发布未定义（Q3）。\n[ ] 认 [ ] 不认\n\n## 决策登记区\n\n### [自动决策]（默认采纳，人可在设计门覆盖）\n\n| ID | 决策 | 依据（主审亲验锚） |\n| --- | --- | --- |\n| **D1** | `uv export` 必须加 `--no-emit-project` | 亲验：`uv export --frozen --no-dev --format requirements-txt --no-hashes \\| head -3` → 首个依赖项行是 `-e .`；加 `--no-emit-project` 后无 `-e .`、38 个 `==` 项。tasks 1.2 的依赖层只 COPY `pyproject.toml`+`uv.lock`，`-e .` 会在无 `app/` 的层里构建失败。 |\n| **D2** | 构建期创建 `/app/.venv`（推荐）或显式 `UV_SYSTEM_PYTHON=1`；多阶段下 MUST 把 venv COPY 到运行时层，entrypoint 用 venv 内 console scripts | 亲验：无 venv 时 `uv pip install --dry-run --no-deps .` → `error: No virtual environment found; run 'uv venv' ... or pass '--system'`。`python:3.12-slim` 默认无 venv；ADR-0001 的三条命令未记录该步。多阶段构建不会自动把构建阶段的 venv 带进运行时层。 |\n| **D3** | compose 必须用 `build.args: UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-}` 传构建期镜像源 | Docker/Compose 语义：`env_file` 只注入运行期容器环境，**不会**成为构建参数；design 组件图把「镜像源」列在 `env_file` 行（design:58），tasks 3.1 的 compose 字段（tasks:34）无 `build.args` ⇒ 一键起路径在离线环境构建失败。 |\n| **D4** | `.dockerignore` 模式改为 `**/.venv`、`**/tests`、`**/data`、`**/__pycache__`、`**/.pytest_cache`、`**/.ruff_cache`、`**/.mypy_cache` | 亲验：`du -sh backend/.venv` → 150M；Docker 的 `.dockerignore` 模式相对**构建上下文根**匹配，`.venv/` 不匹配 `backend/.venv`。tasks 1.1（tasks:8）当前写法会把 150M venv 与测试送进上下文。 |\n| **D5** | 凭证扫描改为「对停止态容器/镜像层扫全文件系统 + 用 `.env` 实际值匹配」，不只 `/app` + `AKID` | tasks 1.5（tasks:16）的 `grep -rl \"AKID\\|MASTER_KEY=\" /app` 覆盖不到百度密钥（无 `AKID` 前缀），也只扫 `/app`；R-DEP-04（spec:56–68）要求「镜像内不含百度或腾讯密钥的任何取值」。注意避开 `/proc/*/environ` 的运行时假阳性。 |\n| **D6** | 验收证据不得原样粘贴 `docker compose config` 输出 | tasks 3.1/5.8 用 `docker compose config` 验证，Compose 会渲染解析后的 `MASTER_KEY`/`ADMIN_PASSWORD` 明文；改为 `docker compose config \\| grep -E 'DATA_DIR\\|restart\\|healthcheck\\|logging'` 之类的过滤输出。 |\n| **D7** | compose 增加 `stop_grace_period: 25s`（或 uvicorn `--timeout-graceful-shutdown 20`） | `REQUEST_DEADLINE_MS=20000`（`backend/app/config.py:71`）与 `httpx.Timeout`（`backend/app/main.py:69`）允许 20s 在途请求；Docker 默认 10s 后 SIGKILL，`docker compose down` 会截断在途 OCR 请求。配额最多丢 2s 是已接受 RPO，但请求被硬切不在 RPO 口径内。 |\n| **D8** | compose 日志配置显式写 `driver: json-file` | `max-size`/`max-file` 只对所选日志驱动生效；宿主机默认驱动不是 json-file 时这两项静默无效。tasks 3.4（tasks:40）只写两项。 |\n| **D9** | R-DEP-02 改为「编排以 `/healthz` 为探测入口」并引用 R-API-06，不重述状态码契约 | `specs/deployment/spec.md:28–40` 与 `openspec/specs/ocr-api/spec.md:103` 形成两个真相源；`proposal.md:63` 自己声明「端点契约仍由 R-API-06 拥有」。 |\n| **D10** | R-DEP-05 场景改为「配额计数与用量事件（`usage_events`）落在卷内；进程日志经 stdout 由容器日志驱动轮转」 | 亲验：`backend/app/logging_setup.py:26` 是 `StreamHandler(sys.stdout)`，没有文件 handler；`specs/deployment/spec.md:77–82` 写「请求日志落在挂载卷内」与代码不符/歧义；`README.md` 环境变量表把 `DATA_DIR` 描述为「SQLite 与日志目录」也不准确。 |\n| **D11** | tasks 1.3 的 `uv pip install --no-deps .` 补 `--index-url \"$UV_DEFAULT_INDEX\"` | ADR-0001 Decision 第 3 步已写 `--index-url`，tasks 1.3（tasks:12）漏了；离线环境构建后端 `hatchling` 会去默认 PyPI 拉取而失败。 |\n| **D12** | tasks 4.3 的「保留原有断言针」清单补 `uv sync` | 亲验：`backend/tests/test_ticket5_api.py:287–300` 现有断言含 `\"uv sync\"`；tasks 4.3（tasks:51）列的 10 个针不含它。若 README 备选路径仍保留 `uv sync`，断言应保留。 |\n| **D13** | compose 显式 `environment: DATABASE_URL: \"\"`；`.env.example` 保留 `DATA_DIR=./data` 并注明 compose 覆盖为 `/data` | `backend/app/config.py:89`：`DATABASE_URL` 非空时优先于 `DATA_DIR` 推导。若 `.env` 残留宿主机用的非空 `DATABASE_URL`，容器会把库写到 `/app/data`（容器层），重建即丢。tasks 4.2 的「补容器内 `DATA_DIR=/data` 说明」若被理解成改示例值，会反过来破坏 uv 备选路径。 |\n| **D14** | 构建阶段显式安装并固定 uv 版本（如 `pip install --index-url \"$UV_DEFAULT_INDEX\" uv==0.13.6`） | `python:3.12-slim` 不含 uv；design/tasks 未写 uv 从哪来。`COPY --from=ghcr.io/astral-sh/uv` 依赖 ghcr.io 可达，本机 Docker Hub 直连已不可达（C7），不能假定。固定版本同时补「构建可复现」的一环。 |\n| **D15** | tasks 1.2 落基础镜像 digest（`FROM python:3.12-slim@sha256:b18b...`） | design:93 说「固定 digest」，tasks 1.2 只写 tag；不落 digest 则 R-DEP-07 的可复现性少一环。 |\n| **D16** | design Open Questions 补 owner/截止，并注明 `tickets.md` 由 ship 出票阶段生成 | design:145 的 tag 问题无负责人/截止（BASE-15），且「可延后」与同句「当前按 0.1.0+latest 双打」自相矛盾；design:97 引用 `tickets.md`，该文件当前不存在（由 `/sdflow-lite-ship` 生成）。 |\n| **D17** | 决策纪要「无 TG-23 命中」的偏差只记录、不改 memo | memo:48 称「本次无 TG-23 命中」，但 D1/D3/D4/D5 都记录了 ≥2 候选，按 BASE-12 属 TG-23 命中。memo 的 `decision_hash` 由 `check_decision_memo.py` 按正文重算，直接编辑会使机械门失败；建议后续 change 重跑 memo 时补三镜/主次判定，本 change 不阻塞。 |\n| **D18** | proposal Impact 的 `.dockerignore` 清单补 `docs/` | proposal:12 列了 `.venv`、`data/`、`tests/`、`openspec/`，漏了 `docs/`；`docs/已开通的 OCR 服务信息.md` 是本地真实凭证文档（`.git/info/exclude` 末行），design:89 与 tasks 1.1 都已要求排除，proposal 应与之一致。 |\n| **D19** | proposal Compliance 补一句第三方数据声明 | BASE-21 要求显式声明「数据是否发往第三方 + 脱敏策略」；现 proposal:33–39 只写 C7（不落 OCR 原文）。补：图片发往百度/腾讯属既有产品行为，本 change 不改变；E2E 用公网样例图，不含 PII。 |\n| **D20** | 为无对应验证任务的场景补注释或显式接受 | R-DEP-07 负向（无索引→构建失败）、R-DEP-02 DB 不可用→503、R-DEP-08 日志实际轮转，均无对应验证任务（tasks 1.2/3.2/3.4 只验正向或配置存在）。至少在测试覆盖图里标注「配置级验证，接受」。 |\n| **D21** | README 新 quickstart 补 TTHW 推导（步骤/命令数 + 每步耗时假设 + 标注「估算」） | DX-01 触发：本 change 重写首次上手路径。现 README「约 5 分钟」是裸数字无推导；tasks 4.1 未要求补推导。 |\n| **D22** | README 注明 uv 备选路径的前置条件（PyPI 可达；离线时需 `UV_DEFAULT_INDEX` 且可能改写 `uv.lock`） | 本机 `pypi.org` 不可达（proposal:5）；`uv sync --frozen` 因锁文件 URL 失败（ADR-0001）。备选路径若不在文档里写清前置，读者会重复踩坑。 |\n| **D23** | proposal Non-Goal「不覆盖 `TRUST_PROXY_HEADERS=true` 真机路径」补可证伪假设 | BASE-13 要求每条 defer 附可证伪假设；该条只有「已有 mock 测试」的理由。补：若上线后发现反代场景必须真机验收才能确认登录限速 IP 识别，则证伪。 |\n\n### [需拍板]（设计门逐项勾选）\n\n#### Q1 · 非 root + bind mount 的 `/data` 权限模型\n\n- **事实**：design:90 要求「非 root 用户运行；`/data` 目录归属该用户」；tasks 3.3 要求 `docker compose exec ocr-gateway id -u` 不为 0 且迁移/刷盘无权限错误；compose 用 bind mount `./data:/data`（tasks:34）。\n- **为什么会在目标态爆炸**：镜像构建期的 `chown /data` **不作用于宿主 bind mount 目录**。Linux 上 `./data` 由 Docker 以 root:root 创建（或由宿主用户拥有），容器内 uid 10001 迁移时 EACCES → fail-fast 重启循环。Windows Docker Desktop 的权限映射较宽松，**本机验收可能绿，而「搬到任意 Linux 服务器」（D1 的理由）失败**——这正是「现状不能给目标松绑」。\n- **选项**：\n  - **A（推荐）** entrypoint 以 root 启动 → `chown -R app:app /data` → `exec setpriv --reuid=app --regid=app --init-groups uvicorn ...`。系统镜：需 root 启动 + `setpriv`（debian slim 的 util-linux 自带）；可回退。用户镜：行为不变。开发循环镜：entrypoint 多 2 行，`id -u` 在降权后验证。\n  - **B** 命名卷 `ocr-data:/data`。Docker 用镜像内 `/data` 的属主初始化新卷，权限天然正确；代价是备份要 `docker cp`/进容器，与 README 的 `sqlite3 data/...` 习惯不一致（design 已因备份选 bind）。\n  - **C** 文档要求宿主 `sudo chown -R 10001:10001 ./data`（或 compose `user: \"${UID}:${GID}\"`）。零镜像改动，但「一键起」多一步手工，Windows 无 uid。\n- **主次判定**：系统镜（目标 Linux 可搬迁）\u003e 开发循环镜（entrypoint 复杂度）\u003e 用户镜（备份习惯）⇒ 推荐 A；若人更看重备份习惯，选 C + 文档。\n- **推荐未亲验**：Linux 侧行为未在本机实测（Windows 只能验 Windows 映射）；依据是 Docker bind mount 语义 + tasks 3.3 文本。\n- **拍板**：`[ ] A  [ ] B  [ ] C`\n\n#### Q2 · 90s 冷启动指标是否排除首次镜像构建\n\n- **事实**：proposal:20「干净 checkout 上 … `docker compose up -d` 后 ≤90s 内 `/healthz` 返回 200」；tasks 5.1「清空 `data/` 后 `docker compose up -d` 到 `healthy` 的总耗时 ≤90s」。\n- **问题**：镜像未构建时 `docker compose up -d` 会先构建（38 个依赖包 + 镜像层，分钟级），90s 不可满足；若镜像已构建，90s 是合理口径。两种解读产出**实质不同的验收产物**。\n- **选项**：A（推荐）明确「镜像已构建」前提，冷启动 ≤90s；首次构建单列（建议 ≤10min 或只记录不设上限）。B 把构建纳入 90s（不可行）。C 取消 90s，只记录实测。\n- **主次判定**：系统镜（指标可判定）\u003e 用户镜（首次体验）\u003e 开发循环镜（验收脚本）⇒ 推荐 A。\n- **拍板**：`[ ] A  [ ] B  [ ] C`\n\n#### Q3 · 镜像目标平台 / 命名 / 发布\n\n- **事实**：本 change 产出容器镜像（BE-10 触发）；design:145 说 tag「当前按 `0.1.0` + `latest` 双打」，但 tasks 无任何 tag/publish/平台任务；本机 daemon `os=linux arch=x86_64`（C7）。\n- **问题**：不定义平台，「搬到任意 Linux 服务器」对 arm64 不成立；不定义命名/tag，出票后无法验收「镜像可回滚」（design:141 说回滚靠固定 tag，但无任务产出 tag）。\n- **选项**：A（推荐）只支持 `linux/amd64`，镜像名 `ocr-gateway:0.1.0` + `latest`，不发布 registry，arm64 作为 non-goal。B buildx 多架构（amd64+arm64），代价：构建时间翻倍、需 QEMU，超出「一键起」。C 发布到 registry（需命名空间/凭证），本次不做。\n- **主次判定**：系统镜（可搬迁范围）\u003e 开发循环镜（构建复杂度）\u003e 用户镜（服务器架构）⇒ 推荐 A。\n- **拍板**：`[ ] A  [ ] B  [ ] C`\n\n### [已裁掉]（原始发现 + 裁掉理由，供复核「裁得对不对」）\n\n| ID | 原始发现 | 裁掉理由 |\n| --- | --- | --- |\n| **X1** | 场景未覆盖「迁移中途失败后的卷状态」（BASE-01 边界） | Alembic 在 SQLite 上单事务执行；R-DEP-01 的「迁移失败→不服务」已覆盖可观察行为；卷半迁移状态不是本 change 的验收面。 |\n| **X2** | 外部计费服务成本估算缺失（BASE-26/TG-24） | proposal A4 + 人 2026-11-03 已批准消耗少量额度；一次性 E2E（个位数调用），无月度预算意义。 |\n| **X3** | proposal `What Changes` 混入实现细节（BASE-22） | proposal 的 `What Changes` 允许点名产物（Dockerfile/compose）；「怎么做」在 design。不构成返工风险。 |\n| **X4** | `.env` 缺失时 compose 报错未写入失败模式表 | Migration Plan 第 1 步已要求 `cp .env.example .env`；Compose 自身的 missing env_file 报错足够明确。 |\n| **X5** | healthcheck 只探 DB，不探厂商（A2 失败模式） | design:125 已显式作为 trade-off 接受（探厂商会把外部故障误判为容器不健康）；不再重复。 |\n| **X6** | 迁移耗时无 metrics（BE-07） | 容器退出码 + alembic stderr + 启动日志已可观测；规模下加 metrics 属过度设计（通则④）。 |\n| **X7** | 构建期 mirror 拉取失败无重试/退避（BE-08） | 构建失败是 fail-fast，无部分镜像；Docker 构建本身可重跑，加应用层重试无收益。 |\n| **X8** | 配置错误导致 restart 循环（A2） | design:122 已显式接受（循环期间不服务、退出码/日志可见、修复后自愈）；属已知取舍。 |\n| **X9** | Windows bind mount I/O 较慢（A2） | design:126 已显式接受（日均 \u003c500 次）；规模下不构成风险。 |\n| **X10** | 400MB 镜像上限可能乐观（A2） | tasks 1.3 会在构建后 `docker image inspect` 实测；未实测前不预判失败。 |\n| **X11** | 引用行号轻微漂移（如 design:77 写 `main.py:180-193`，实际 healthz 从 181 行起） | 纯装饰性，不影响任何结论；不为此改四件套。 |\n| **X12** | `docs/已开通的 OCR 服务信息.md` 只被本地 `.git/info/exclude` 忽略，未进 `.gitignore` | 既有仓库卫生问题，不是本 change 引入；`.dockerignore` 已排除 `docs/`。建议另开 chore 把该模式加入 `.gitignore`。 |\n\n## 0. 评审范围与镜 roster\n\n- 四件套齐备：`openspec status --change docker-deploy-e2e --json` → `isPlanningComplete: true`；`openspec validate docker-deploy-e2e --strict` → valid。\n- 命中触发词：TG-01（后端服务）、TG-08（构建期外部依赖）、TG-15（新 codepath：entrypoint）、TG-16（NFR）、\n  TG-17（信任边界/凭证）、TG-18（测试计划）、TG-19（多需求）、TG-21（开放问题）、TG-22（假设）、\n  TG-23（≥2 方案）、TG-28（配置面/README）。未命中：TG-04（无 schema 迁移）、TG-25（无版本化契约套件）、\n  TG-27（无外部 LLM 产出消费）。\n- 镜 roster（8 镜）：广审 **strategy** / **plan-eng**；领域 **backend** / **devex**；对抗 **A1 隐藏假设** /\n  **A2 失败模式与乐观估计** / **A3 目标态 vs 现状**；接地 **G**。\n- 工作树：评审开始时 `git status --porcelain` 为空（HEAD `4a9ebbf`）。\n\n## 1. strategy 镜（base 计划级）\n\n- **S1 · 90s 成功指标口径歧义**（中，置信高）— `proposal.md:20` / `tasks.md:60`。指标未排除首次镜像构建；\n  `compose up` 在镜像缺失时会先构建。→ **Q2**。\n- **S2 · 决策纪要自称无 TG-23，但记录了多组 ≥2 候选**（低中，置信高）— `decision-memo.md:48`\n  「本次无 TG-23 命中」；同文 D1/D3/D4/D5 均列「砍掉的候选」。按 BASE-12，TG-23 命中时三镜 + 主次判定\n  MUST 书面写入。→ **D17**（memo 有 hash 机械门，不在本报告直接改）。\n- **S3 · Open Questions 无 owner/截止，且与已写默认值自相矛盾**（低，置信高）— `design.md:145`。\n  「可延后」与「当前按 0.1.0 + latest 双打」并存；BASE-15 要求负责人 + 决策截止。→ **D16**。\n- **S4 · proposal 的 `.dockerignore` 清单漏 `docs/`**（低，置信高）— `proposal.md:12` vs `design.md:89` /\n  `tasks.md:8`；`docs/已开通的 OCR 服务信息.md` 是本地真实凭证文档。→ **D18**。\n- **S5 · 合规声明缺「数据发往第三方」**（低，置信高）— `proposal.md:33–39` 只写 C7（不落 OCR 原文）；\n  BASE-21 要求显式声明第三方数据与脱敏策略。→ **D19**。\n- **S6 · 「不覆盖 `TRUST_PROXY_HEADERS` 真机路径」缺可证伪假设**（低，置信高）— `proposal.md:30`；\n  BASE-13 要求每条 defer 附可证伪假设。→ **D23**。\n- **S7 · design 引用尚不存在的 `tickets.md`**（低，置信高）— `design.md:97`；该文件由\n  `/sdflow-lite-ship` 出票阶段生成（`SKILL.md:265`）。建议注明「出票后生成」。→ **D16**。\n- **通过项**：范围/YAGNI（无顺手重构、无「以后可能用得上」的抽象）；需求优先级 P0/P1/P2 齐；\n  假设列表 A1–A5 齐；非目标有可证伪假设（除 S6）；切片 5 个落在 3–6 票预算内（BASE-31）。\n\n## 2. plan-eng 镜（base 工程级）\n 图（C8），\n  验收图 200/1581730 bytes 已验。\n- **A3-4 · 镜像扫描只扫 `/app` 会给出假绿**（中）— E6/D5。\n\n## 5. 接地镜（G）\n\n逐条核验 spec/design/tasks 中的代码事实；以下为亲验结果（命令输出或 `file:line`）：\n\n| 事实 | 结论 |\n| --- | --- |\n| `uv export` 默认含 `-e .` | **不符**：命令输出首行 `-e .`；`--no-emit-project` 后消失（E1）。 |\n| `uv pip install` 无 venv 可用 | **不符**：报 `No virtual environment found`（E2）。 |\n| `backend/.venv` 是否存在/大小 | **存在，150M**（E5）。 |\n| 日志写 `DATA_DIR` | **不符**：`backend/app/logging_setup.py:26` 是 stdout handler（E15）。 |\n| `R-API-06` 存在 | **相符**：`openspec/specs/ocr-api/spec.md:103`（E14）。 |\n| 现有文档测试含 `uv sync` | **相符**：`backend/tests/test_ticket5_api.py:288`（E12）。 |\n| `docs/已开通的 OCR 服务信息.md` 存在且仅本地忽略 | **相符**：`.git/info/exclude` 末行；`git status --ignored` 可见（D18/X12）。 |\n| `uv.lock` 1292 处 `files.pythonhosted.org`、仅 `pypi.org/simple` | **相符**：`grep -c` = 1292；`grep -o 'registry = ...' \\| sort -u` = 仅 pypi.org（ADR-0001 依据成立）。 |\n| Docker 版本 | **相符**：`Docker version 29.4.3`、`Compose v5.1.3`（D1 依据成立）。 |\n| `backend/app/main.py` 行号 | **基本相符**：`app = create_app()` 204、`httpx.Timeout` 69、healthz 181–193、mkdir 55、`select(Account)` 60；design 的 180–193 有 1 行漂移（X11）。 |\n| `backend/app/config.py` 行号 | **基本相符**：必填字段 66–67、`MAX_CONCURRENT_REQUESTS` 77、`database_url` 推导 89–92、`enforce_single_worker` 108–130。 |\n| `backend/alembic` 行号 | **相符**：`alembic.ini:2` `script_location = %(here)s/alembic`；`env.py:29–42` URL 解析；`0001_initial.py:16` `revision = '01b12c86bd76'`；`env.py` 的 `_ensure_sqlite_parent` 从 56 行起、mkdir 在 63 行（design 说「56 行会自动建父目录」略有压缩）。 |\n| `docs/tech-selection.md:634` M5「一键起服务」 | **相符**。 |\n| `R-ADM-02/03/04`、`R-API-01/02`、`R-CAC-01`、`R-QTA-01/05`、`R-SCH-03/05` | **全部存在**（`openspec/specs/*/spec.md`）。 |\n\n**接地结论**：核心代码事实成立；**构建链的三个命令事实不成立**（E1/E2/E3），这是本报告最高优先级的发现。\n\n## 6. 合并裁决\n\n- 合并去重后 23 条有效发现；同问题多镜命中已合并（E1/A1-1/G、E2/A1-1/G、E3/A1-3、E5/A1-5、\n  E8/B1/A2-3、E14/B7、E15/G 等）。\n- 引文抽查：本报告所有 `file:line` 均亲开文件核对；命令类证据（uv export/uv pip install/du/docker version/\n  grep）均为本轮实际输出。**未亲验**项已在对应条目标注（Q1 的 Linux 侧、E7 的 compose 渲染、Q3 的平台）。\n- 对抗裁决：A1 的 7 条隐藏假设中 6 条证伪/部分证伪；A2 的 9 条中 4 条落为有效发现、4 条为已接受取舍、\n  1 条未实测；A3 的 4 条中 3 条落为有效发现、1 条通过。\n- 反静默压制：全部 23 条 + 12 条已裁掉项均在册；无静默丢弃。\n\n**裁决汇总**\n\n| 处置 | 条目 |\n| --- | --- |\n| **阻塞级（必须先改再出票）** | D1（`-e .`）、D2（venv）、D3（build.args）、D14（uv 获取） |\n| **高优先（影响目标态正确性）** | Q1（bind mount 权限）、Q2（90s 口径）、Q3（平台/tag）、D5（凭证扫描）、D7（graceful shutdown） |\n| **中优先（实现期返工）** | D4、D6、D8、D9、D10、D11、D12、D13、D15、D20 |\n| **低优先（文档/流程）** | D16–D19、D21–D23 |\n| **已裁掉** | X1–X12 |\n\n## 7. 窄复核（对 C2 amendments 的增量）\n\n\u003e 本报告 findings 针对 C1（`4a9ebbf`）；本报告同批 amendments 产出 C2。按 skill 的「拍板前窄复核」纪律，\n\u003e 对增量逐项复核如下（只审增量，不重跑全镜）。\n\n- **C2 变更面**：`proposal.md`（Impact/Compliance/Non-Goal 补句）、`design.md`（构建决策/组件图/安全/失败模式/\n  Open Questions）、`specs/deployment/spec.md`（R-DEP-02/R-DEP-05 措辞）、`tasks.md`（1.1–1.5、2.1、3.1、\n  3.3–3.4、4.1–4.3、5.1、5.8、覆盖图）、`openspec/adr/0001-...md`（`--no-emit-project`/venv/uv pin）。\n- **复核结果**：\n  - D1/D2/D14 的修正在 tasks 1.2/1.3/2.1 与 ADR-0001 三处一致（`--no-emit-project`、`/app/.venv`、\n    venv 跨阶段 COPY、entrypoint 用 venv console scripts、`uv==0.13.6`）；未引入「依赖层 COPY `app/`」的倒退。\n  - D3/D13 的 compose 字段在 tasks 3.1 与 design 组件图一致（`build.args`、`environment: DATABASE_URL: \"\"`）；\n    `.env.example` 保持 `DATA_DIR=./data`，未破坏 uv 备选路径。\n  - D9/D10 的 spec 措辞与 `openspec/specs/ocr-api/spec.md:103`、`backend/app/logging_setup.py:26` 对读一致；\n    R-DEP-02 不再重述状态码，R-DEP-05 改为 `usage_events` + stdout 日志。\n  - D4/D5/D6/D7/D8/D11/D12/D15/D20 均为任务级加固，未新增需求、未扩大范围。\n  - Q1/Q2/Q3 保持**未决**，C2 只在 design 加「待拍板」注记，没有替人做选择。\n- **窄复核结论**：C2 与 C1 的发现一致，未发现新增矛盾；可以进入设计 HARD-GATE。\n\n## 8. T/S 残差\n\n- 本仓 `openspec/config.yaml` 的 rules 只覆盖少量槽位；已逐条人工核对：\n  - proposal：`## Why`、`## Success Metrics`、`## Non-Goals`、`## Compliance` 齐；需求优先级、假设齐。\n  - design：`## Compliance` 齐；失败模式+可观测性、NFR 数字化、安全与数据保护、决策记录齐；组件/依赖图齐。\n  - specs：每个 Requirement 挂 Scenario；稳定 ID；`## Purpose` ≥50 字符。\n  - tasks：每个任务挂 R-ID；测试覆盖图齐；任务粒度可独立验证。\n- **无 T/S 机械失败项**；但本仓没有 T/S 自动扫描脚本，以上为**指令层人工核验**，不是机械保证\n  （MUST NOT 声称有锚行机械核验）。\n- 决策纪要机械门：`ok: true`（`check_decision_memo.py`，exit 0）。\n\n## 9. 结论与建议\n\n1. **不建议按 C1 直接出票**：S1 的构建链有 4 个阻塞级缺陷（D1/D2/D3/D14），会在第一次 `docker compose up`\n   就失败；这些不是「边角失败模式」，而是目标态主路径。\n2. **C2 已修**可机械修正的条目（见 §7），并把 3 个需要人判断的问题留在设计门：\n   Q1（非 root + bind mount 权限模型）、Q2（90s 指标口径）、Q3（平台/tag/发布）。\n3. **建议进入设计 HARD-GATE**：人过本报告拍板后，按 Q1–Q3 的选择补最后一轮修订，再出票。\n4. 出票前请确认：D1/D2/D3/D14 的修正确实落到 tasks 1.2/1.3 与 ADR-0001；`docker compose up -d` 的\n   `build.args` 通路已存在；`.dockerignore` 用 `**/` 模式。\n\n---\n\n*报告生成：单 session 自查 · dispatch: single-session · 评审对象 C1 `4a9ebbf` · amendments 产出 C2*\n"},{"label":"proposal","path":"openspec/changes/docker-deploy-e2e/proposal.md","text":"# Proposal\n\n## Why\n\n`ocr-gateway-mvp` 已于 2026-11-03 归档，但服务**从未真实运行过**：本机既无 `.env` 也无 `data/`，README 的 quickstart（`uv sync --project backend`）在当前离线环境直接失败（`pypi.org` 不可达，curl exit 28），而契约测试只证明**适配器**可用——网关 HTTP 路径（鉴权、调度、配额、缓存、跨厂商切换）从未对真实厂商跑过一次。没有可复现的部署产物，「MVP 完成」目前只是代码层面的结论，不是可交付的服务。\n\n## What Changes\n\n- 新增多阶段 `Dockerfile`：依赖层（`uv export --frozen` → `uv pip install --index-url \u003cARG\u003e`）与代码层分离；运行时镜像不含 dev 依赖与测试；非 root 用户运行。\n- 新增 `docker-compose.yml`：单服务、healthcheck 消费 `/healthz`、数据卷、`env_file` 注入凭证、`restart: unless-stopped`、日志轮转（`max-size`/`max-file`）。\n- 新增容器 entrypoint：先执行 `alembic upgrade head`（幂等），再以 `uvicorn --workers 1` 启动；迁移失败即退出（fail-fast）。\n- 新增 `.dockerignore`：排除 `.venv`、`data/`、`tests/`、`openspec/`、`docs/` 等，避免把本机环境与凭证目录带进构建上下文。`[spec-review-amendment]` 补 `docs/`：本地真实凭证文档位于该目录（`docs/已开通的 OCR 服务信息.md`，仅 `.git/info/exclude` 本地忽略）。\n- 修改 `README.md`：部署段以「compose 一键起」为主、本机 uv 路径为备选；补镜像源参数说明与 Caddy/Nginx 配置片段。\n- 修改 `.env.example`：补构建期变量（`UV_DEFAULT_INDEX`）与容器内 `DATA_DIR` 绝对路径的说明。\n- 新增真机端到端验收记录（落在本 change 目录）：起服务 → 建成员/Key/百度+腾讯账号 → 三种输入 + 缓存 + 配额 + 切厂商逐项结果。\n- **不改** `backend/app/**` 业务逻辑（除非启动路径暴露部署相关缺陷，见 Non-Goals 的可证伪假设）。\n\n## Success Metrics\n\n- **一键起可用** — 基准：干净 checkout 上 `uv sync` 因 PyPI 不可达失败、且无 `data/` 目录 → 目标：`docker compose up -d` 后 ≤90s 内 `/healthz` 返回 200 且 `docker compose ps` 显示 `healthy` — 度量方式：验收记录中的启动时间戳 + `curl -i /healthz` 原始输出。\n- **真机端到端通过** — 基准：网关 HTTP 路径的真实厂商调用次数为 0 → 目标：验收清单全部场景通过、0 失败 — 度量方式：逐项结果表 + 真 Key 响应中的 `provider`/`text`/`quota`/`cached` 字段。\n- **镜像不含凭证** — 基准：不存在镜像产物 → 目标：镜像文件系统内 `MASTER_KEY`、`ADMIN_PASSWORD`、百度/腾讯密钥出现次数为 0 — 度量方式：对镜像内容执行 `grep -r` 扫描并记录命令与输出。\n\n## Non-Goals\n\n- **不带反向代理**（D4）— 可证伪假设：反代属部署环境、不在产品仓内。若验收发现 `TRUST_PROXY_HEADERS=true` 的路径存在非反代无法暴露的缺陷，则该假设被证伪。\n- **不做完整生产加固**（D5）— 可证伪假设：≤5 人、日均 \u003c500 次规模下 read-only rootfs / CPU 内存限额 / 自定义 seccomp 的收益低于维护成本。若上线后出现内存无界增长或需要容器隔离，则证伪。\n- **不做多实例 / Postgres** — 可证伪假设：规模前提 D14（≤5 人、日均 \u003c500 次）未变。若并发或数据量突破该前提则证伪。\n- **不改业务逻辑** — 可证伪假设：现有代码无需改动即可容器化。若启动路径暴露相对路径、CWD 耦合等**部署正确性**缺陷，则证伪，且这类缺陷在本 change 内修（不属于越界）。\n- **不覆盖 `TRUST_PROXY_HEADERS=true` 的真机路径** — 已有 mock 测试（`backend/tests/test_ticket2_admin.py::test_login_uses_forwarded_ip_when_trusted`）；真机反代验收留给后续 change。可证伪假设：若上线后发现登录限速的客户端 IP 识别必须在真实反代下才能确认，则该假设被证伪。`[spec-review-amendment]` 补可证伪假设（BASE-13）。\n- **不做 M3 管理面板、M2 补齐阿里/华为、M4 本地 OCR 兜底** — 分别受「本机凭证文件只有百度与腾讯」与体量约束，另开 change。\n\n## Compliance\n\n- 遵守既有决策：D13（应用不终结 TLS，只绑回环/内网）、D14（单实例规模前提）、C7（默认不落 OCR 原文）。本 change 不改变这些。\n- 遵守 ADR-0001（`openspec/adr/0001-container-deps-use-uv-export-not-uv-sync.md`）：容器依赖安装走 `uv export` + `uv pip install`，**不改动被跟踪的 `uv.lock`**。\n- 遵守单 worker 约束（`backend/app/config.py:108-130`）：compose MUST NOT 设 `WEB_CONCURRENCY` / `UVICORN_WORKERS` 大于 1。\n- 凭证保护：真实凭证仅经环境变量 / `env_file` 注入，MUST NOT 进入镜像层、MUST NOT 进仓（`.gitignore:1-5`、`.git/info/exclude`）。\n- 第三方数据：OCR 图片发往百度/腾讯属既有产品行为，本 change 不改变；验收使用公网样例图，不含 PII；C7（默认不落 OCR 原文）继续生效。`[spec-review-amendment]` 按 BASE-21 补显式声明。\n- 数据库变更：本 change **不涉及** schema 迁移（沿用 `backend/alembic/versions/0001_initial.py`），故不适用 D-2。\n\n## 需求优先级\n\n- **P0**（缺一即「一键起」不成立）：启动期自动迁移、`/healthz` 健康检查、凭证环境注入且不进镜像、数据卷持久化、单 worker 约束、真机端到端验收全项通过。\n- **P1**（决定「部署可用」）：非 root 运行、`restart: unless-stopped`、日志轮转、构建可复现（锁文件版本 + 参数化镜像源）。\n- **P2**（证据与文档）：镜像层凭证扫描记录、README 反代配置片段。\n\n## 假设\n\n- **A1** 非 root 用户 + 绑定挂载在 Windows Docker Desktop 下权限可用 —— **未验证**；若不成立，改用命名卷或调整 uid。\n- **A2** registry mirror 可稳定拉取 `python:3.12-slim` —— 已验证一次（digest `sha256:b18b261e1b4974b4f321451ad5251ded85abb22c2b8b262da527dda1d031ab30`），但 mirror 本身无 SLA。\n- **A3** 验收用公网样例图保持可达 —— 已验证 200（`https://baidu-ai.bj.bcebos.com/ocr/general.png`，1581730 bytes），属外部资源。\n- **A4** 真实厂商免费额度在验收调用量下充足 —— **未验证**具体余量；人 2026-11-03 已批准消耗少量额度。\n- **A5** 本机 Docker daemon 在验收时可用 —— 当前 `server=29.4.3 os=linux arch=x86_64`，但依赖 Docker Desktop 保持运行。\n\n## Capabilities\n\n### New Capabilities\n\n- `deployment`: 容器化部署与启动契约——一键起、启动期自动迁移、配置与凭证注入、数据持久化、运行身份与自愈、构建可复现。\n\n### Modified Capabilities\n\n无。本 change 不改变既有能力的 spec 级行为：`/healthz` 的端点契约仍由 `ocr-api` 的 R-API-06 拥有，本 change 只是让容器编排消费它。\n\n## Impact\n\n- **新增文件**：`Dockerfile`、`docker-compose.yml`、`.dockerignore`、容器 entrypoint 脚本。\n- **修改文件**：`README.md`（部署 / quickstart 段）、`.env.example`（构建期变量与容器内 `DATA_DIR`）。\n- **不改**：`backend/app/**` 业务逻辑、数据库 schema、任何公共 API 契约。\n- **构建期外部依赖**：容器 registry mirror（Docker Hub 直连不可用）、PyPI mirror（`pypi.org` 不可用）。\n- **运行期外部依赖**：不变（百度 / 腾讯 OCR API）。\n"},{"label":"design","path":"openspec/changes/docker-deploy-e2e/design.md","text":"# Design\n\n## Context\n\n动机与范围见 [`proposal.md`](./proposal.md)。本节只列**塑造方案**的现状与约束：\n\n- 应用是**单进程单 worker** 架构：内存里的账号注册表、配额计数、结果缓存都只在一个事件循环内读写（`backend/app/config.py:108-130` 的 `enforce_single_worker` 会在检测到多 worker 时抛 `RuntimeError`）。\n- **启动期不跑迁移**：`lifespan` 只做 `select(Account)`（`backend/app/main.py:51-63`），表不存在即崩；迁移必须由外部先跑（`README.md` 的「启动前先跑 `alembic upgrade head`」）。\n- **配置在导入期就被强制**：`app = create_app()` 在模块导入时执行（`backend/app/main.py:204`），而 `Settings` 的 `master_key` / `admin_password` 是必填字段（`backend/app/config.py:66-67`）⇒ 缺配置时进程起不来，而非运行期 500。\n- **SQLite 路径由 `DATA_DIR` 推导**：`database_url` 缺省时取 `Path(data_dir)/\"ocr-gateway.db\"`（`backend/app/config.py:89-92`），相对路径会随 CWD 漂移。\n- **迁移工具可重定位且幂等**：`alembic.ini:2` 用 `%(here)s/alembic`，`env.py:29-42` 按 `-x db_url` → `DATABASE_URL` → ini → `DATA_DIR` → 默认 的顺序解析并剥离 `+aiosqlite`，`env.py:56` 会自动建 SQLite 父目录；当前只有一条迁移（`backend/alembic/versions/0001_initial.py:16`，`revision = '01b12c86bd76'`）。\n- **构建环境离线**：`pypi.org` 与 `files.pythonhosted.org` 均不可达（curl exit 28），Docker Hub 直连亦不可用；只有国内 PyPI 镜像与 Docker registry mirror 可达（见 `decision-memo.md` C1/C7）。\n- **`uv.lock` 锁定的是下载 URL 而非仅版本**：1292 处 `files.pythonhosted.org` 硬编码 ⇒ `uv sync --frozen` 在离线环境不可用（ADR-0001）。\n\n## Goals / Non-Goals\n\n**Goals:**\n\n- 交付一个**可构建、可一键起、可搬迁**的容器产物，并把「起得来」变成可观测事实（`/healthz` + compose healthcheck）。\n- 让**启动期迁移**成为容器自身的职责，消除「忘了跑 `alembic upgrade head`」这类部署事故。\n- 用**真机端到端**证明网关链路（鉴权/调度/配额/缓存/切厂商）在真实厂商下成立，而不只是适配器级。\n\n**Non-Goals（设计层边界）:**\n\n- 不引入反向代理、TLS 终结、多实例、编排平台（K8s）——理由与可证伪假设见 `proposal.md` 的 Non-Goals。\n- 不改 `backend/app/**` 的业务逻辑、数据模型或任何 HTTP 契约。\n- 不做镜像分层的高级优化（如 BuildKit cache mount 之外的精细裁剪）。\n\n## Decisions\n\n本 change 的**决策全文、砍掉的候选与承重约束**见 [`decision-memo.md`](./decision-memo.md)；跨 change 复用的技术裁决见 ADR-0001。本节只记**设计层**的选择：\n\n- **多阶段构建 + 依赖层独立** — 依赖层只 COPY `pyproject.toml` / `uv.lock`，代码层再 COPY `app/` 与 `alembic/`。理由：代码改动不会让依赖层缓存失效，本机首次构建后迭代是秒级。备选：单阶段（每次改代码都重装依赖，离线环境下代价极高）。\n- **依赖安装走 `uv export --frozen --no-emit-project` → `uv pip install --index-url`** — 见 ADR-0001。理由：保留锁文件的版本精确性，同时不把区域镜像写进被跟踪的 `uv.lock`。`[spec-review-amendment]` `uv export` 默认会输出 `-e .`，依赖层只有 `pyproject.toml`/`uv.lock` 时会构建失败，故 MUST 加 `--no-emit-project`；构建阶段 MUST 先创建 `/app/.venv`（或显式 `UV_SYSTEM_PYTHON=1`），并显式安装固定版本的 uv。\n- **迁移放在 entrypoint，而不是 compose 的 `command`** — entrypoint 内顺序执行「迁移 → 启动」，迁移失败即 `exit`，不会出现「uvicorn 起来了但表不存在」的中间态。备选：compose 里用两个 service / 依赖 `depends_on`（多一层编排、且 `depends_on` 只保证启动顺序不保证成功）。\n- **healthcheck 用 `python -c` 而非 `curl`/`wget`** — `python:3.12-slim` 不含 curl/wget，装它们只为探活不划算。用标准库 `urllib.request` 请求 `/healthz`，非 200 即非零退出。\n- **数据卷用 bind mount `./data`** — 与 `README.md` 既有的备份脚本（`sqlite3 data/ocr-gateway.db \".backup ...\"`）路径一致，运维无需改习惯。备选：命名卷（备份需先进容器取文件，反而更绕）。\n- **容器内 `DATA_DIR=/data`（绝对路径）** — 规避 CWD 漂移（`backend/app/config.py:89-92`）。\n- **不设 `WEB_CONCURRENCY` / `UVICORN_WORKERS`** — 保持 `enforce_single_worker` 合规（`backend/app/config.py:108-130`）；uvicorn 默认单 worker 即满足。\n\n## 组件与依赖图\n\n```\n宿主 / 部署环境\n┌───────────────────────────────────────────────────────────────────┐\n│ docker compose                                                    │\n│  ┌─────────────────────────────────────────────────────────────┐  │\n│  │ service: ocr-gateway（单容器，非 root）                     │  │\n│  │                                                             │  │\n│  │  entrypoint.sh                                              │  │\n│  │   ① alembic upgrade head ─────▶ SQLite /data/ocr-gateway.db │  │\n│  │   ② exec uvicorn app.main:app --workers 1                   │  │\n│  │        └─ lifespan: enforce_single_worker → 加载 accounts    │  │\n│  │                    与 quota → 启动 2s 刷盘循环               │  │\n│  │                                                             │  │\n│  │  GET /healthz ◀──── healthcheck（python urllib，10s/3s/5）   │  │\n│  └─────────────────────────────────────────────────────────────┘  │\n│        ▲ env_file: .env（MASTER_KEY / ADMIN_PASSWORD，运行期）    │\n│        ▲ build.args: UV_DEFAULT_INDEX（构建期，.env 插值）        │\n│        ▲ volume: ./data ──▶ /data                                 │\n└───────────────────────────────────────────────────────────────────┘\n   出站（运行期）：aip.baidubce.com、ocr.tencentcloudapi.com\n   构建期：registry mirror（python:3.12-slim）+ PyPI mirror（38 个锁定包）\n```\n\n`[spec-review-amendment]` `env_file` 只注入运行期容器环境，**不会**成为构建参数；构建期镜像源 MUST 经\ncompose `build.args: UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-}`（Compose 从项目根 `.env` 插值）传入。\n\n## 失败模式与可观测性\n\n| 失败模式 | 表现 | 处理 | 可观测信号 |\n| --- | --- | --- | --- |\n| 缺 `MASTER_KEY` / `ADMIN_PASSWORD` | 导入期抛错退出 | fail-fast，不进入服务态 | 容器退出码非 0 + stderr 的 `ValidationError` |\n| 迁移失败（卷权限 / 磁盘满） | entrypoint 第一步失败 | `set -e` 立即退出，**不启动 uvicorn** | 退出码非 0 + alembic stderr |\n| 迁移成功后 uvicorn 起不来（端口占用） | 容器退出 | `restart: unless-stopped` 触发重启并暴露问题 | 退出码 + `docker compose logs` |\n| 数据库不可用 | `/healthz` 返回 503 | compose 标记 `unhealthy` | `curl /healthz` 的 body（`{\"status\":\"error\",\"db\":\"error\",...}`） |\n| 构建期 mirror 不可达 | 构建中断 | 无部分镜像产出 | 构建日志中的 `Failed to fetch` |\n| 锁与导出不一致 | 依赖版本漂移 | `--frozen` 保证导出一致，不一致即失败 | 构建日志 |\n| 运行期厂商不可用 | 请求返回 502/503/504 | 既有调度器逻辑（本次不改） | 响应 `error.code` + `request_id` |\n| 容器停止时仍有在途请求 | 请求被截断 | compose `stop_grace_period: 25s`（大于 `REQUEST_DEADLINE_MS=20000`），给 uvicorn 留出优雅退出窗口 | 退出码 + 日志 |\n\n**可观测性基线**：应用已有结构化请求日志（`backend/app/main.py:120-131`，含 `request_id`/`latency_ms`）与 `/healthz`；本 change 新增的是**容器层**信号——compose healthcheck 状态、容器退出码、以及日志轮转（`max-size`/`max-file`）防止磁盘被写满。\n\n## 非功能需求（数字化）\n\n- **冷启动（空卷含迁移）** ≤ 90s；**稳态启动**（表已存在）≤ 10s。\n- **healthcheck**：`interval=10s`、`timeout=3s`、`retries=5`、`start_period=30s` ⇒ 最迟约 80s 内判定 `healthy`。\n- **镜像大小** ≤ 400MB（`python:3.12-slim` + 运行期依赖，不含 dev 依赖与测试）。\n- **RTO / RPO**：沿用既有口径——重启进程 \u003c 5s；配额计数最多丢 2 秒（`README.md` 备份与恢复段）。\n- **单实例上限**：1 容器、1 worker、全局并发上限 `MAX_CONCURRENT_REQUESTS=8`（`backend/app/config.py:77`）。\n\n## 安全与数据保护\n\n- **凭证**：只经 `env_file` / 环境变量注入；`.dockerignore` 必须排除 `.env`、`data/`、`docs/`（本地凭证文档所在目录）；镜像层 MUST NOT 含任何真实凭证（验收含镜像内容扫描）。\n- **运行身份**：非 root 用户运行；`/data` 目录归属该用户。`[spec-review-amendment]` bind mount 下镜像构建期的 `chown /data` **不作用于宿主目录**；Linux 上宿主 `./data` 通常由 root 创建，非 root 容器用户迁移时会 EACCES。权限模型（entrypoint root→chown→drop / 命名卷 / 宿主侧 chown）待设计门 Q1 拍板。\n- **网络暴露**：容器只暴露应用端口，不终结 TLS（D13）；生产由外层反代终结 HTTPS。\n- **数据**：`/data` 内是 SQLite 明文（与现状一致）；`usage_events` 仍不落 OCR 原文（C7），本 change 不改变这一点。\n- **构建供应链**：基础镜像经 mirror 拉取并固定 digest（`sha256:b18b261e...`）；依赖版本由 `uv.lock` 锁定。\n\n## 切片与依赖\n\n本 change 拆 5 个垂直切片。**真正的 `Blocked-by` 台账在 `tickets.md`**（由 `/sdflow-lite-ship` 出票阶段生成），本节只是语义来源。`[spec-review-amendment]` 注明 `tickets.md` 当前尚不存在，避免读者误以为遗漏。\n\n| 切片 | 交付行为 | 依赖 |\n| --- | --- | --- |\n| **S1 镜像构建层** | `docker build` 成功，镜像内 `python -c \"import app\"` 通过，且不含 dev 依赖/测试 | — |\n| **S2 启动契约** | 空卷启动自动建表、`/healthz` 200；缺配置或迁移失败时快速退出 | S1 |\n| **S3 编排与运行身份** | `docker compose up -d` 后达到 `healthy`；非 root、restart 策略、日志轮转、数据卷、凭证注入 | S2 |\n| **S4 文档与配置面** | 按 README 从干净 checkout 复现一键起；`.env.example` 覆盖构建期与运行期变量 | S3 |\n| **S5 真机端到端验收** | 建成员/Key/百度+腾讯账号 → 三种输入 + 缓存 + 配额 + 显式不回退 + auto 切换全部通过；记录证据 | S3、S4 |\n\n## Compliance\n\n- **ADR-0001 遵守**：容器依赖安装走 `uv export --frozen` + `uv pip install --index-url`，不改动被跟踪的 `uv.lock`。\n- **D13 遵守**：应用不终结 TLS；容器只绑回环/内网端口，由外层反代终结 HTTPS。\n- **D14 遵守**：单实例规模前提（≤5 人、日均 \u003c500 次）未变，不引入多实例或 Postgres。\n- **C7 遵守**：默认不落 OCR 原文，本次不改 `usage_events` 结构。\n- **单 worker 约束遵守**：不设 `WEB_CONCURRENCY` / `UVICORN_WORKERS`（`backend/app/config.py:108-130`）。\n- **D-2（DB schema 迁移）不适用**：本 change 无 schema 变更，沿用 `0001_initial.py`。\n- **D-4（外部依赖超时 / 写操作回滚）**：运行期外部依赖不变，既有超时（`backend/app/main.py:69` 的 `httpx.Timeout(connect=3.0, read=8.0, write=8.0, pool=3.0)`、`DEFAULT_TIMEOUT_MS` / `REQUEST_DEADLINE_MS`）继续生效；构建期网络操作的边界与回滚见下节。\n- **D-6（架构边界）**：无跨产品/跨模块共享数据模型变更，未越界。\n\n## Risks / Trade-offs\n\n- **构建强依赖 mirror** → 缓解：镜像源参数化（`ARG UV_DEFAULT_INDEX`），并文档化取值；mirror 不可达时构建快速失败而非产出半成品。\n- **entrypoint 内跑迁移意味着容器需要写权限** → 缓解：`/data` 显式归属非 root 用户；迁移失败即退出，不留中间态。\n- **`restart: unless-stopped` 与 fail-fast 的交互** → 取舍：配置错误或迁移持续失败会形成**重启循环**（Docker 退避重试）。接受理由：循环期间不进入服务态、退出码与日志可见；修复配置后自动恢复，无需人工 `up`。若要抑制循环需引入额外守卫，与「一键起」的简单性相悖。\n- **非 root + Windows bind mount 的权限行为未验证（A1）** → 缓解：若验收失败，降级为命名卷或调整 uid，并把结论回写到 design。`[spec-review-amendment]` A1 只覆盖 Windows Docker Desktop；目标态「搬到任意 Linux 服务器」的 bind mount 权限未覆盖，见安全与数据保护节与 Q1。\n- **`uv export` 与 `uv.lock` 之间靠 `--frozen` 维持一致** → 缓解：`--frozen` 不一致即报错；升级依赖时仍用 `uv lock` 正常维护锁文件。\n- **healthcheck 只探数据库连通性** → 取舍：不额外探厂商可用性（会把外部故障误判为容器不健康，触发无意义重启）。\n- **bind mount 在 Windows 上 I/O 较慢** → 取舍：规模极小（日均 \u003c500 次），可接受；若后续变慢再评估命名卷。\n\n## Migration Plan\n\n**部署步骤**\n\n1. `cp .env.example .env`，填入 `MASTER_KEY`（32 字节）、`ADMIN_PASSWORD`（≥8 字符），以及 `UV_DEFAULT_INDEX`（离线环境必填）。\n2. `docker compose up -d` —— 容器自动执行 `alembic upgrade head` 后启动。\n3. 等待 `docker compose ps` 显示 `healthy`；`curl -i http://127.0.0.1:8000/healthz` 应返回 200。\n4. 经管理 API 建成员 / Key / 账号（`POST /api/admin/users`、`POST /api/admin/api-keys`、`POST /api/admin/accounts`）。\n\n**回滚策略**\n\n- **无 schema 变更** ⇒ 不需要 `alembic downgrade`；回滚 = 停容器（`docker compose down`）+ 用备份覆盖 `data/ocr-gateway.db` + 起上一版本镜像。\n- 备份沿用 `README.md` 的 `sqlite3 ... \".backup ...\"` 脚本，RPO 为最多 2 秒配额计数。\n- 镜像回滚靠固定 tag；`latest` 不作为回滚依据。\n\n## Open Questions\n\n- 镜像 tag / 目标平台策略（语义化版本 vs 日期戳 vs 仅 `latest`；`linux/amd64` vs 多架构）——负责人：人；截止：设计 HARD-GATE（Q3）。当前默认 `0.1.0` + `latest`、仅 `linux/amd64`，待拍板确认。`[spec-review-amendment]` 补 owner/截止，消除「可延后」与「当前双打」的自相矛盾（BASE-15）。\n"},{"label":"spec:deployment","path":"openspec/changes/docker-deploy-e2e/specs/deployment/spec.md","text":"# Spec Delta\n\n## Purpose\n\n定义 OCR Gateway 的容器化部署与启动契约：一键起、启动期自动迁移、配置与凭证注入、数据持久化、单实例约束、构建可复现与运行身份，使「服务起得来、数据不丢、凭证不外泄」成为可观察、可验证的系统行为。\n\n## ADDED Requirements\n\n### Requirement: R-DEP-01 启动期自动迁移\n\n容器启动时系统 SHALL 先完成数据库迁移再启动 HTTP 服务；迁移失败时 MUST 以非零退出码终止，且 MUST NOT 进入对外服务状态。\n\n#### Scenario: 空数据卷首次启动\n\n- **WHEN** 容器以空数据卷启动且配置有效\n- **THEN** 系统自动完成迁移，启动完成后 `GET /healthz` 返回 200\n\n#### Scenario: 迁移失败\n\n- **WHEN** 迁移因数据库不可写而失败\n- **THEN** 容器以非零退出码终止，且不监听 HTTP 端口\n\n#### Scenario: 重复启动幂等\n\n- **WHEN** 容器在已完成迁移的数据卷上再次启动\n- **THEN** 迁移为无操作，服务正常启动\n\n### Requirement: R-DEP-02 健康状态可被编排消费\n\n容器编排 SHALL 以既有 `GET /healthz`（端点契约由 `ocr-api` 的 R-API-06 拥有）作为健康探测入口；本要求只约束编排侧的消费行为，不重述端点状态码契约。`[spec-review-amendment]` 去重：原措辞与 R-API-06 形成两个真相源。\n\n#### Scenario: 数据库可用\n\n- **WHEN** 编排执行健康探测且数据库可访问\n- **THEN** 探测请求得到 R-API-06 规定的成功响应，编排将容器标记为健康\n\n#### Scenario: 数据库不可用\n\n- **WHEN** 数据库不可访问\n- **THEN** 探测请求得到 R-API-06 规定的失败响应，编排将该容器标记为不健康\n\n### Requirement: R-DEP-03 配置与凭证只经环境注入\n\n系统 SHALL 只从环境变量（含 `env_file`）读取 `MASTER_KEY`、`ADMIN_PASSWORD` 与运行期配置；必填项缺失时 MUST 在启动阶段失败。\n\n#### Scenario: 缺必填配置\n\n- **WHEN** 未提供 `MASTER_KEY` 或 `ADMIN_PASSWORD`\n- **THEN** 容器在启动阶段以非零退出码终止，不进入服务态\n\n#### Scenario: 配置完整\n\n- **WHEN** 必填项齐备且格式合法\n- **THEN** 服务正常启动并通过健康检查\n\n### Requirement: R-DEP-04 镜像与构建上下文不含凭证\n\n镜像 MUST NOT 包含任何真实凭证或本地运行数据；构建上下文 MUST 排除 `.env`、`data/` 与本地凭证文档。\n\n#### Scenario: 镜像内容扫描\n\n- **WHEN** 对构建产物执行内容扫描\n- **THEN** 镜像内不含 `MASTER_KEY`、`ADMIN_PASSWORD`、百度或腾讯密钥的任何取值\n\n#### Scenario: 构建上下文排除\n\n- **WHEN** 执行镜像构建\n- **THEN** `.env`、`data/` 与本地凭证文档不进入构建上下文\n\n### Requirement: R-DEP-05 数据持久化\n\n容器化部署 SHALL 将 `DATA_DIR` 设为绝对路径并挂载为卷；容器销毁重建后 MUST 保留既有业务数据。\n\n#### Scenario: 容器重建保留数据\n\n- **WHEN** 容器被销毁并以同一卷重建\n- **THEN** 先前创建的成员、API Key 与账号仍然存在\n\n#### Scenario: 数据写入卷内\n\n- **WHEN** 服务运行并产生配额计数与用量事件（`usage_events`）\n- **THEN** 这些持久化数据落在挂载卷内，不落在容器可写层；进程日志经 stdout 由容器日志驱动处理（含轮转），不写入卷\n\n\u003e `[spec-review-amendment]` 原措辞「请求日志落在挂载卷内」与 `backend/app/logging_setup.py:26`（stdout handler）不符，且 `usage_events` 与 stdout 日志是两类数据；此处按代码事实拆开表述。\n\n### Requirement: R-DEP-06 单实例约束\n\n容器化部署 MUST NOT 以多于一个 worker 运行；检测到多 worker 配置时系统 MUST 拒绝启动并给出明确原因。\n\n#### Scenario: 多 worker 配置被拒\n\n- **WHEN** 设置了 `WEB_CONCURRENCY` 或 `UVICORN_WORKERS` 大于 1，或传入 `--workers` 大于 1\n- **THEN** 启动失败并报告单实例约束\n\n#### Scenario: 默认单 worker\n\n- **WHEN** 未设置任何 worker 相关变量\n- **THEN** 服务以单 worker 正常启动\n\n### Requirement: R-DEP-07 构建可复现且索引可参数化\n\n镜像构建 SHALL 安装锁文件锁定的依赖版本，并 SHALL 允许通过参数指定包索引；构建 MUST NOT 依赖锁文件中记录的默认下载地址可达。\n\n#### Scenario: 离线环境构建成功\n\n- **WHEN** 默认包索引不可达，但参数指定的索引可达\n- **THEN** 构建成功，且安装的依赖版本与锁文件一致\n\n#### Scenario: 无可达索引\n\n- **WHEN** 未指定索引且默认索引不可达\n- **THEN** 构建失败，不产出可用镜像\n\n### Requirement: R-DEP-08 运行身份与自愈\n\n容器 SHALL 以非 root 用户运行；进程异常退出后 SHALL 由编排自动重启；容器日志 SHALL 设有大小与份数上限。\n\n#### Scenario: 非 root 运行\n\n- **WHEN** 检查容器内主进程身份\n- **THEN** 其 uid 不为 0\n\n#### Scenario: 异常退出后自愈\n\n- **WHEN** 容器主进程以非零码退出\n- **THEN** 编排自动重启该容器\n\n#### Scenario: 日志轮转\n\n- **WHEN** 日志增长超过配置的大小上限\n- **THEN** 日志轮转并只保留限定份数，磁盘不被写满\n"},{"label":"tasks","path":"openspec/changes/docker-deploy-e2e/tasks.md","text":"# Tasks\n\n\u003e 追溯：任务 ↔ 需求 ID 双向可查。设计见 [`design.md`](./design.md)，需求见 [`specs/deployment/spec.md`](./specs/deployment/spec.md)。\n\u003e 切片对应：第 1 组=S1，第 2 组=S2，第 3 组=S3，第 4 组=S4，第 5 组=S5（集成检查）。\n\n## 1. 镜像构建层（S1）\n\n- [ ] 1.1 新增 `.dockerignore`，排除 `**/.venv`、`**/tests`、`**/data`、`**/__pycache__`、`**/.pytest_cache`、`**/.ruff_cache`、`**/.mypy_cache`、`openspec/`、`docs/`、`.env*`、`.git/`；验证：`docker build` 的构建上下文清单中不含这些路径。`[spec-review-amendment]` 模式改为 `**/` 前缀：`.dockerignore` 相对构建上下文根匹配，`.venv/` 不能排除实存 150MB 的 `backend/.venv`\n  - R-ID: R-DEP-04\n- [ ] 1.2 新增多阶段 `Dockerfile`：基础镜像固定 digest（`python:3.12-slim@sha256:b18b261e1b4974b4f321451ad5251ded85abb22c2b8b262da527dda1d031ab30`）；构建阶段先安装固定版本 uv（`pip install --index-url \"$UV_DEFAULT_INDEX\" uv==0.13.6`）并创建 `/app/.venv`；依赖层只 COPY `backend/pyproject.toml` 与 `backend/uv.lock`，用 `ARG UV_DEFAULT_INDEX`（默认空）+ `uv export --frozen --no-dev --no-emit-project --format requirements-txt --no-hashes` → `uv pip install --index-url \"$UV_DEFAULT_INDEX\" -r` 安装；验证：`docker build --build-arg UV_DEFAULT_INDEX=https://pypi.tuna.tsinghua.edu.cn/simple .` 构建成功。`[spec-review-amendment]` 补 `--no-emit-project`（否则导出首行是 `-e .`，无源码的依赖层必失败）、`/app/.venv`（无 venv 时 `uv pip install` 报 `No virtual environment found`）、uv 固定版本与基础镜像 digest\n  - R-ID: R-DEP-07\n- [ ] 1.3 运行时层 COPY `backend/app`、`backend/alembic`、`backend/alembic.ini`，并从构建阶段 COPY `/app/.venv`（多阶段构建；或改单阶段安装），安装项目自身（`uv pip install --index-url \"$UV_DEFAULT_INDEX\" --no-deps .`）；验证：`docker run --rm \u003cimg\u003e python -c \"import app; print(app.__version__)\"` 输出 `0.1.0`，且 `docker image inspect --format '{{.Size}}'` 不大于 400MB（design 的 NFR）。`[spec-review-amendment]` 补 `--index-url`（构建后端 `hatchling` 也须从镜像取）与 venv 跨阶段 COPY（多阶段下依赖不随构建阶段自动进入运行时层）\n  - R-ID: R-DEP-07\n- [ ] 1.4 确认运行时镜像不含 dev 依赖与测试代码；验证：`docker run --rm \u003cimg\u003e python -c \"import pytest\"` 必须失败（非零退出），且镜像内不存在 `tests/` 目录\n  - R-ID: R-DEP-04\n- [ ] 1.5 对构建产物做凭证扫描；验证：用 `.env` 中的实际值扫描**停止态容器/镜像层**（如 `docker create` 后 `docker export | grep`，或 `docker save \u003cimg\u003e | tar -xO`），确认 `MASTER_KEY`、`ADMIN_PASSWORD`、百度 `api_key`/`secret_key`、腾讯 `secret_id`/`secret_key` 的取值出现次数为 0；镜像历史中不含 `ENV MASTER_KEY` / `ENV ADMIN_PASSWORD`。`[spec-review-amendment]` 原命令只扫 `/app` 且只匹配 `AKID`/`MASTER_KEY=`，覆盖不到百度密钥与镜像其他路径；扫描须避开运行中容器的 `/proc/*/environ` 假阳性\n  - R-ID: R-DEP-04\n\n## 2. 启动契约（S2）\n\n- [ ] 2.1 新增容器 entrypoint 脚本：`set -e` → `/app/.venv/bin/alembic upgrade head`（或 `PATH=/app/.venv/bin:$PATH` 后 `alembic`）→ `exec /app/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1`；验证：以空卷启动后 `GET /healthz` 返回 200，且容器内可见 `accounts`、`api_keys`、`users`、`quota_counters`、`usage_events` 五张表。`[spec-review-amendment]` 明确使用 venv 内的 console scripts，避免多阶段镜像里 `alembic`/`uvicorn` 不在 PATH\n  - R-ID: R-DEP-01\n- [ ] 2.2 验证迁移失败的 fail-fast 行为；验证：把 `/data` 挂成只读或不可写后启动，容器以非零退出码终止，且日志中不出现 uvicorn 监听端口的信息\n  - R-ID: R-DEP-01\n- [ ] 2.3 验证重复启动幂等；验证：在同一已迁移的卷上二次启动，`alembic` 无升级输出且 `/healthz` 仍返回 200\n  - R-ID: R-DEP-01\n- [ ] 2.4 验证必填配置缺失时启动阶段失败；验证：不传 `MASTER_KEY`（或传非 32 字节值）启动，容器非零退出且日志含校验错误；不传 `ADMIN_PASSWORD` 或短于 8 字符时同样失败\n  - R-ID: R-DEP-03\n- [ ] 2.5 验证多 worker 配置被拒；验证：以 `WEB_CONCURRENCY=2` 启动，容器非零退出且日志含「单实例约束」\n  - R-ID: R-DEP-06\n\n## 3. 编排与运行身份（S3）\n\n- [ ] 3.1 新增 `docker-compose.yml`：单服务、端口映射到 `127.0.0.1:8000`、`env_file: .env`、`build.args: UV_DEFAULT_INDEX: \"${UV_DEFAULT_INDEX:-}\"`、数据卷 `./data:/data`、`environment: DATA_DIR=/data`（绝对路径）与 `DATABASE_URL: \"\"`（强制从 `DATA_DIR` 推导）；验证：`docker compose config` 通过且解析出的 `DATA_DIR` 为 `/data`、`DATABASE_URL` 为空。`[spec-review-amendment]` 补 `build.args`（`env_file` 不供给构建参数）与 `DATABASE_URL: \"\"`（防 `.env` 残留宿主机路径覆盖 `/data`）；验证输出须过滤，MUST NOT 原样粘贴含凭证明文的完整 config\n  - R-ID: R-DEP-05\n- [ ] 3.2 配置 healthcheck（`interval=10s`、`timeout=3s`、`retries=5`、`start_period=30s`），探测命令用容器内 Python 标准库请求 `/healthz`（镜像无 curl/wget）；验证：`docker compose up -d` 后 `docker inspect --format '{{.State.Health.Status}}'` 返回 `healthy`\n  - R-ID: R-DEP-02\n- [ ] 3.3 以非 root 用户运行并让 `/data` 可写；验证：`docker compose exec ocr-gateway id -u` 不为 `0`，且配额刷盘与迁移均无权限错误。`[spec-review-amendment]` bind mount 下镜像期 `chown /data` 不作用于宿主目录；权限模型（entrypoint root→chown→drop / 命名卷 / 宿主侧 chown）待设计门 Q1 拍板后再定实现；若选 root→drop，`id -u` 须在降权后验证\n  - R-ID: R-DEP-08\n- [ ] 3.4 配置 `restart: unless-stopped`、`stop_grace_period: 25s` 与日志轮转（`logging.driver: json-file` + `max-size` / `max-file`）；验证：`docker compose config` 中各项均存在，强制杀掉主进程后容器自动重启并重新达到 `healthy`。`[spec-review-amendment]` 补 `stop_grace_period`（大于 20s 请求预算，避免 SIGTERM 硬切在途请求）与显式 `json-file` 驱动（否则 `max-size` 在非 json-file 默认驱动的宿主机上静默失效）\n  - R-ID: R-DEP-08\n- [ ] 3.5 验证数据持久化；验证：经管理 API 建一个成员后执行 `docker compose down` 与 `docker compose up -d`，该成员仍可通过 `GET /api/admin/users` 查到\n  - R-ID: R-DEP-05\n\n## 4. 文档与配置面（S4）\n\n- [ ] 4.1 改写 `README.md` 部署段：以 `docker compose up -d` 一键起为主路径、本机 uv + uvicorn 为备选；补 `UV_DEFAULT_INDEX` 说明与 Caddy/Nginx 反代配置片段；补新 quickstart 的 TTHW 推导（步骤数/命令数 + 每步耗时假设 + 明确标注「估算」）；注明 uv 备选路径的前置（PyPI 可达；离线时需 `UV_DEFAULT_INDEX`，且非 frozen 的 `uv sync` 可能改写被跟踪的 `uv.lock`）；修正 `DATA_DIR` 描述为「SQLite 数据目录」，日志走 stdout；验证：从干净 checkout 按 README 步骤可复现到 `healthy`，并把实际命令与输出记入验收记录。`[spec-review-amendment]` 补 DX-01 推导与备选路径前置（D21/D22/D10）\n  - R-ID: R-DEP-07\n- [ ] 4.2 更新 `.env.example`：补 `UV_DEFAULT_INDEX`（构建期，默认留空）与「容器内 `DATA_DIR=/data` 由 compose `environment` 覆盖」的注释；`DATA_DIR` 保持宿主机默认 `./data`，`DATABASE_URL` 保持空；保留 `change-me-please` 占位且不含任何真实密钥；验证：`docker compose config` 能解析该文件，且文件内无 `AKID` 等真实凭证片段。`[spec-review-amendment]` 不把示例值改成 `/data`（会破坏 uv 备选路径）；`DATABASE_URL` 保持空（配合 compose 的 `DATABASE_URL: \"\"` 强制从 `DATA_DIR` 推导）\n  - R-ID: R-DEP-03\n- [ ] 4.3 更新既有静态文档测试 `backend/tests/test_ticket5_api.py::test_run_docs_cover_quickstart_and_operations`：保留原有断言针（`uv sync`、`alembic upgrade head`、`MASTER_KEY`、`ADMIN_PASSWORD`、`--workers 1`、`sqlite3`、`.backup`、`以官网为准`、`HTTPS`、`RPO`、`RTO`），新增 `docker compose up -d` 与 `UV_DEFAULT_INDEX` 断言；验证：`pytest backend/tests/test_ticket5_api.py -q` 全绿。`[spec-review-amendment]` 补 `uv sync`：现有测试（`test_ticket5_api.py:288`）断言它，README 备选路径也保留它\n  - R-ID: R-DEP-07\n- [ ] 4.4 全量回归；验证：`pytest backend/tests -q` 全绿（含 T1/T2 的既有用例），`ruff check backend` 与 `mypy backend/app` 无新增问题\n  - R-ID: R-DEP-07\n\n## 5. 集成检查：真机端到端验收（S5）\n\n\u003e 本组只做跨组集成验证；三种输入、缓存、配额、切厂商的行为由既有能力拥有，此处**验证**而非重定义。\n\n- [ ] 5.1 冷启动计时；验证：在镜像已构建的前提下（首次构建耗时单列记录，不计入本项；口径待设计门 Q2 拍板），清空 `data/` 后 `docker compose up -d` 到 `healthy` 且 `/healthz` 200 的总耗时 ≤90s，记录时间戳\n  - R-ID: R-DEP-01, R-DEP-02\n- [ ] 5.2 经管理 API 完成配置；验证：`POST /api/admin/login` 取 token → 建成员、建 Key（记录唯一一次明文）、建百度与腾讯账号（真实凭证经 `env_file` 注入，不写入任何文件），`GET /api/admin/accounts` 返回两家且不含明文凭证\n  - R-ID: R-ADM-02, R-ADM-03, R-ADM-04\n- [ ] 5.3 真机三输入识别；验证：用真 Key 分别提交 multipart 文件、base64、公网 `image_url`（`https://baidu-ai.bj.bcebos.com/ocr/general.png`），三次均返回 200 且 `text` 非空、`lines` 为非空数组、`provider` 为实际厂商，记录每次的 `text` 片段与 `latency_ms`\n  - R-ID: R-API-01, R-API-02\n- [ ] 5.4 缓存命中；验证：重复提交同一图片且 `language`/`provider` 不变，第二次返回 `cached=true` 且 `quota.used=0`\n  - R-ID: R-CAC-01\n- [ ] 5.5 配额记账；验证：`GET /api/admin/usage/summary` 与 `GET /api/admin/logs` 能反映本次调用（成功计数 +1、缓存命中 +0），且日志不含 OCR 原文\n  - R-ID: R-QTA-01, R-QTA-05\n- [ ] 5.6 显式厂商不回退；验证：禁用全部百度账号后请求 `provider=baidu`，返回错误而非由腾讯完成\n  - R-ID: R-SCH-05\n- [ ] 5.7 `auto` 跨厂商切换；验证：禁用全部百度账号后请求 `provider=auto`，由腾讯账号完成，响应 `provider=tencent`\n  - R-ID: R-SCH-03, R-SCH-05\n- [ ] 5.8 归档验收证据；验证：在本 change 目录写入验收记录（命令、时间戳、响应片段、镜像扫描结果、`docker inspect` 健康状态），并逐条对应本组 5.1–5.7。证据中 MUST NOT 含 `MASTER_KEY`、`ADMIN_PASSWORD` 或厂商密钥明文；`docker compose config` 只保留过滤后的非敏感字段。`[spec-review-amendment]` 补凭证脱敏要求（D6）\n  - R-ID: R-DEP-01, R-DEP-02, R-DEP-03, R-DEP-04, R-DEP-05, R-DEP-06, R-DEP-07, R-DEP-08\n\n## 测试覆盖图（TG-18）\n\n| 代码路径 / 产物 | 测试类型 | 覆盖方式 |\n| --- | --- | --- |\n| `Dockerfile` 依赖层（`uv export --no-emit-project` + `uv pip install` + `/app/.venv`） | 构建验证 | 1.2：带 `--build-arg` 的构建成功 |\n| `Dockerfile` 运行时层（无 dev 依赖 / 无测试） | 构建验证 | 1.4：`import pytest` 必须失败 |\n| 镜像与构建上下文（凭证） | 静态扫描 | 1.1 / 1.5：上下文清单 + 停止态镜像层实际值扫描 |\n| entrypoint 正常路径（迁移 → 启动） | 容器集成 | 2.1：空卷启动 → `/healthz` 200 + 五张表存在 |\n| entrypoint 失败路径（迁移失败 / 缺配置） | 容器集成 | 2.2 / 2.4：非零退出且不监听端口 |\n| entrypoint 幂等路径 | 容器集成 | 2.3：二次启动无升级输出 |\n| `enforce_single_worker` 容器路径 | 容器集成 | 2.5：`WEB_CONCURRENCY=2` → 非零退出 |\n| `docker-compose.yml` 编排契约 | 配置校验 + 运行验证 | 3.1 / 3.2 / 3.4：`build.args` / `DATABASE_URL` / `stop_grace_period` / `json-file` + `inspect` 健康状态 |\n| 数据卷持久化 | 容器集成 | 3.5：down/up 后数据仍在 |\n| 运行身份 | 容器集成 | 3.3：`id -u` 不为 0（Q1 权限模型定案后） |\n| `README.md` / `.env.example` | 单元（pytest 静态断言） | 4.2 / 4.3：更新后的文档测试 |\n| 网关真链路（鉴权/调度/配额/缓存/切厂商） | 真机端到端（手工验收 + 证据） | 5.2–5.7：真实凭证下的响应字段核对 |\n| 全量回归 | 单元 + 集成（既有套件） | 4.4：`pytest backend/tests` |\n\n## Workflow follow-up\n\n- 评审通过后归档本 change，并同步主 spec（新增 `deployment` 能力）。\n- 合并后于 `main` 上单独提交一个 chore，把 `openspec/issues/open/T1.md`、`T2.md`（均已是 `status: RESOLVED`）移入已关闭池。\n"},{"label":"decision-memo","path":"openspec/changes/docker-deploy-e2e/decision-memo.md","text":"---\nschema_version: 1\nchange: docker-deploy-e2e\nbranch: feat/docker-deploy-e2e\ngenerated_at: 2026-11-03T11:32:07+08:00\ndecision_hash: 74815c6df227\n---\n\n# 决策纪要 · docker-deploy-e2e\n\n## 目标态\n\n把现有 OCR Gateway MVP 打成可一键起的 Docker Compose 部署（含自动迁移、健康检查、数据卷、镜像源参数化），并用本机真实百度/腾讯凭证跑通端到端 HTTP 验收。\n\n\u003e **术语旁注（「一键起」的边界）**：本项目无 `openspec/CONTEXT.md`，故按 reference 降级为旁注。\n\u003e 「一键起」= 从干净 checkout 执行 `docker compose up -d` 后，容器自动完成迁移且 `/healthz` 返回 200，\n\u003e **不含**创建成员/Key/账号——那些属于验收步骤，需显式调用管理 API。「一键起」与「开箱可用」不是同义词。\n\n## 拍板决策\n\n- **D1 部署形态：Docker Compose 一键起** — 依据：本机 Docker CLI 29.4.3 + Compose v5.1.3 已安装（`docker --version` / `docker compose version`）；路线图 M5 验收口径即「一键起服务」（`docs/tech-selection.md:634`）；镜像可搬到任意 Linux 服务器，不依赖本机 Python 与 uv。**砍掉的候选**：纯本机脚本（搬到服务器仍需手工装 Python/uv，达不到「一键起」）、两者都做（两套启动路径都要维护与验收，本次体量明显变大）。\n- **D2 验收口径：端到端 HTTP 硬门** — 依据：契约测试只证明适配器可用，网关路径（鉴权/调度/配额/缓存/切厂商）从未跑过真厂商；这才是产品真实链路。硬门内容：起服务 → 经管理 API 建成员/Key/百度+腾讯账号 → 真 Key 调 `POST /v1/ocr/image` 的 multipart/base64/URL 三种输入 → 校验 `text+lines`、quota 记账、缓存命中、显式 provider 不回退、`auto` 跨厂商切换。**砍掉的候选**：仅部署冒烟（调度/配额/缓存/切厂商在真厂商下仍未验证）、端到端 + 全部运营动作（测活/reset-state/用量汇总/日志查询已由 mock 测试覆盖，真机增量价值低）。\n- **D3 镜像源：参数化，仓内默认留空** — 依据：本机 `pypi.org/simple/hatchling/` 不可达（curl exit 28 超时），清华 TUNA 与阿里云镜像均 200。Dockerfile 用 `ARG`，compose/`.env` 提供取值，仓内默认留空 ⇒ 不把区域镜像写死进仓。**砍掉的候选**：仓内 `backend/uv.toml` 固化清华源（换地区/CI 会莫名走国内镜像）、不处理仅文档说明（本机 quickstart 仍失败，本次「一键起」验收做不成）。\n- **D3a 依赖安装机制修正（D3 的实现层修订，意图不变）** — `uv sync --frozen` **不可用**：`backend/uv.lock` 内有 1292 处 wheel 下载 URL 硬编码到 `files.pythonhosted.org`，且所有 `source` 均为 `registry = \"https://pypi.org/simple\"`；`UV_DEFAULT_INDEX` 只改索引解析、改不了锁文件里的下载 URL，容器内实测报 `Failed to download certifi==2026.10.23 ... files.pythonhosted.org ... operation timed out`。改用 `uv export --frozen --no-dev --format requirements-txt` 导出 38 个精确锁定版本 → `uv pip install --index-url \u003cmirror\u003e -r` 从镜像下载 → `uv pip install --index-url \u003cmirror\u003e --no-deps .` 装项目自身；容器内实测 `imports ok 0.1.0`。**取舍**：保留锁文件的版本锁定，同时不把区域镜像写进被跟踪的 `uv.lock`。**砍掉的候选**：对镜像重生成 `uv.lock`（会把 mirror URL 固化进被跟踪文件，违背 D3 的可移植意图）、镜像内删锁自由解析（丢失版本锁定）。**已落 ADR**：`openspec/adr/0001-container-deps-use-uv-export-not-uv-sync.md`（人 2026-11-03 确认落盘）。\n\n- **D4 compose 只起应用单服务，不带反代** — 依据：D13 已定「应用不终结 TLS、由反代终结」，反代属于部署环境而非产品；README 给 Caddy/Nginx 配置片段即可。**砍掉的候选**：加一个 Nginx 纯 HTTP 反代（能真机验 `TRUST_PROXY_HEADERS` 与客户端 IP 识别，但多一个服务与一层配置，验收面变大）、带 Caddy + TLS（证书与信任链会成为验收前置，明显超出「一键起」必要范围）。**残留**：`TRUST_PROXY_HEADERS=true` 的 `X-Forwarded-For` 路径不在真机验收覆盖内，仅有 mock 测试（`backend/tests/test_ticket2_admin.py::test_login_uses_forwarded_ip_when_trusted`）。\n- **D5 容器加固：最小生产项** — 包含：非 root 用户运行、`restart: unless-stopped`、日志轮转（`max-size`/`max-file`）、healthcheck、数据卷、镜像内不含 dev 依赖与测试。依据：这几项都是容器部署的最低常识，成本低且直接防「宿主机重启后服务不自恢复」「日志把磁盘写满」两类真实事故。**砍掉的候选**：只要能跑（不设非 root/重启策略/日志轮转，真实部署会踩）、完整加固（再加 read-only rootfs、CPU/内存限额、自定义 seccomp——调试成本上升，对 ≤5 人、日均 \u003c500 次规模收益低，属通则④的过度设计）。\n\n## 承重约束\n\n- **C1 容器内可完成依赖安装** — 验证方式：`docker run python:3.12-slim` 内实测安装链路；**证据锚**：`grep -c \"files.pythonhosted.org\" backend/uv.lock` = 1292、`grep -o 'registry = \"[^\"]*\"' backend/uv.lock | sort -u` = 仅 `https://pypi.org/simple`；容器内 `uv export --frozen --no-dev` 得 38 个 `==` 锁定项，`uv pip install --index-url https://pypi.tuna.tsinghua.edu.cn/simple -r` 全部装通，`python -c \"import fastapi, sqlalchemy, aiosqlite, alembic, PIL, cryptography, app\"` → `imports ok 0.1.0`。反例：同容器内 `uv sync --frozen --no-dev` 失败于 `files.pythonhosted.org` 超时。\n- **C2 迁移可用同一 `DATABASE_URL` 在任意 CWD 跑通且幂等** — 验证方式：用临时库跑 `alembic upgrade head` 并重跑；**证据锚**：`DATABASE_URL=\"sqlite:///\u003ctmp\u003e/probe.db\" python -m alembic -c backend/alembic.ini upgrade head` 建出 `['accounts','alembic_version','api_keys','quota_counters','usage_events','users']`，二次执行无输出（幂等）；`backend/alembic.ini:2`（`script_location = %(here)s/alembic` 可重定位）、`backend/alembic/env.py:29-45`（URL 解析顺序 `-x db_url` → `DATABASE_URL` → ini → `DATA_DIR` → 默认）、`:52-58`（自动建 SQLite 父目录）。\n- **C3 应用导入期即要求凭证，缺则直接失败** — 验证方式：读代码；**证据锚**：`backend/app/main.py:204`（`app = create_app()` 在模块导入执行）、`backend/app/config.py:66-67`（`master_key` / `admin_password` 为必填字段）、`:84-88`（校验 MASTER_KEY 32 字节、ADMIN_PASSWORD ≥8 字符）。⇒ 容器必须注入这两项，否则进程起不来；这也让「缺配置」变成启动即失败而非运行期 500。\n- **C4 lifespan 不跑迁移，空数据卷首启必崩** — 验证方式：读代码；**证据锚**：`backend/app/main.py:51-63`（lifespan 只 `select(Account)`，无 `alembic upgrade`）、`README.md`「启动前先跑 `alembic upgrade head`」。⇒ entrypoint 必须先迁移；`/healthz`（`backend/app/main.py:180-193`）不能替代迁移。\n- **C5 `DATA_DIR` 必须是绝对路径** — 验证方式：读代码 + 推导；**证据锚**：`backend/app/config.py:89-92`（`database_url` 由 `Path(data_dir)/\"ocr-gateway.db\"` 推导，相对路径随 CWD 漂移）、`backend/app/main.py:55`（`data_path.mkdir`）。⇒ 容器内设 `/data` 绝对路径并挂卷。\n- **C6 单 worker 约束在容器内成立** — 验证方式：读代码；**证据锚**：`backend/app/config.py:108-130`（`enforce_single_worker` 读 `WEB_CONCURRENCY`/`UVICORN_WORKERS`/`--workers`，\u003e1 抛 `RuntimeError`）；uvicorn 默认单 worker ⇒ compose 只要不设这两个变量即合规。\n- **C7 本机 Docker 可用且基础镜像可经 mirror 拉取** — 验证方式：实跑；**证据锚**：`docker info` → `server=29.4.3 os=linux arch=x86_64`；`docker pull python:3.12-slim` 成功（`Digest: sha256:b18b261e...`）；`~/.docker/daemon.json` 配 8 个 `registry-mirrors`；直连 `registry-1.docker.io/v2/` 与 `auth.docker.io/token` 均 curl exit 28 超时 ⇒ **必须依赖 mirror，不能假定直连可用**。\n- **C8 URL 输入验收需要公网可达图片** — 验证方式：实测 + 读代码；**证据锚**：`curl https://baidu-ai.bj.bcebos.com/ocr/general.png` → 200 / 1581730 bytes；SSRF 策略拒绝私网/回环/链路本地（`backend/app/utils/ssrf.py`，D7）⇒ 验收不能用本机或内网图片服务，只能用公网图。\n\n## 接受的边角\n\n- **首次构建需从 mirror 下载全部依赖** — 概率确定/影响小（一次性耗时）/完美成本高（无本地缓存时无法避免）；**为何接受**：构建缓存分层后可复用，且这是唯一不牺牲版本锁定的路径。\n- **端到端验收消耗真实厂商额度** — 概率确定/影响小（个位数调用）/完美成本高（不调真厂商就无法验网关真链路）；**为何接受**：人 2026-11-03 明确批准跑真机契约与端到端验收。\n- **`uv.lock` 的 `files.pythonhosted.org` URL 在无外网环境永远不可直用** — 概率确定/影响小/完美成本高（要改被跟踪的锁文件）；**为何接受**：export 路径已覆盖，锁文件保持原样以免把区域镜像固化进仓。\n\n## 三镜代价\n\n本次无 TG-23 命中（无跨系统架构选型，仅在既有单实例架构上加部署形态）。\n"}]</script>

      try { localStorage.removeItem(STORE_KEY + ':probe'); } catch (e2) { /* 删不掉也不影响使用 */ }
    }
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return;
      var data = JSON.parse(raw);
      if (!data || !Array.isArray(data.notes)) return;
      var maxN = 0, repaired = false;
      data.notes.forEach(function (n) {
        if (!n || typeof n.quote !== 'string' || typeof n.comment !== 'string' || typeof n.n !== 'number') return;
        var id = n.id;
        if (!isNoteId(id)) { id = newNoteId(); repaired = true; }
        state.notes.push({
          id: id, n: n.n, doc: String(n.doc || ''), heading: String(n.heading || ''), quote: n.quote,
          before: String(n.before || ''), after: String(n.after || ''), comment: n.comment, copied: !!n.copied,
          inFigure: n.inFigure === true,
        });
        if (n.n > maxN) maxN = n.n;
      });
      state.next = Math.max(Number(data.next) || 1, maxN + 1);
      if (repaired) saveState();
    } catch (e) { /* 存档损坏：当作没有意见 */ }
  }

  function findNote(id) {
    for (var i = 0; i < state.notes.length; i++) if (state.notes[i].id === id) return state.notes[i];
    return null;
  }

  // ── 高亮：按文本节点分段包 <mark>，跨粗体、跨列表项的选区每段各包一个 ─────────────
  function docBodyByLabel(label) {
    var sections = document.querySelectorAll('section.doc');
    for (var i = 0; i < sections.length; i++) {
      if (sections[i].getAttribute('data-label') === label) return sections[i].querySelector('.doc-body');
    }
    return null;
  }

  function rangeAt(root, start, length) {
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    var pos = 0, node, range = document.createRange(), startSet = false, end = start + length;
    while ((node = walker.nextNode())) {
      var len = node.data.length;
      if (!startSet && start < pos + len) { range.setStart(node, start - pos); startSet = true; }
      if (startSet && end <= pos + len) { range.setEnd(node, end - pos); return range; }
      pos += len;
    }
    return null;
  }

  // 节点本身是元素就取它，文本节点取父元素。
  function elementOf(node) {
    return node && (node.nodeType === 1 ? node : node.parentElement);
  }

  // 图内（SVG 的 <text> 或 foreignObject 里的 HTML）与 mermaid 源码块内不插 <mark>：
  // SVG 文字里插入 HTML 元素会让文字消失，源码块在图渲染后整块被替换。
  function inUnmarkable(node) {
    var el = elementOf(node);
    return !!(el && (el.closest('svg') || el.closest('pre > code.language-mermaid')));
  }

  // 收集 Range 覆盖的文本分段 [{node, start, end}]（只读，不改 DOM）。
  // 端点落在元素上时由 intersectsNode 归到文本节点：终点在下一个块元素偏移 0 时，那个块里的文字不相交。
  // 跳过纯空白分段（块与块之间的换行节点）与不可插 <mark> 的节点。
  function textSegments(range) {
    var root = range.commonAncestorContainer;
    if (root.nodeType === 3) root = root.parentNode;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    var out = [], node;
    while ((node = walker.nextNode())) {
      if (!range.intersectsNode(node)) continue;
      var start = node === range.startContainer ? range.startOffset : 0;
      var end = node === range.endContainer ? range.endOffset : node.data.length;
      if (end <= start || !/\S/.test(node.data.slice(start, end)) || inUnmarkable(node)) continue;
      out.push({ node: node, start: start, end: end });
    }
    return out;
  }

  // kind: 'note'（暂存意见，data-note）| 'saved'（已落盘意见，data-saved）；key 一律是 id（或无 id 时的序位键）。
  // 同一条意见的每个分段各包一个 <mark>，共用 key。至少包上一段即返回 true。
  function wrapRange(range, key, kind) {
    var segs = textSegments(range);   // 先收集清单，再统一改写 DOM
    var marks = [];
    segs.forEach(function (seg) {
      var target = seg.node;
      // 同一文本节点内：先按止点切分，再按起点切分
      if (seg.end < target.data.length) target.splitText(seg.end);
      if (seg.start > 0) target = target.splitText(seg.start);
      var mark = document.createElement('mark');
      if (kind === 'saved') {
        mark.className = 'sdflow-saved-hl';
        mark.dataset.saved = key;
      } else {
        mark.className = 'sdflow-hl';
        mark.dataset.note = key;
      }
      target.parentNode.insertBefore(mark, target);
      mark.appendChild(target);
      marks.push(mark);
    });
    if (kind === 'saved' && marks.length > 1) {
      marks.forEach(function (m, i) {
        m.dataset.seg = i === 0 ? 'first' : i === marks.length - 1 ? 'last' : 'mid';
      });
    }
    return marks.length > 0;
  }

  // 以 dataset 比对取 mark，不把 id 拼进选择器。
  function marksOf(kind, key) {
    var cls = kind === 'saved' ? 'mark.sdflow-saved-hl' : 'mark.sdflow-hl';
    return Array.prototype.filter.call(document.querySelectorAll(cls), function (m) {
      return (kind === 'saved' ? m.dataset.saved : m.dataset.note) === key;
    });
  }

  function unwrapMarks(key) {
    marksOf('note', key).forEach(function (m) {
      var parent = m.parentNode;
      while (m.firstChild) parent.insertBefore(m.firstChild, m);
      parent.removeChild(m);
      parent.normalize();
    });
  }

  // 给每条意见定位并（能的话）高亮；status: 'hl' | 'unmarked'（已定位但没高亮上）| 'orphan'（对不上）。
  // 找不到起点时：图内划选的意见、或原文在正文出现多处而前后文无法区分，都记 unmarked，不记 orphan。
  function unlocatedStatus(body, note) {
    if (!body) return 'orphan';
    return note.inFigure || (note.quote && body.textContent.indexOf(note.quote) >= 0) ? 'unmarked' : 'orphan';
  }

  // 定位一条意见并（能的话）高亮，返回 status。图内划选的意见不在正文里找：
  // 原文与正文某处同名时会被高亮到那里（RVP-13）。
  function highlightOne(note, key, kind) {
    var body = docBodyByLabel(note.doc);
    if (body && note.inFigure) return 'unmarked';
    var idx = body ? locateNote(body.textContent, note) : -1;
    if (idx < 0) return unlocatedStatus(body, note);
    var range = rangeAt(body, idx, note.quote.length);
    return range && wrapRange(range, key, kind) ? 'hl' : 'unmarked';
  }

  function restoreHighlights() {
    // 与已落盘版重复的暂存意见不在 view 里，不显示也不高亮。
    view.forEach(function (v) { v.note.status = highlightOne(v.note, v.note.id, 'note'); });
    savedNotes.forEach(function (sn) { sn.status = highlightOne(sn, sn.key, 'saved'); });
  }

  // ── 选区暂存与「写意见」按钮 ─────────────────────────────────────────────────
  var annotateBtn = document.createElement('button');
  annotateBtn.type = 'button';
  annotateBtn.id = 'sdflow-annotate';
  annotateBtn.textContent = '写意见';
  annotateBtn.hidden = true;
  document.body.appendChild(annotateBtn);

  function bodyOf(node) {
    var el = elementOf(node);
    return el && el.closest ? el.closest('#main .doc-body') : null;
  }

  function captureSelection() {
    var sel = window.getSelection();
    if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return null;
    var r = sel.getRangeAt(0);
    var body = bodyOf(r.startContainer);
    if (!body) return null;
    var endBody = bodyOf(r.endContainer);
    if (!endBody) {
      // 终点在正文之外时，只接受三击末段的形态：终点紧接本正文之后（两者之间只有空白），
      // 此时收到本正文末尾。其余（拖到侧栏、页尾两节、其他文档标题，或途经其他 .doc-body）一律拒绝。
      var tail = document.createRange();
      tail.setStart(body, body.childNodes.length);
      tail.setEnd(r.endContainer, r.endOffset);
      // 「写意见」按钮可能停靠在正文之后，它的文字不算选区跨过的内容。
      var gap = tail.cloneContents();
      var dock = gap.querySelector ? gap.querySelector('#sdflow-annotate') : null;
      if (dock) dock.parentNode.removeChild(dock);
      if (/\S/.test(gap.textContent)) return null;
      r = r.cloneRange();
      r.setEnd(body, body.childNodes.length);
    } else if (endBody !== body) {
      return null;
    }
    var full = r.toString();
    if (!/\S/.test(full)) return null;
    var pre = document.createRange();
    pre.selectNodeContents(body);
    pre.setEnd(r.startContainer, r.startOffset);
    var start = pre.toString().length;
    var ctx = selectionContext(body.textContent, start, full.length);
    var heading = '';
    Array.prototype.forEach.call(body.querySelectorAll('h1, h2, h3, h4, h5, h6'), function (h) {
      if (r.comparePoint(h, 0) === -1) heading = h.textContent.replace(/\s+/g, ' ').trim();
    });
    var startEl = elementOf(r.startContainer);
    return {
      range: r.cloneRange(),
      body: body,
      start: start,
      truncated: ctx.quote.length < full.length,
      section: body.parentNode,
      inFigure: !!(startEl && startEl.closest('svg')),
      docLabel: body.parentNode.getAttribute('data-label'),
      heading: heading,
      quote: ctx.quote,
      before: ctx.before,
      after: ctx.after,
    };
  }

  // 按钮紧随选区所在的文档节之后，划选后按 Tab 先到它，不必越过后面所有文档里的链接（D14）。
  // 按钮正拿着焦点时不挪：挪动会让它失焦。
  function dockAnnotateBtn() {
    if (!pending || !pending.section || document.activeElement === annotateBtn) return;
    if (annotateBtn.previousElementSibling !== pending.section) {
      pending.section.parentNode.insertBefore(annotateBtn, pending.section.nextSibling);
    }
  }

  function placeAnnotateBtn() {
    if (!pending || annotateBtn.hidden) return;
    var rects = pending.range.getClientRects();
    var rect = rects.length ? rects[rects.length - 1] : pending.range.getBoundingClientRect();
    var top = rect.bottom + 8;
    if (top > window.innerHeight - 44) top = rect.top - 44;
    // 选区滚出视口时按钮钉在视口边缘，仍然点得到。
    top = Math.min(Math.max(8, top), window.innerHeight - 44);
    var left = Math.min(Math.max(8, rect.right), window.innerWidth - 100);
    annotateBtn.style.top = top + 'px';
    annotateBtn.style.left = left + 'px';
  }

  function hideAnnotateBtn() { annotateBtn.hidden = true; }

  document.addEventListener('selectionchange', function () {
    if (dlg || copyState) return;
    var cap = captureSelection();
    if (cap) {
      pending = cap;
      dockAnnotateBtn();
      annotateBtn.hidden = false;
      placeAnnotateBtn();
    } else if (document.activeElement !== annotateBtn) {
      pending = null;
      hideAnnotateBtn();
    }
  });
  window.addEventListener('scroll', placeAnnotateBtn, { passive: true });
  window.addEventListener('resize', placeAnnotateBtn);
  // 点按钮会让选区丢失：mousedown 阻止默认行为，选区保持，pending 里也另存了 Range。
  annotateBtn.addEventListener('mousedown', function (e) { e.preventDefault(); });
  annotateBtn.addEventListener('click', function () { if (pending) openDialog('new', null, annotateBtn); });

  // ── 对话框：意见输入 ────────────────────────────────────────────────────────
  function makeButton(text, cls) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'sdflow-btn' + (cls ? ' ' + cls : '');
    b.textContent = text;
    return b;
  }

  function makeOverlay(id, titleText) {
    var overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.hidden = true;
    var panel = document.createElement('div');
    panel.className = 'dlg-panel';
    panel.id = id;
    panel.setAttribute('role', 'dialog');
    panel.setAttribute('aria-modal', 'true');
    panel.setAttribute('aria-labelledby', id + '-title');
    var h = document.createElement('h2');
    h.id = id + '-title';
    h.textContent = titleText;
    panel.appendChild(h);
    overlay.appendChild(panel);
    document.body.appendChild(overlay);
    return { overlay: overlay, panel: panel, title: h };
  }

  var noteDlg = makeOverlay('sdflow-note-dialog', '写意见');
  var dlgQuote = document.createElement('blockquote');
  dlgQuote.className = 'dlg-quote';
  var dlgLabel = document.createElement('label');
  dlgLabel.htmlFor = 'sdflow-note-text';
  dlgLabel.className = 'sr-only';
  dlgLabel.textContent = '意见';
  var dlgText = document.createElement('textarea');
  dlgText.id = 'sdflow-note-text';
  dlgText.rows = 5;
  dlgText.setAttribute('aria-describedby', 'sdflow-note-error');
  // 空意见的错误写进这个 role=status 节点（平时为空），读屏才会读出来。
  var dlgError = document.createElement('p');
  dlgError.className = 'dlg-error';
  dlgError.id = 'sdflow-note-error';
  dlgError.setAttribute('role', 'status');
  var dlgHint = document.createElement('p');
  dlgHint.className = 'dlg-hint';
  var HINT = 'Ctrl/⌘ + Enter 保存，Esc 取消';
  dlgHint.textContent = HINT;
  var dlgActions = document.createElement('div');
  dlgActions.className = 'dlg-actions';
  var dlgCancel = makeButton('取消');
  var dlgSave = makeButton('保存', 'primary');
  dlgActions.appendChild(dlgCancel);
  dlgActions.appendChild(dlgSave);
  [dlgQuote, dlgLabel, dlgText, dlgError, dlgHint, dlgActions].forEach(function (el) { noteDlg.panel.appendChild(el); });

  function focusables(panel) {
    return Array.prototype.filter.call(panel.querySelectorAll('textarea, button'), function (el) {
      return !el.disabled && !el.hidden && el.getClientRects().length > 0;
    });
  }

  // 对话框打开期间在 document 上统一处理键盘：焦点落到页面主体时 Esc 也能关闭、Tab 能回到对话框内。
  // 输入法组字期间的按键留给输入法；对话框关闭后这里什么都不做。
  document.addEventListener('keydown', function (e) {
    var open = copyState ? copyDlg : dlg ? noteDlg : null;
    if (!open) return;
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Escape') {
      e.preventDefault();
      if (open === copyDlg) closeCopy(); else closeDialog(true);
      return;
    }
    if (e.key !== 'Tab') return;
    var items = focusables(open.panel);
    if (!items.length) return;
    var first = items[0], last = items[items.length - 1];
    if (!open.panel.contains(document.activeElement)) { e.preventDefault(); first.focus(); return; }
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  // 正文区域平时不带 tabindex：带了的话，在正文里按下鼠标划选会让 main 拿到焦点，
  // 之后的 Tab 从正文开头起算而不是从选区起算，「写意见」按钮紧随文档节之后就白放了（D14）。
  // 只在要把焦点移到正文时临时设上，失焦即撤掉。
  var mainEl = document.getElementById('main');
  function focusMain() {
    mainEl.tabIndex = -1;
    mainEl.focus();
  }
  mainEl.addEventListener('blur', function () { mainEl.removeAttribute('tabindex'); });
  // 「跳到正文」照旧把焦点移进正文（默认的锚点跳转只滚动，main 不带 tabindex 时拿不到焦点）。
  document.querySelector('.skip-link').addEventListener('click', focusMain);

  // 关闭对话框后还原焦点：目标仍在文档中、未隐藏、未禁用、有布局盒才聚焦，否则聚焦正文区域。
  function restoreFocus(target) {
    if (target && document.body.contains(target) && !target.hidden && !target.disabled && target.getClientRects().length > 0) {
      target.focus();
      return;
    }
    focusMain();
  }

  function clearNoteError() {
    dlgError.textContent = '';
    dlgText.removeAttribute('aria-invalid');
  }

  function openDialog(mode, note, opener) {
    dlg = { mode: mode, noteId: note ? note.id : null, returnFocus: opener || document.activeElement };
    noteDlg.title.textContent = mode === 'edit' ? '编辑意见' : '写意见';
    dlgQuote.textContent = (note ? note.quote : pending.quote).slice(0, 300);
    dlgText.value = note ? note.comment : '';
    clearNoteError();
    dlgHint.textContent = HINT;
    noteDlg.overlay.hidden = false;
    dlgText.focus();
  }

  function closeDialog(restoreSelection) {
    var d = dlg;
    if (!d) return;
    dlg = null;
    noteDlg.overlay.hidden = true;
    if (d.mode === 'new' && restoreSelection && pending) {
      // 取消：把选区放回去，「写意见」按钮仍在。
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(pending.range);
      annotateBtn.hidden = false;
      placeAnnotateBtn();
    }
    restoreFocus(d.returnFocus);
  }

  function saveDialog() {
    var comment = dlgText.value.trim();
    if (!comment) {
      dlgError.textContent = '意见不能为空';
      dlgText.setAttribute('aria-invalid', 'true');
      dlgText.focus();
      return;
    }
    var d = dlg;
    if (d.mode === 'edit') {
      var existing = findNote(d.noteId);
      if (existing) { existing.comment = comment; existing.copied = false; }
      saveState();
      renderNotes();
      // 「编辑」按钮随意见栏重建；改回与已落盘版相同的意见不再显示，找不到就交给 restoreFocus 落到正文。
      var item = noteItemOf('note', d.noteId);
      d.returnFocus = item ? item.querySelector('.edit-btn') : null;
      closeDialog(false);
      return;
    }
    var note = {
      id: newNoteId(), n: state.next++, doc: pending.docLabel, heading: pending.heading, quote: pending.quote,
      before: pending.before, after: pending.after, comment: comment, copied: false, inFigure: !!pending.inFigure,
    };
    window.getSelection().removeAllRanges();
    // 引用被截断时按截断后的引用重算范围，与重新加载后按引用定位的范围一致。
    var saveRange = pending.truncated ? rangeAt(pending.body, pending.start, pending.quote.length) : null;
    note.status = wrapRange(saveRange || pending.range, note.id, 'note') ? 'hl' : 'unmarked';
    state.notes.push(note);
    saveState();
    renderNotes();
    pending = null;
    hideAnnotateBtn();
    d.returnFocus = null;
    closeDialog(false);
  }

  dlgSave.addEventListener('click', saveDialog);
  dlgCancel.addEventListener('click', function () { closeDialog(true); });
  dlgText.addEventListener('input', clearNoteError);
  dlgText.addEventListener('keydown', function (e) {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveDialog(); }
  });

  // ── 意见栏 ──────────────────────────────────────────────────────────────────
  var notesRoot = document.getElementById('sdflow-notes');
  var notesTitle = document.createElement('h2');
  notesTitle.tabIndex = -1;
  var notesEmpty = document.createElement('p');
  notesEmpty.className = 'notes-empty';
  notesEmpty.textContent = '在正文划选文字，点「写意见」。';
  var notesActions = document.createElement('div');
  notesActions.className = 'notes-actions';
  var copyBtn = makeButton('复制意见', 'primary');
  copyBtn.id = 'sdflow-copy-new';
  var copyAllBtn = makeButton('复制全部');
  copyAllBtn.id = 'sdflow-copy-all';
  var clearBtn = makeButton('清空');
  clearBtn.id = 'sdflow-clear';
  [copyBtn, copyAllBtn, clearBtn].forEach(function (b) { notesActions.appendChild(b); });
  var notesList = document.createElement('ol');
  notesList.className = 'notes-list';
  // 「定位」找不到高亮时在这里提示（role=status，平时为空）。
  var jumpHint = document.createElement('p');
  jumpHint.className = 'notes-hint';
  jumpHint.id = 'sdflow-jump-hint';
  jumpHint.setAttribute('role', 'status');
  var savedWarn = document.createElement('p');
  savedWarn.className = 'notes-empty';
  savedWarn.setAttribute('role', 'status');
  savedWarn.textContent = '已落盘意见无法读取';
  savedWarn.hidden = !savedUnreadable;
  var savedGroup = document.createElement('section');
  savedGroup.className = 'saved-group';
  savedGroup.setAttribute('aria-label', '已落盘意见');
  savedGroup.hidden = true;
  var savedTitle = document.createElement('h3');
  var savedList = document.createElement('ol');
  savedList.className = 'notes-list';
  savedGroup.appendChild(savedTitle);
  savedGroup.appendChild(savedList);
  [notesTitle, notesEmpty, notesActions, jumpHint, notesList, savedWarn, savedGroup].forEach(function (el) { notesRoot.appendChild(el); });
  notesRoot.hidden = false;
  document.body.classList.add('has-notes');

  var STATUS_TEXT = { orphan: '原文已对不上，仅列出', unmarked: '未在正文高亮' };
  var SAVED_STATUS_TEXT = { orphan: '原文已变', unmarked: '未在正文高亮' };
  var clearTimer = null;

  function appendBadge(parent, text) {
    var b = document.createElement('span');
    b.className = 'note-badge';
    b.textContent = text;
    parent.appendChild(b);
  }

  // 暂存意见被合并掉（不显示）时，它在正文的暂存高亮一并拿掉，不留无主的 mark。
  // 编辑回与已落盘版相同、或改过的意见复制后（RVP-19）都会从列表消失。
  function refreshView() {
    view = mergeNotes(state.notes, savedNotes);
    var shown = Object.create(null);
    view.forEach(function (v) { shown[v.note.id] = true; });
    state.notes.forEach(function (n) { if (!shown[n.id]) unwrapMarks(n.id); });
  }

  // 已落盘意见的处理行：取该意见 id 对应的处置；处置块读不出来显示「无法读取」。
  function dispositionLine(sn) {
    if (!dispositionsParsed.ok) return '处理：无法读取';
    return '处理：' + dispositionText(sn.id ? dispositionsParsed.map[sn.id] : null);
  }

  // 意见栏的一条。o = {className, kind, key, head, badges, quote, comment, disposition?, buttons}；
  // kind 即 dataset 名（'note' → data-note，'saved' → data-saved）。内容一律 textContent，没有按钮时不建按钮行。
  function buildNoteItem(o) {
    var li = document.createElement('li');
    li.className = o.className;
    li.dataset[o.kind] = o.key;
    var head = document.createElement('div');
    head.className = 'note-head';
    head.textContent = o.head;
    o.badges.forEach(function (text) { appendBadge(head, text); });
    var quote = document.createElement('div');
    quote.className = 'note-quote';
    quote.textContent = o.quote;
    var comment = document.createElement('div');
    comment.className = 'note-comment';
    comment.textContent = o.comment;
    [head, quote, comment].forEach(function (el) { li.appendChild(el); });
    if (o.disposition) {
      var disposition = document.createElement('div');
      disposition.className = 'note-disposition';
      disposition.textContent = o.disposition;
      li.appendChild(disposition);
    }
    if (o.buttons.length) {
      var actions = document.createElement('div');
      actions.className = 'note-actions';
      o.buttons.forEach(function (b) { actions.appendChild(b); });
      li.appendChild(actions);
    }
    return li;
  }

  // 「定位」只给找得到位置的意见（已高亮，或已定位但没高亮上）。
  function jumpButtons(kind, key, status) {
    if (status !== 'hl' && status !== 'unmarked') return [];
    var jump = makeButton('定位');
    jump.classList.add('jump-btn');
    jump.addEventListener('click', function () { jumpTo(kind, key); });
    return [jump];
  }

  // 意见栏里某条意见的 <li>：以 dataset 比对取（同 marksOf，不把 id 拼进选择器）；找不到返回 null。
  function noteItemOf(kind, key) {
    var list = kind === 'saved' ? savedList : notesList;
    return Array.prototype.filter.call(list.children, function (li) { return li.dataset[kind] === key; })[0] || null;
  }

  // 暂存或已落盘意见有变动后调用：重算 view 再重画意见栏。
  function renderNotes() {
    refreshView();
    drawNotes();
  }

  function drawNotes() {
    // 重置「清空」确认态前先撤掉旧定时器，否则它会把之后新进入的确认态提前还原。
    clearTimeout(clearTimer);
    jumpHint.textContent = '';
    var total = view.length;
    var fresh = view.filter(function (v) { return !v.note.copied; }).length;
    notesTitle.textContent = '意见（' + total + '）';
    notesEmpty.hidden = total > 0;
    copyBtn.disabled = fresh === 0;
    copyBtn.textContent = '复制意见' + (total ? '（' + fresh + '）' : '');
    copyBtn.title = total === 0 ? '还没有意见' : fresh === 0 ? '没有未复制的意见，可用「复制全部」' : '';
    copyAllBtn.disabled = total === 0;
    clearBtn.disabled = state.notes.length === 0;
    clearBtn.textContent = '清空';
    clearBtn.dataset.armed = '';
    while (notesList.firstChild) notesList.removeChild(notesList.firstChild);
    view.forEach(function (v) {
      var note = v.note;
      var badges = [];
      if (v.modified) badges.push('已修改，未落盘');
      if (note.copied) badges.push('已复制');
      if (STATUS_TEXT[note.status]) badges.push(STATUS_TEXT[note.status]);
      var edit = makeButton('编辑');
      edit.classList.add('edit-btn');
      edit.addEventListener('click', function () { openDialog('edit', note, edit); });
      var del = makeButton('删除');
      del.classList.add('del-btn');
      del.addEventListener('click', function () { deleteNote(note.id); });
      notesList.appendChild(buildNoteItem({
        className: 'note-item', kind: 'note', key: note.id,
        head: '#' + note.n + ' ' + note.doc + (note.heading ? ' › ' + note.heading : ''),
        badges: badges, quote: note.quote, comment: note.comment,
        buttons: jumpButtons('note', note.id, note.status).concat([edit, del]),
      }));
    });
    renderSaved();
  }

  // 已落盘意见：只读；0 条时整组不显示。
  function renderSaved() {
    while (savedList.firstChild) savedList.removeChild(savedList.firstChild);
    savedGroup.hidden = savedNotes.length === 0;
    savedTitle.textContent = '已落盘意见（' + savedNotes.length + '）';
    savedNotes.forEach(function (sn, k) {
      var where = sn.path ? sn.path + (sn.line ? ':' + sn.line : '') : sn.doc;
      savedList.appendChild(buildNoteItem({
        className: 'note-item saved-item', kind: 'saved', key: sn.key,
        head: '已落盘 ' + (k + 1) + ' ' + where + (sn.heading ? ' › ' + sn.heading : ''),
        badges: SAVED_STATUS_TEXT[sn.status] ? [SAVED_STATUS_TEXT[sn.status]] : [],
        quote: sn.quote, comment: sn.comment, disposition: dispositionLine(sn),
        buttons: jumpButtons('saved', sn.key, sn.status),
      }));
    });
  }

  function findSaved(key) {
    for (var i = 0; i < savedNotes.length; i++) if (savedNotes[i].key === key) return savedNotes[i];
    return null;
  }

  function jumpTo(kind, key) {
    var marks = marksOf(kind, key);
    if (marks.length) {
      jumpHint.textContent = '';
      marks[0].scrollIntoView({ block: 'center' });
      marks.forEach(function (m) { m.classList.add('flash'); });
      setTimeout(function () { marks.forEach(function (m) { m.classList.remove('flash'); }); }, 1200);
      return;
    }
    // 没有高亮可去（图内划选、原文出现多处，或高亮已被拿掉）：滚到所在文档并提示。
    var note = kind === 'saved' ? findSaved(key) : findNote(key);
    if (!note) return;
    var body = docBodyByLabel(note.doc);
    if (body) body.parentNode.scrollIntoView({ block: 'start' });
    if (note.status === 'hl') {
      // 记着已高亮、mark 却不在了：改标「未在正文高亮」，重画后焦点放回这条的「定位」。
      note.status = 'unmarked';
      renderNotes();
      var item = noteItemOf(kind, key);
      var btn = item && item.querySelector('.jump-btn');
      if (btn) btn.focus();
    }
    jumpHint.textContent = '未在正文高亮';
  }

  function deleteNote(id) {
    unwrapMarks(id);
    state.notes = state.notes.filter(function (x) { return x.id !== id; });
    saveState();
    renderNotes();
    notesTitle.focus();
  }

  // 清空要点两次：第一次变成「再点一次确认」，4 秒内不点就还原。
  clearBtn.addEventListener('click', function () {
    if (clearBtn.dataset.armed === '1') {
      clearTimeout(clearTimer);
      state.notes.forEach(function (x) { unwrapMarks(x.id); });
      state.notes = [];
      saveState();
      renderNotes();
      notesTitle.focus();
      return;
    }
    clearBtn.dataset.armed = '1';
    clearBtn.textContent = '再点一次确认清空';
    clearTimer = setTimeout(function () { clearBtn.dataset.armed = ''; clearBtn.textContent = '清空'; }, 4000);
  });

  // ── 复制 ────────────────────────────────────────────────────────────────────
  var copyDlg = makeOverlay('sdflow-copy-dialog', '复制意见');
  var copyStatus = document.createElement('p');
  copyStatus.className = 'dlg-hint';
  copyStatus.id = 'sdflow-copy-status';
  copyStatus.setAttribute('role', 'status');
  var copyLabel = document.createElement('label');
  copyLabel.htmlFor = 'sdflow-copy-text';
  copyLabel.className = 'sr-only';
  copyLabel.textContent = '意见全文';
  var copyText = document.createElement('textarea');
  copyText.id = 'sdflow-copy-text';
  copyText.rows = 14;
  copyText.readOnly = true;
  var copyActions = document.createElement('div');
  copyActions.className = 'dlg-actions';
  var markBtn = makeButton('标记为已复制');
  markBtn.hidden = true;
  var copyClose = makeButton('关闭', 'primary');
  copyClose.id = 'sdflow-copy-close';
  copyActions.appendChild(markBtn);
  copyActions.appendChild(copyClose);
  [copyStatus, copyLabel, copyText, copyActions].forEach(function (el) { copyDlg.panel.appendChild(el); });

  function markCopied(ids) {
    state.notes.forEach(function (n) { if (ids.indexOf(n.id) >= 0) n.copied = true; });
    saveState();
    renderNotes();
  }

  // 依次试 Clipboard API、execCommand；resolve(true/false)，不抛错。
  function autoCopy(text) {
    return new Promise(function (resolve) {
      function legacy() {
        var ok = false;
        try { copyText.focus(); copyText.select(); ok = document.execCommand('copy'); } catch (e) { ok = false; }
        resolve(ok);
      }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () { resolve(true); }, legacy);
          return;
        }
      } catch (e) { /* 落到 execCommand */ }
      legacy();
    });
  }

  function doCopy(all, opener) {
    var picked = view.map(function (v) { return v.note; })
      .filter(function (n) { return all || !n.copied; });
    if (!picked.length) return;
    var text = buildCopyText({
      title: document.title,
      pathname: location.pathname,
      copiedAt: formatLocalTime(new Date()),
      notes: picked.map(function (n) {
        var out = storable(n);
        out.path = pathOfDoc(n.doc);
        return out;
      }),
    });
    var ids = picked.map(function (n) { return n.id; });
    var myState = { ids: ids, returnFocus: opener };
    copyState = myState;
    copyText.value = text;
    copyStatus.textContent = '正在复制…';
    markBtn.hidden = true;
    copyDlg.overlay.hidden = false;
    copyText.focus();
    copyText.select();
    autoCopy(text).then(function (ok) {
      // 剪贴板已写入就标已复制，不论对话框此时是否还是本次那个
      if (ok) markCopied(ids);
      if (copyState !== myState) return;
      copyText.focus();
      copyText.select();
      if (ok) {
        copyStatus.textContent = '已复制 ' + ids.length + ' 条意见到剪贴板。若粘贴不出来，可在下面已全选的文本框里手动复制。';
      } else {
        copyStatus.textContent = '自动复制失败。下面的全文已全选，请按 Ctrl/⌘ + C 手动复制。';
        markBtn.hidden = false;
      }
    });
  }

  function closeCopy() {
    var c = copyState;
    if (!c) return;
    copyState = null;
    copyDlg.overlay.hidden = true;
    restoreFocus(c.returnFocus);
  }

  copyBtn.addEventListener('click', function () { doCopy(false, copyBtn); });
  copyAllBtn.addEventListener('click', function () { doCopy(true, copyAllBtn); });
  copyClose.addEventListener('click', closeCopy);
  markBtn.addEventListener('click', function () {
    if (copyState) markCopied(copyState.ids);
    markBtn.hidden = true;
    copyStatus.textContent = '已标记为已复制。';
  });

  drawRecordsSection();
  drawRevisionsSection();

  loadState();
  refreshView();
  restoreHighlights();
  drawNotes();
})();
</script>
</body>
</html>
